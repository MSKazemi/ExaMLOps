# GitLab CI/CD pipeline for seanergys-modelzoo
# Stages: sanity → validate → lint → test
# Runs on GitLab shared runners

stages:
  - sanity
  - validate
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "${CI_PROJECT_DIR}:${PYTHONPATH}"

# -----------------------------------------------------------------------------
# CACHE
# -----------------------------------------------------------------------------
.pip_cache: &pip_cache
  key: "${CI_COMMIT_REF_SLUG}-pip"
  paths:
    - .cache/pip

# -----------------------------------------------------------------------------
# STAGE 1: SANITY (always runs)
# -----------------------------------------------------------------------------
sanity:python-syntax:
  stage: sanity
  image: python:3.12-slim
  script:
    - find seanergys_modelzoo ci tests -name "*.py" -print0 | xargs -0 -r python -m py_compile
  allow_failure: false

sanity:check-structure:
  stage: sanity
  image: python:3.12-slim
  script:
    - test -f pyproject.toml
    - test -d seanergys_modelzoo
    - test -d ci
    - test -d tests
    - echo "Repository structure OK"

sanity:check-secrets:
  stage: sanity
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - chmod +x ci/check_secrets.sh
    - ./ci/check_secrets.sh .
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 2: VALIDATE (YAML/JSON)
# -----------------------------------------------------------------------------
validate:yaml-json:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install --quiet pyyaml
    - python ci/validate_yaml.py
  allow_failure: false

# -----------------------------------------------------------------------------
# STAGE 3: LINT
# -----------------------------------------------------------------------------
lint:python:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff
    - ruff check seanergys_modelzoo ci tests
  allow_failure: true

lint:format:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff
    - ruff format --check seanergys_modelzoo ci tests
  allow_failure: true

lint:mypy:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet mypy types-PyYAML
    - mypy seanergys_modelzoo ci tests --ignore-missing-imports --explicit-package-bases
  allow_failure: true

# -----------------------------------------------------------------------------
# STAGE 4: TEST
# -----------------------------------------------------------------------------
test:unit:
  stage: test
  image: python:3.12-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev
  script:
    - poetry run pytest tests/unit/ -v
  allow_failure: false

test:smoke:
  stage: test
  image: python:3.12-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev
  script:
    - poetry run pytest tests/smoke/ -v
  allow_failure: false

test:import-check:
  stage: test
  image: python:3.12-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev,ci
  script:
    - poetry run python -c "from seanergys_modelzoo.logger.seanergys_logger import SeanergysLogger; print('Import OK')"
  allow_failure: false

test:smoke-models:
  stage: test
  image: python:3.12-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev,ci
  script:
    - poetry run pytest tests/smoke/test_models_smoke.py -v
  allow_failure: false

test:smoke-datasets:
  stage: test
  image: python:3.12-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev,ci
  script:
    - poetry run pytest tests/smoke/test_datasets_smoke.py -v
  allow_failure: false

test:integration:
  stage: test
  image: python:3.12-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev,ci
    - poetry run python scripts/create_sample_data.py
  script:
    - poetry run pytest tests/integration/ -v
  allow_failure: false

# Dependency vulnerability scan
test:audit:
  stage: test
  image: python:3.12-slim
  cache:
    - <<: *pip_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry poetry-plugin-export
    - poetry config virtualenvs.create false
    - poetry install --no-interaction
    - pip install --quiet pip-audit
  script:
    - poetry export -f requirements.txt --without-hashes --with dev,ci -o /tmp/poetry-audit-reqs.txt
    - pip-audit -r /tmp/poetry-audit-reqs.txt
  allow_failure: true
