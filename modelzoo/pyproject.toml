[project]
name = "seanergys-modelzoo"
version = "0.1.0"
description = ""
authors = [
    {name = "Mohsen Seyedkazemi Ardebili",email = "mohsen.seyedkazemi@unibo.it"}
]
readme = "README.md"
# Capped at <3.15: torch/triton require Python <3.15 (as of 2025)
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]


[tool.pytest.ini_options]
markers = [
    "zenodo: tests that download from Zenodo (require network)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "ruff (>=0.15.6,<0.16.0)",
    "pydantic (>=2.12.5,<3.0.0)"
]
ci = [
    "pydantic>=2.12.5,<3.0.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "xgboost",
    "torch",
    "sentence-transformers",
    "pyarrow",
]
