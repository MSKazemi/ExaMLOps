[project]
name = "seanergys-modelzoo"
version = "0.23.0"
description = ""
authors = [
    {name = "Mohsen Seyedkazemi Ardebili",email = "mohsen.seyedkazemi@unibo.it"}
]
readme = "README.md"
# Capped at <3.15: torch/triton require Python <3.15 (as of 2025)
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]


[tool.ruff]
# Ruff config scoped to modelzoo so it does not inherit the stricter root pyproject.
# Upstream code uses old-style typing (Dict/List/Optional/Tuple) intentionally;
# only enforce the minimal correctness rules here.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Upstream model library — only enforce hard syntax / import errors.
# F401/F811/F541 are widespread in upstream code and not ours to clean up.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F811", "F541"]

[tool.pytest.ini_options]
markers = [
    "zenodo: tests that download from Zenodo (require network)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "ruff (>=0.15.6,<0.16.0)",
    "pydantic (>=2.12.5,<3.0.0)"
]
ci = [
    "pydantic>=2.12.5,<3.0.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "xgboost",
    "torch",
    "sentence-transformers",
    "pyarrow",
]
