[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "examlops-pipelines"
version = "0.23.1"
requires-python = ">=3.12"
description = "ExaMLOps training & model-lifecycle pipelines (Prefect orchestration)."
dependencies = [
    "mlflow==3.11.1",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "prefect>=3.0.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*"]
