[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "examlops-pipelines"
version = "0.60.0"
requires-python = ">=3.12"
description = "ExaMLOps training & model-lifecycle pipelines (Prefect orchestration)."
dependencies = [
    "mlflow==3.16.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "prefect>=3.0.0,<4.0",
    "paramiko>=3.5.0",  # SSH transport for the HPC scheduler adapter (Flux/Slurm over SSH)
    # The data-contract engine (ADR 0005 clause 1): `pipelines.contracts` compiles a contract to a
    # Pandera schema and names the rows a check failed on. Without it the pandas-only engine gives
    # the same verdict (tests/unit/test_data_contract_engines.py), so a missing Pandera costs report
    # precision, never a gate.
    "pandera[pandas]>=0.33",
    # Transitive-dependency pin (prefect pulls fastapi): cap <0.137 so that installing this
    # package inside the ray-serving image does not upgrade the FastAPI that ray 2.55.0's
    # @serve.ingress must cloudpickle. fastapi>=0.137 has an unpicklable _thread.lock and
    # crash-loops the serve container ("cannot pickle '_thread.lock' object"). 0.136.x works.
    "fastapi>=0.136.3,<0.137",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*"]
