name: DemoAnomaly
model_class: DemoAnomaly
config_class: demoanomaly_config.DemoAnomalyConfiguration
task_type: classification
framework: sklearn
enabled: true
seanerbus_uuid: ecd84faa-ef79-48e4-93b5-5b32a515d989

# IsolationForest hyperparameters (forwarded to IsolationForestClassifier).
# contamination ≈ anomaly fraction in SyntheticAnomalyDataset (100 / 500 = 0.2).
model:
  hyperparameters:
    contamination: 0.2
    random_state: 42
    n_jobs: -1

# SyntheticAnomalyDataset generates data in-code — no Zenodo/MinIO download.
# files/filters are intentionally empty; the dataset draws disjoint train/validation
# samples from the split name (passed through by the pipeline).
datasets:
  - name: SyntheticAnomalyDataset
    batch_size: 1
    input_features: [embedding]
    output_features: [is_anomaly]
    splits:
      train: {}
      validation: {}

lifecycle:
  - {name: Staging,    metric: accuracy, threshold: 0.70, direction: higher_is_better}
  - {name: Canary,     metric: accuracy, threshold: 0.80, direction: higher_is_better}
  - {name: Production, metric: accuracy, threshold: 0.85, direction: higher_is_better}

serving:
  model_id: demoanomaly
  aliases: [Production, Canary, Staging]

prefect:
  schedule: "0 2 * * *"
  deployment_name: examlops-demoanomaly-nightly
  work_pool: default-agent
  concurrency_limit: 1

inference:
  input_schema:
    embedding: list[float]
  output_schema:
    is_anomaly: int
