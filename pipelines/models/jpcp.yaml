name: JPCP
model_class: JPCP
config_class: jpcp_config.JPCPConfiguration
task_type: regression
framework: sklearn
enabled: true

model:
  embedding_type: INT
  hyperparameters:
    n_jobs: -1

datasets:
  - name: PM100Dataset
    backend: zenodo
    cache_dir: .data_cache/pm100
    batch_size: 1
    columns: [num_nodes_req, user_id, node_power_consumption, num_nodes_alloc]
    input_features: [num_nodes_req_cat, user_id_cat]
    output_features: [node_power_consumption, num_nodes_alloc]
    splits:
      train:
        filters:
          - [submit_time, ">=", "2020-05-01T00:00:00+00:00"]
          - [submit_time, "<=", "2020-09-01T00:00:00+00:00"]
      validation:
        filters:
          - [submit_time, ">=", "2020-09-01T00:00:00+00:00"]
          - [submit_time, "<=", "2020-10-01T00:00:00+00:00"]

  - name: FDataDataset
    backend: zenodo
    cache_dir: .data_cache/fdata
    batch_size: 1
    input_features: [embedding]
    output_features: [avgpcon, nnuma]
    splits:
      train:
        files: ["23_12", "24_01"]
        filters:
          - [adt, ">=", "2023-12-01"]
          - [adt, "<=", "2024-01-31"]
      validation:
        files: ["24_02"]
        filters:
          - [adt, ">=", "2024-02-01"]
          - [adt, "<=", "2024-02-28"]

lifecycle:
  - {name: Staging,    metric: rmse, threshold: 200.0, direction: lower_is_better}
  - {name: Canary,     metric: rmse, threshold: 100.0, direction: lower_is_better}
  - {name: Production, metric: rmse, threshold:  50.0, direction: lower_is_better}

serving:
  model_id: jpcp
  aliases: [Production, Canary, Staging]

prefect:
  schedule: "0 2 * * *"
  deployment_name: examlops-jpcp-nightly
  work_pool: default-agent
  concurrency_limit: 1

inference:
  input_schema:
    embedding: list[float]
  output_schema:
    power_per_node_watts: float
