# ExaMLOps — GitLab CI/CD (primary host)
#
# Pipeline: sanity → test (parallel DAG) → deploy → smoke → post-deploy
#
# Key improvements over the previous version:
#   • test:examlops always runs before every deploy (was change-triggered only)
#   • deploy:lxp requires test:examlops to pass (was optional — deploy could run
#     on a broken examlops test suite)
#   • New smoke stage: probes all critical services after deploy; auto-rolls back
#     to the previous commit if health checks fail (self-healing)
#   • Failure notification webhook (set NOTIFICATION_WEBHOOK_URL CI variable)
#   • JUnit test-report artifacts for all pytest jobs (visible in MR test tab)
#   • retry on Docker-dependent jobs (runner/DinD transient failures)
#   • deploy has an explicit 20-minute timeout (was unbounded)
#   • ruff format --check is now a hard failure (was || true)
#   • retrain script extracted to platform/ci/retrain_push_models.py
#   • post-deploy jobs depend on smoke:lxp (not directly on deploy:lxp)
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   LXP_SSH_KEY         masked, protected — ED25519 private key for lxp-cpu01
#   LXP_HOST_KEY        masked            — known_hosts entry for lxp-cpu01
#   LXP_USER                              — SSH username on the deploy node
#   LXP_HOST                              — hostname or IP of lxp-cpu01
#   LXP_DEPLOY_PATH                       — /opt/examlops
#   LXP_CONTROL_PLANE_URL                 — http://lxp-cpu01:18002
#   LXP_CONTROL_PLANE_TOKEN masked        — bearer token for /retrain + /api/changes
#
# Optional CI/CD variables:
#   EXAMLOPS_USE_REGISTRY     any value — enables the build/publish stages and switches
#                             deploy:lxp from building on the node to pulling prebuilt
#                             images. Read docs/guides/cicd.md#container-registry-opt-in
#                             before setting it: it needs the registry enabled on the
#                             project AND reachable from the LXP docker daemon.
#   GHCR_USER / GHCR_TOKEN           masked — enables publish:ghcr
#   DOCKERHUB_USER / DOCKERHUB_TOKEN masked — enables publish:dockerhub
#   NOTIFICATION_WEBHOOK_URL  masked — Slack-compatible webhook; enables notify:failure
#   SMOKE_STARTUP_WAIT        seconds to wait after compose-up before probing (default 45)
#   SMOKE_RETRY_COUNT         health-probe retry attempts (default 3)
#   SMOKE_RETRY_DELAY         seconds between retries (default 15)
#
# Runtime self-healing (separate from CI):
#   One-time setup on lxp-cpu01:  sudo bash platform/ci/setup_selfheal_systemd.sh
#   This installs a systemd timer that restarts unhealthy containers every 2 min.

workflow:
  auto_cancel:
    on_new_commit: interruptible  # cancel in-progress runs on re-push
  # Without these rules a branch with an open merge request builds TWICE for every push —
  # once as a branch pipeline and once as a merge-request pipeline — running the whole
  # 12-job suite twice against identical code. The `never` rule below is the only one that
  # removes work; every other entry exists to state a source explicitly so that adding this
  # block cannot silently stop a pipeline that used to run.
  #
  # Order matters and is the whole mechanism: the duplicate-suppressing `never` must be
  # evaluated BEFORE the catch-all branch rule, or the catch-all matches first and nothing
  # is ever suppressed. tests/unit/test_gitlab_ci_valid.py holds that ordering.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"   # the MR pipeline is the one to keep
    - if: $CI_COMMIT_TAG                                 # release gate
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH        # main → full suite + deploy
    - if: $CI_PIPELINE_SOURCE == "schedule"              # nightly green check
    - if: $CI_PIPELINE_SOURCE == "trigger"               # control-plane modelzoo webhook
    - if: $CI_PIPELINE_SOURCE == "pipeline"              # multi-project / parent-child
    - if: $CI_PIPELINE_SOURCE == "web"                   # manual run from the UI
    - if: $CI_PIPELINE_SOURCE == "api"
    # A branch that already has an open MR is covered by the MR pipeline above.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH                              # plain topic-branch push

stages:
  - sanity
  - test
  - build       # build every service image ONCE, push to the GitLab registry
  - scan        # vulnerability scan of what was just built
  - publish     # copy those exact digests to GHCR / Docker Hub (visibility, never a gate)
  - release     # tag pipelines only: turn the tag into a GitLab Release
  - deploy
  - smoke       # post-deploy health gate + auto-rollback
  - post-deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR:  "$CI_PROJECT_DIR/.cache/uv"
  PYTHONPATH:    "${CI_PROJECT_DIR}:${PYTHONPATH}"
  # Image naming. EXAMLOPS_IMAGE_PREFIX is what docker-compose.yml interpolates, so the
  # same compose file builds locally (default `examlops-*:latest`) and pulls in production.
  EXAMLOPS_IMAGE_PREFIX: "$CI_REGISTRY_IMAGE/examlops"
  EXAMLOPS_IMAGE_TAG: "$CI_COMMIT_SHA"
  SMOKE_STARTUP_WAIT: "45"
  SMOKE_RETRY_COUNT:  "3"
  SMOKE_RETRY_DELAY:  "15"

# ─── Cache anchors ────────────────────────────────────────────────────────────

.poetry_cache: &poetry_cache
  key: "$CI_COMMIT_REF_SLUG-poetry"
  paths:
    - .cache/pip

.uv_cache: &uv_cache
  key: "uv-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/uv
    - .venv

# ─── Reusable SSH setup (deploy, smoke, post-deploy) ─────────────────────────

.ssh_setup: &ssh_setup
  - apt-get update -qq && apt-get install -y -qq git openssh-client curl
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - printf '%s\n' "$LXP_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519
  - printf '%s\n' "$LXP_HOST_KEY" >> ~/.ssh/known_hosts
  - chmod 600 ~/.ssh/known_hosts

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: SANITY — fast checks that block everything on failure
# ═══════════════════════════════════════════════════════════════════════════

sanity:python-syntax:
  stage: sanity
  image: python:3.12-slim
  interruptible: true
  script:
    - >
      find platform/ pipelines/ serving/ tests/ tools/ usecases/
      -name "*.py" -print0
      | xargs -0 -r python -m py_compile

sanity:check-structure:
  stage: sanity
  image: python:3.12-slim
  interruptible: true
  script:
    - test -f pyproject.toml
    - test -d platform/cli/src/examlops
    - test -d platform/services/dashboard
    - test -d platform/services/control_plane
    - test -f platform/infra/docker-compose/docker-compose.yml
    # Models moved from pipelines/models/ to the use-case packs (ADR 0094 platform/use-case split);
    # verify the default pack's model dir instead of the retired pipelines/models/.
    - test -d usecases/seanergy/models
    - echo "Structure OK"

# D7 (ADR 0011): block any commit that introduces a plaintext secret. Uses the
# dependency-free built-in scanner (examlops.secrets.scan_text) so no external
# gitleaks/trufflehog binary is needed in CI. Fails the pipeline on any finding.
sanity:secret-scan:
  stage: sanity
  image: python:3.12-slim
  interruptible: true
  script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv
    - uv pip install -e ".[dev]"
    - .venv/bin/exa secrets scan platform/
    - .venv/bin/exa secrets scan pipelines/

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: TEST — parallel DAG; all jobs need both sanity jobs
# ═══════════════════════════════════════════════════════════════════════════

# ── ModelZoo: unit + smoke + integration (Poetry) ────────────────────────────
#
# Clones the real upstream modelzoo repo (main branch). Since 2026-08-07 modelzoo
# is no longer vendored in this repo at all — it is an upstream library, not part
# of ExaMLOps (ADR 0094) — so this job is the ONLY place its suite runs here.
# Triggered three ways:
#   1. Pipeline trigger — fired by the control plane when modelzoo pushes to main
#   2. Scheduled pipeline — catches any drift not covered by webhooks
#   3. Manually from a default-branch pipeline
#
# NON-BLOCKING, informational only — NOT a deploy gate.
# ModelZoo has its own CI/CD in its own repo (software/modelzoo) which runs its
# full unit/smoke/integration suite. Re-cloning and re-running that suite here
# is redundant, couples our deploy to upstream-repo health, and requires a
# GITLAB_TOKEN that can clone the upstream repo. So this job:
#   • never blocks the pipeline or deploy (allow_failure: true, off deploy needs)
#   • does NOT run on every main push/tag — only on the control-plane webhook
#     trigger, a schedule, or an explicit manual run.
test:modelzoo:
  stage: test
  image: python:3.12-slim
  interruptible: true
  allow_failure: true
  needs: [sanity:python-syntax, sanity:check-structure]
  # modelzoo is no longer vendored here (it is upstream: software/modelzoo), so
  # there is no in-tree path left to watch with `changes:`. The job always cloned
  # the upstream repo anyway; it now runs only when something asks it to — the
  # control-plane pipeline trigger on a modelzoo push, a schedule, or manually.
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - when: never
  cache:
    - <<: *poetry_cache
      policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry
    - git clone --depth=1
        "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/software/modelzoo.git"
        modelzoo_fresh
    - cd modelzoo_fresh
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev,ci
  script:
    - mkdir -p ../reports
    - ruff check seanergys_modelzoo ci tests
    - ruff format --check seanergys_modelzoo ci tests
    - mypy seanergys_modelzoo ci tests --ignore-missing-imports --explicit-package-bases || true
    - pytest tests/unit/        -v --tb=short --junit-xml=../reports/modelzoo-unit.xml
    - pytest tests/smoke/       -v --tb=short --junit-xml=../reports/modelzoo-smoke.xml
    - pytest tests/integration/ -v --tb=short --junit-xml=../reports/modelzoo-integration.xml
    - python -c "from seanergys_modelzoo.logger.seanergys_logger import SeanergysLogger; print('Import OK')"
  artifacts:
    reports:
      junit: reports/modelzoo-*.xml
    when: always
    expire_in: 7 days

# ── Infra: docker-compose validation (3 profiles) ────────────────────────────

test:infra:compose:
  stage: test
  image: docker:25
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/infra/docker-compose/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  services:
    - docker:25-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DASHBOARD_VIEWER_PASSWORD: "ci-dummy"
    DASHBOARD_ADMIN_PASSWORD: "ci-dummy"
    DASHBOARD_JWT_SECRET: "ci-dummy-jwt-secret-32-chars-min!"
    DASHBOARD_SECRET_KEY: "ci-dummy-fernet-key-44-chars-min-pad=="
    # `docker compose config` interpolates every service, including profile-gated ones, so a
    # `${VAR:?}` guard anywhere in the file makes the whole file unvalidatable without a value.
    # The vLLM service is GPU-only and never starts here; this is a placeholder, not a model.
  script:
    - touch platform/infra/docker-compose/.env
    - docker compose -f platform/infra/docker-compose/docker-compose.yml config --quiet
    - docker compose -f platform/infra/docker-compose/docker-compose.yml --profile monitoring config --quiet
    - docker compose -f platform/infra/docker-compose/docker-compose.yml --profile dev config --quiet

# ── Infra: Slurm adapter lint ─────────────────────────────────────────────────

test:infra:slurm-lint:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/infra/slurm-adapter/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    - pip install --quiet ruff
    - ruff check platform/infra/slurm-adapter/

# ── Infra: Prometheus alert rules ─────────────────────────────────────────────

test:infra:alert-rules:
  stage: test
  image:
    name: prom/prometheus:v2.54.1
    entrypoint: [""]
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/infra/docker-compose/alert_rules.yml
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    - /bin/promtool check rules platform/infra/docker-compose/alert_rules.yml

# ── Docs: the published site ──────────────────────────────────────────────────
#
# Nothing built the docs until 2026-08-23, so twenty-one dead links accumulated in
# the published site — twenty guides linking design/adr/*.md, a directory outside
# docs_dir that is never published — and every one of them was a build warning no
# job ever read. --strict turns a broken link, a broken heading anchor or a page
# missing from the nav into a failure here instead of a reader's 404.

test:docs:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - docs/**/*
        - mkdocs.yml
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    - pip install --quiet mkdocs-material mkdocs-minify-plugin
    - mkdocs build --clean --strict
  artifacts:
    paths: [site/]
    expire_in: 1 week

# ── Infra: Helm chart ─────────────────────────────────────────────────────────
#
# The chart is a published artifact that strangers install, and until now nothing
# gated it: four defects sat in it precisely because `make helm-validate` appeared
# in no CI file. The kubectl schema step inside the target self-skips — it needs a
# live apiserver — so what runs here is lint, the no-registry refusal check, the
# render, the structural guards, and a package dry-run.

test:infra:helm:
  stage: test
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/infra/helm/**/*
        - tests/unit/test_helm_chart.py
        - tests/unit/test_helm_network_and_schema.py
        - tests/unit/test_helm_agent_scaling.py
        - tests/unit/test_helm_secret_scoping.py
        - tests/unit/test_dashboard_agent_credentials.py
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    # `make` is the single source of truth for how the chart is validated; the image
    # ships helm and sh only, so add make + python for the guards.
    - apk add --no-cache make python3 py3-pip git
    # The three packages after pyyaml are not test dependencies — they are what the two
    # autouse fixtures in tests/conftest.py drag in (prometheus_client at collection,
    # examlops.storage -> resilience -> httpx and examlops.cli -> typer at setup). Without
    # prometheus_client pytest died at *collection*, exit 4, which is what happened on
    # pipeline #3241: `helm lint` passed, collection failed, and so test_helm_chart.py ran in
    # no job at all — while its 6 tests also skip in test:examlops for want of a helm binary.
    # Every chart guard was a no-op everywhere. If a future fixture adds an import this job
    # will fail loudly rather than skip, which is the failure mode we want.
    - python3 -m venv /tmp/venv
    - /tmp/venv/bin/pip install --quiet pytest pyyaml prometheus_client httpx typer
    - make helm-validate
    # All five helm-gated files. test_helm_network_and_schema, test_helm_agent_scaling, test_helm_secret_scoping and the
    # helm case in test_dashboard_agent_credentials skip without a helm binary, and this is the
    # only job that has one. test_gitlab_ci_valid.py keeps this list complete.
    - /tmp/venv/bin/python -m pytest
        tests/unit/test_helm_chart.py
        tests/unit/test_helm_network_and_schema.py
        tests/unit/test_helm_agent_scaling.py
        tests/unit/test_helm_secret_scoping.py
        tests/unit/test_dashboard_agent_credentials.py
        tests/unit/test_dockerfile_build_context.py -q
    - make helm-package

# ── ExaMLOps: lint + mypy + unit + dashboard backend ─────────────────────────
#
# This is the core quality gate. It runs on EVERY push (no change-filter) so
# that deploy:lxp always has a real test result to depend on.  Removing the
# change-filter means a cold-cache run on unrelated commits costs ~2 min extra
# but guarantees the platform is healthy before every deploy.

test:examlops:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  cache:
    - <<: *uv_cache
      policy: pull-push
  before_script:
    # `python:3.12-slim` ships neither `git` nor `make`. Thirteen guards shell out to one
    # or the other — test_public_tree_privacy (which is what stops private material reaching
    # the published tree), test_env_vars_are_documented, test_release_notes_are_extractable,
    # test_dockerfile_build_context, test_env_example_public, test_makefile_is_honest,
    # test_tree_change_reporter — and without the binaries they do not fail an assertion, they
    # die on FileNotFoundError. They had therefore never run in CI at all. Measured on
    # pipeline #3241 (2026-08-25): 13 failed in this job and 13 in test:postgres, the same 13.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git make
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv   # --clear: runners reuse build dirs; a leftover .venv otherwise fails
    - uv pip install -e ".[dev]"
  script:
    - .venv/bin/ruff check platform/cli/src/ tests/ pipelines/ serving/ platform/services/ platform/clients/ usecases/
    - .venv/bin/ruff format --check platform/cli/src/ tests/ pipelines/ serving/ platform/services/ platform/clients/ usecases/
    - .venv/bin/mypy pipelines/ serving/ platform/services/ --ignore-missing-imports
    # platform/cli/src/ is the largest package and was in no mypy invocation anywhere —
    # local gate, ci-examlops, or here. It is ratcheted rather than skipped; the target is
    # the single source of that logic so the three places cannot drift apart again.
    - make typecheck-cli
    # `-n auto` — 2781 tests in one process was the single largest block of CI wall-clock
    # (520s serial / 66s parallel, measured locally). Every test now gets a private
    # PLATFORM_DB via tests/conftest.py, which is what makes this safe. NB: test:postgres
    # is deliberately NOT parallelised — its workers would share one schema that the
    # isolation fixture truncates between tests.
    - .venv/bin/pytest tests/unit/ -n auto -v --tb=short
        --junit-xml=reports/examlops-unit.xml
        --cov=platform/cli/src/examlops --cov=pipelines --cov=serving
        --cov-report=term-missing --cov-report=xml:reports/coverage.xml
    - pip install -r platform/services/dashboard/backend/requirements.txt -q
    # The dashboard write routers (Phase 42: connections/projects/storage) and the
    # FinOps carbon-methodology surface call into the `examlops` package the same way
    # the CLI does; without it these tests hit the "examlops package not available"
    # 503 guard. The dashboard reqs run in system-python (not the .venv above), so
    # install examlops here too. Base package is enough (metadata/write paths need no
    # optional extras).
    - pip install -e platform/cli -q
    # EXAMLOPS_DOCS_ROOT: the docs router's auto-detection of the project root
    # fails in CI's checkout layout and returns 503; point it at the repo root.
    # test_storage is skipped in CI only: moto's MockRawResponse is incompatible
    # with aiobotocore 2.13 (no raw_headers) — a test-infra version issue, not a
    # product bug. Runs locally; tracked as tech debt to re-enable once aligned.
    - EXAMLOPS_DOCS_ROOT="$CI_PROJECT_DIR" pytest platform/services/dashboard/backend/tests/ -v --tb=short
        --ignore=platform/services/dashboard/backend/tests/test_storage.py
        --junit-xml=reports/dashboard-backend.xml
  artifacts:
    reports:
      junit:
        - reports/examlops-unit.xml
        - reports/dashboard-backend.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    when: always
    expire_in: 7 days
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ── Postgres engine parity ────────────────────────────────────────────────────
# `EXAMLOPS_DB_BACKEND=postgres` is a supported production engine (enterprise-readiness
# item 0.1), but until now nothing in CI ever ran on it — every job used the SQLite
# default, so a dialect regression could only be found by someone remembering to run
# `make test-postgres` by hand. The two suites that carry the platform's data layer now
# run against a real Postgres 16 service.
#
# Both suites, not just the unit one: the dashboard is a separate app with its own
# connection adapter, and every Postgres-specific defect found so far (row shape, numeric
# widening, INTEGER narrowing) surfaced there first.
test:postgres:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: examlops
    POSTGRES_PASSWORD: examlops
    POSTGRES_DB: examlops
    EXAMLOPS_DB_BACKEND: postgres
    EXAMLOPS_POSTGRES_DSN: postgresql://examlops:examlops@postgres:5432/examlops
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → always, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:                                      # branches/MRs → only when it can break
        - platform/cli/src/examlops/storage/**/*
        - platform/cli/src/examlops/platform_db*.py
        - platform/services/dashboard/backend/**/*
        - tests/unit/test_storage*.py
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 20 minutes
  cache:
    - <<: *uv_cache
      policy: pull
  before_script:
    # `python:3.12-slim` ships neither `git` nor `make`. Thirteen guards shell out to one
    # or the other — test_public_tree_privacy (which is what stops private material reaching
    # the published tree), test_env_vars_are_documented, test_release_notes_are_extractable,
    # test_dockerfile_build_context, test_env_example_public, test_makefile_is_honest,
    # test_tree_change_reporter — and without the binaries they do not fail an assertion, they
    # die on FileNotFoundError. They had therefore never run in CI at all. Measured on
    # pipeline #3241 (2026-08-25): 13 failed in this job and 13 in test:postgres, the same 13.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git make
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv
    - uv pip install -e ".[dev]"
    # Deliberately not in the root `[dev]` extra: psycopg is what makes the *optional*
    # Postgres engine optional, and only this job needs it. Adding it to `[dev]` would
    # install a driver into every SQLite job and quietly weaken that claim.
    - uv pip install --quiet "psycopg[binary]>=3.3" "psycopg-pool>=3.3"
  script:
    # Separate schemas: one Postgres database holds both suites, and each has its own
    # truncate-based isolation fixture. Sharing one schema would let them race.
    - EXAMLOPS_POSTGRES_SCHEMA=exa_ci .venv/bin/pytest tests/unit/ -q --tb=short
        --junit-xml=reports/postgres-unit.xml
    - .venv/bin/pip install -r platform/services/dashboard/backend/requirements.txt -q
    - cd platform/services/dashboard/backend &&
      EXAMLOPS_POSTGRES_SCHEMA=exa_ci_dash
      EXAMLOPS_DOCS_ROOT="$CI_PROJECT_DIR"
      PYTHONPATH="$CI_PROJECT_DIR/platform/cli/src"
      "$CI_PROJECT_DIR/.venv/bin/pytest" tests/ -q --tb=short
        --ignore=tests/test_storage.py
        --junit-xml="$CI_PROJECT_DIR/reports/postgres-dashboard.xml"
  artifacts:
    reports:
      junit:
        - reports/postgres-unit.xml
        - reports/postgres-dashboard.xml
    when: always
    expire_in: 7 days

# ── Integration: Ray Serve end-to-end ─────────────────────────────────────────
# Needs ≥4 CPUs on the runner (the active runner already satisfies this).
# Blocking gate: a failure here fails the pipeline and blocks deploy. Runs on
# every main push and tag (full-suite policy) plus any branch/MR touching
# serving/ or tests/integration/.
# ── Skipper agent ─────────────────────────────────────────────────────────────
# The agent's 206 tests ran in neither `make check` nor any pipeline until now: the
# root `test` target is `pytest tests/`, and the suite lives under
# platform/services/agent/tests. A change to skipper/ could break all of them with
# every gate green — the worst place for that to be true, since an agent's regressions
# are the hardest kind to notice by using it.
#
# Its own job rather than folding it into test:examlops, because it needs eleven
# LangChain/LangGraph packages the root [dev] extras deliberately do not carry. For the
# same reason it declares NO cache: the shared `uv-$CI_COMMIT_REF_SLUG` key holds the
# .venv every other job pulls, and pushing a langchain-laden one into it would slow
# them all down for nothing.
test:agent:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/services/agent/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 15 minutes
  before_script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv
    # requirements.txt is the pinned source of truth for the agent's dependencies;
    # pytest-asyncio is a test-only dep the service itself does not need.
    - uv pip install -r platform/services/agent/requirements.txt
    - uv pip install pytest pytest-asyncio
    # the tests import `examlops` (platform_db, audit, vector store) the way the agent does
    - uv pip install -e platform/cli
  script:
    - .venv/bin/pytest platform/services/agent/tests -v --tb=short
        --junit-xml=reports/agent-unit.xml
  artifacts:
    reports:
      junit: reports/agent-unit.xml
    when: always
    expire_in: 7 days

test:control-plane:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/services/control_plane/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 15 minutes
  # 82 tests — the approval-gate reliability suite, weak-token rejection, the modelzoo
  # webhooks, model metadata — ran in no pipeline and no local gate until 2026-08-20, and had
  # rotted to the point of not collecting (`ModuleNotFoundError: model_meta`). The service runs
  # with its own directory as cwd, so its tests need it on sys.path; tests/conftest.py now does
  # that, the same way platform/services/agent/tests/conftest.py does.
  before_script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv
    # The service has no requirements.txt — its deps are an inline pip line in its Dockerfile.
    # These are what app.py/metrics.py/model_meta.py actually import, plus the test runner.
    - uv pip install fastapi "uvicorn[standard]" prometheus_client pyyaml
    - uv pip install pytest pytest-asyncio httpx
    # app.py imports examlops.admission / .coordination / .data.events at module level, so
    # every test that touches the app errored with `ModuleNotFoundError: No module named
    # 'examlops'` — 120 of them on pipeline #3241 (28 failed / 9 passed / 93 errors). With the
    # package installed the suite is 130 passed locally. `[oidc]` brings PyJWT: the service
    # verifies data-center IdP tokens through examlops.iam (ADR 0120) and so do its tests.
    - uv pip install -e "platform/cli[oidc]"
  script:
    - .venv/bin/pytest platform/services/control_plane/tests -v --tb=short
        --junit-xml=reports/control-plane-unit.xml
  artifacts:
    reports:
      junit: reports/control-plane-unit.xml
    when: always
    expire_in: 7 days

test:frontend:
  stage: test
  image: node:24-alpine
  interruptible: true
  needs: [sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/services/dashboard/frontend/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 15 minutes
  # The dashboard frontend ran in NO pipeline until 2026-08-20. `tsc -b` happened only inside
  # the image build in deploy:lxp, so a type error surfaced on the production node AFTER
  # release:gitlab had already tagged — the most expensive place to find it. 373 vitest tests
  # gated nothing at all. The four steps below are the same ones `make dashboard-check` runs.
  before_script:
    - cd platform/services/dashboard/frontend
    - npm ci                       # lockfile-exact, unlike the image build's `npm install`
  script:
    - npm run lint
    - npx vitest run --reporter=junit --outputFile="$CI_PROJECT_DIR/reports/frontend-unit.xml"
    - npm run build                # tsc -b && vite build — the type check, before deploy
  artifacts:
    reports:
      junit: reports/frontend-unit.xml
    when: always
    expire_in: 7 days

test:integration:
  stage: test
  image: python:3.12
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  services:
    - name: redis:7.4-alpine
      alias: redis
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - serving/**/*
        - platform/cli/src/examlops/coordination/**/*
        - platform/cli/src/examlops/events/**/*
        - tests/integration/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 15 minutes
  cache:
    - <<: *uv_cache
      policy: pull
  before_script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv   # --clear: runners reuse build dirs; a leftover .venv otherwise fails
    - uv pip install -e ".[dev]"
    - uv pip install -e "platform/cli[coordination]"
  script:
    # Preserve the normal offline suite: the opt-in Redis URL is set only for the dedicated
    # live contract invocation below, so local/offline integration behavior remains unchanged.
    - .venv/bin/pytest tests/integration/ -v --tb=short
        --junit-xml=reports/integration.xml
    - |
      REDIS_TEST_URL="redis://redis:6379/15"
      redis_ready=false
      for attempt in $(seq 1 30); do
        if EXAMLOPS_REDIS_TEST_URL="$REDIS_TEST_URL" .venv/bin/python -c \
          'import os, redis; assert redis.Redis.from_url(os.environ["EXAMLOPS_REDIS_TEST_URL"]).ping()'; then
          redis_ready=true
          break
        fi
        sleep 1
      done
      if [ "$redis_ready" != true ]; then
        echo "Redis service did not become ready within 30 seconds" >&2
        exit 1
      fi
      EXAMLOPS_REDIS_TEST_URL="$REDIS_TEST_URL" \
        .venv/bin/pytest tests/integration/test_redis_coordination_live.py -v --tb=short \
        --junit-xml=reports/integration-redis.xml
  artifacts:
    reports:
      junit:
        - reports/integration.xml
        - reports/integration-redis.xml
    when: always
    expire_in: 7 days


# ── Dependency vulnerability audit ────────────────────────────────────────────
# ADVISORY, NOT A GATE — and the difference is stated rather than implied, because this
# repo's own guard (tests/unit/test_ci_gate_coverage.py) exists to stop checks that look
# like gates and cannot stop anything.
#
# It is advisory because no baseline has been established: turning it blocking on day one
# would redden the pipeline on whatever CVEs the current lockfile already carries, and the
# reliable outcome of a gate that fails for reasons nobody chose is that someone deletes the
# gate. The intended path is: run it advisory, read the report, fix or explicitly accept
# each finding, THEN set allow_failure: false. Until that happens it is a report.
test:deps:audit:
  stage: test
  image: python:3.12-slim
  interruptible: true
  allow_failure: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - changes:
        - pyproject.toml
        - uv.lock
        - "**/requirements*.txt"
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    - pip install --quiet --upgrade pip uv pip-audit
    - uv venv --clear .venv
    - uv pip install -e ".[dev]"
    # --strict makes an unfixable/unknown advisory a finding rather than a silent pass.
    - .venv/bin/python -m pip install --quiet pip-audit
    - .venv/bin/python -m pip_audit --strict --progress-spinner off --format columns
  artifacts:
    when: always
    paths: [pip-audit.json]
    expire_in: 30 days

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: BUILD — one image per service, built once, pushed to the GitLab registry
# ═══════════════════════════════════════════════════════════════════════════
#
# Before this stage existed the LXP node ran `docker compose up --build` on every deploy
# (platform/ci/lxp_release.sh). Three things were wrong with that and all three are the
# reason this stage exists:
#
#   1. The node built from the internet. LXP's container egress is firewalled, so every
#      deploy was one `apt-get`/`pip` away from failing for a reason nothing in this repo
#      controls.
#   2. Rollback rebuilt. `smoke:lxp` reactivates the previous release, which re-ran the
#      same build — so the "roll back to the known-good release" path could produce an
#      image that had never existed before, at the exact moment the platform was unwell.
#   3. Nothing was pinned. Two deploys of the same commit could differ.
#
# Now the image is built once, from a tested tree, and the node pulls it by tag. The build
# is gated on the same job list as the deploy, so an image is only ever published for a
# commit that passed the full suite.
#
# ROLLOUT: opt-in. The whole stage is inert until the CI/CD variable EXAMLOPS_USE_REGISTRY
# is set on the project, because it depends on two things that must be checked on the real
# infrastructure first, not assumed:
#   • the Container Registry feature being enabled on the Seanergys project, and
#   • the LXP docker daemon being able to reach registry.gitlab.seanergys.fz-juelich.de.
# Until then deploy:lxp keeps building on the node exactly as it does today.
#
# RUNNER REQUIREMENT: a privileged runner (docker-in-docker). If the Seanergys runners are
# not privileged, swap the dind service for a `kaniko` or `buildah` image — the only thing
# that changes is this job's before_script; build_image.sh stays as it is.

build:images:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  timeout: 45 minutes
  interruptible: true
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  # Same gate as deploy:lxp. An image that exists in the registry is therefore always an
  # image whose commit passed every blocking check — the registry never holds a build that
  # was not allowed to ship.
  needs:
    - job: test:examlops
    - job: test:infra:compose
    - job: test:infra:slurm-lint
    - job: test:infra:alert-rules
    - job: test:infra:helm
    - job: test:docs
    - job: test:integration
    - job: test:agent
    - job: test:frontend
    - job: test:control-plane
    - job: test:postgres
    - job: sanity:secret-scan
  rules:
    # A nightly schedule exists to find out whether main is green, not to publish images.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $EXAMLOPS_USE_REGISTRY && $CI_COMMIT_TAG
      when: on_success
    - if: $EXAMLOPS_USE_REGISTRY && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  parallel:
    matrix:
      # Service names, and only service names: build_image.sh asks the compose file where
      # each one's context and Dockerfile are, so this list cannot drift out of agreement
      # with what the deploy actually runs. tests/unit/test_ci_image_matrix.py holds the
      # list itself against the compose file.
      #
      # seanerbus-bridge is deliberately absent: its build context is the PARENT of this
      # repository (it needs the sibling seanerbus checkout), which does not exist in a CI
      # clone. It is built on the node, as it always was.
      - SERVICE:
          - postgres
          - mlflow
          - orchestrator
          - ray-serving
          - control-plane
          - agent
          - prometheus
          - grafana
          - dashboard
          - jupyterhub
          - backup
  before_script:
    - apk add --no-cache bash python3
    # The default `docker` driver cannot export a registry cache; docker-container can.
    - docker buildx create --use --driver docker-container --name examlops
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - mkdir -p image-digests
    - |
      IMAGE="$CI_REGISTRY_IMAGE/examlops-$SERVICE"
      # Every image gets the commit SHA. Tags additionally get the version, and main
      # additionally gets `latest` — so `:latest` always names the current production tree.
      EXTRA=""
      [ -n "$CI_COMMIT_TAG" ] && EXTRA="$IMAGE:$CI_COMMIT_TAG"
      [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && EXTRA="$EXTRA $IMAGE:latest"
      # shellcheck disable=SC2086 — EXTRA is a deliberate word-split list of tags
      bash platform/ci/build_image.sh "$SERVICE" "$IMAGE:$CI_COMMIT_SHA" $EXTRA \
        | tail -1 > "image-digests/$SERVICE.txt"
    - cat "image-digests/$SERVICE.txt"
  artifacts:
    # One file per matrix child; GitLab merges them, so `publish:mirrors` and any later job
    # sees all eleven digests as a single directory.
    paths:
      - image-digests/
    expire_in: 30 days


# ═══════════════════════════════════════════════════════════════════════════
# STAGE: SCAN — vulnerability report on the images that were just built
# ═══════════════════════════════════════════════════════════════════════════
#
# ADVISORY, for the same reason as test:deps:audit, and with the same intended path to
# becoming a gate: establish a baseline, fix or accept each finding, then set
# allow_failure: false and --exit-code 1.
#
# Scanning here rather than after publishing is deliberate — the report describes the image
# the node is about to run, not a mirror of it.
scan:images:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  allow_failure: true
  interruptible: true
  timeout: 30 minutes
  needs:
    - job: build:images
      artifacts: true
  rules:
    - if: $EXAMLOPS_USE_REGISTRY && ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
      when: on_success
    - when: never
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: .trivycache/
  cache:
    key: trivy-db
    paths: [.trivycache/]
  script:
    - mkdir -p trivy-reports
    - |
      test -d image-digests || { echo "no digests from build:images"; exit 1; }
      FOUND=0
      for f in image-digests/*.txt; do
        SERVICE=$(cut -d' ' -f1 "$f")
        REF=$(cut -d' ' -f2 "$f")          # repo@sha256:... — scan the exact digest
        echo "==> $SERVICE"
        trivy image --severity HIGH,CRITICAL --format table "$REF" \
          | tee "trivy-reports/$SERVICE.txt"
        trivy image --severity HIGH,CRITICAL --format json --output "trivy-reports/$SERVICE.json" "$REF"
        FOUND=$((FOUND + 1))
      done
      echo "scanned $FOUND image(s)"
  artifacts:
    when: always
    paths: [trivy-reports/]
    expire_in: 30 days

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: PUBLISH — mirror the exact digests outward. Never a gate.
# ═══════════════════════════════════════════════════════════════════════════
#
# The Seanergys registry is internal, so nothing built here is visible to anyone outside
# the institute. These jobs copy the SAME DIGESTS (skopeo copy, no rebuild) to the public
# registries, which means the image on GHCR or Docker Hub is bit-identical to the one LXP
# is running — not a lookalike rebuilt from the same source at a different time.
#
# Both are allow_failure: an outage at GHCR, a rotated Docker Hub token, or a rate limit
# must never turn a healthy production deploy red. They are visibility, not delivery.

.mirror_images: &mirror_images
  stage: publish
  image: quay.io/skopeo/stable:latest
  allow_failure: true
  interruptible: true
  needs:
    - job: build:images
      artifacts: true
  script:
    - |
      test -d image-digests || { echo "no digests to mirror"; exit 1; }
      echo "$MIRROR_PASSWORD" | skopeo login -u "$MIRROR_USER" --password-stdin "$MIRROR_REGISTRY"
      echo "$CI_REGISTRY_PASSWORD" | skopeo login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      FAILED=""
      for f in image-digests/*.txt; do
        # each line is: <service> <repo>@<digest>
        SERVICE=$(cut -d' ' -f1 "$f")
        SRC=$(cut -d' ' -f2 "$f")
        DST="$MIRROR_REPO-$SERVICE"
        echo "==> $SRC  ->  $DST"
        # Copy under the immutable SHA tag, and under :latest so a human browsing the
        # public registry sees something meaningful rather than only hex.
        skopeo copy --all "docker://$SRC" "docker://$DST:$CI_COMMIT_SHA" || FAILED="$FAILED $SERVICE"
        if [ -n "$CI_COMMIT_TAG" ]; then
          skopeo copy --all "docker://$SRC" "docker://$DST:$CI_COMMIT_TAG" || FAILED="$FAILED $SERVICE(tag)"
        fi
        skopeo copy --all "docker://$SRC" "docker://$DST:latest" || FAILED="$FAILED $SERVICE(latest)"
      done
      if [ -n "$FAILED" ]; then
        echo "mirror incomplete:$FAILED" >&2
        exit 1
      fi
      echo "all images mirrored to $MIRROR_REGISTRY"

publish:ghcr:
  <<: *mirror_images
  variables:
    MIRROR_REGISTRY: ghcr.io
    MIRROR_REPO: ghcr.io/mskazemi/examlops
    MIRROR_USER: $GHCR_USER
    MIRROR_PASSWORD: $GHCR_TOKEN
  rules:
    - if: $EXAMLOPS_USE_REGISTRY && $GHCR_TOKEN && ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
      when: on_success
    - when: never

publish:dockerhub:
  <<: *mirror_images
  variables:
    MIRROR_REGISTRY: docker.io
    MIRROR_REPO: docker.io/mskazemi/examlops
    MIRROR_USER: $DOCKERHUB_USER
    MIRROR_PASSWORD: $DOCKERHUB_TOKEN
  rules:
    - if: $EXAMLOPS_USE_REGISTRY && $DOCKERHUB_TOKEN && ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
      when: on_success
    - when: never


# ── Helm chart distribution ───────────────────────────────────────────────────
# `make helm-package` has always produced a complete, publishable Helm repository in
# dist/helm — chart tarball plus index.yaml — and nothing ever published it. So the chart
# was validated on every pipeline and installable by nobody.
#
# Two distribution shapes, because Helm has two and consumers use both:
#   • OCI (`helm push` to a registry) — the modern default, and it lands the chart in the
#     same registries as the images it deploys, so a version is one artifact set.
#   • A classic HTTP repo (index.yaml) — what `helm repo add` still expects. Published by
#     the `pages` job below, alongside the docs.
publish:helm:
  stage: publish
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  allow_failure: true      # distribution, not delivery — see the publish stage note above
  interruptible: true
  needs:
    - job: test:infra:helm
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - apk add --no-cache make git
    - make helm-package HELM_REPO_URL="$CI_PAGES_URL/charts"
    - |
      CHART=$(ls dist/helm/examlops-*.tgz | head -1)
      test -n "$CHART" || { echo "helm-package produced no chart"; exit 1; }
      echo "chart: $CHART"

      # 1. The GitLab registry — same place as the images, always attempted.
      echo "$CI_REGISTRY_PASSWORD" | helm registry login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      helm push "$CHART" "oci://$CI_REGISTRY_IMAGE/charts"

      # 2. The public mirrors, each only when its credentials exist. A missing token is a
      #    configuration choice, not a failure.
      if [ -n "$GHCR_TOKEN" ]; then
        echo "$GHCR_TOKEN" | helm registry login -u "$GHCR_USER" --password-stdin ghcr.io
        helm push "$CHART" "oci://ghcr.io/mskazemi/charts"
      else
        echo "GHCR_TOKEN unset — skipping the GHCR chart mirror"
      fi
      if [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "$DOCKERHUB_TOKEN" | helm registry login -u "$DOCKERHUB_USER" --password-stdin docker.io
        helm push "$CHART" "oci://docker.io/mskazemi/charts"
      else
        echo "DOCKERHUB_TOKEN unset — skipping the Docker Hub chart mirror"
      fi
  artifacts:
    paths: [dist/helm/]
    expire_in: 30 days

# ── GitLab Pages: the documentation site + the Helm repository ────────────────
# `test:docs` has always run `mkdocs build --strict`, proving the site builds, and then
# thrown it away. This publishes it, and puts the classic Helm repo under /charts so
# `helm repo add` works against the same host.
#
# The job must be named `pages` — that is how GitLab recognises it — and must publish the
# `public/` directory.
pages:
  # `release`, not `publish`, purely so its `needs:` on publish:helm points at a STRICTLY
  # EARLIER stage. Same-stage `needs:` is legal only on GitLab 14.2+, and the version of the
  # Seanergys instance is not something this file should have to assume.
  stage: release
  image: python:3.12-slim
  interruptible: true
  # Deliberately NOT allow_failure: unlike the registry mirrors this depends on nothing
  # outside GitLab, so a failure here is a real problem with our own content.
  needs:
    - job: test:docs
    - job: publish:helm
      optional: true
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - apt-get update -qq && apt-get install -y -qq git make curl
    - pip install --quiet --upgrade pip uv
    - make docs-build
    - mkdir -p public
    - cp -a site/. public/
    # dist/helm arrives as an artifact from publish:helm; absent when that job was skipped,
    # in which case the site publishes on its own rather than failing.
    - |
      if [ -d dist/helm ]; then
        mkdir -p public/charts && cp -a dist/helm/. public/charts/
        echo "helm repo published at $CI_PAGES_URL/charts"
      else
        echo "no dist/helm artifact — publishing the docs site only"
      fi
  artifacts:
    paths: [public]
    expire_in: 30 days

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: DEPLOY — ship the tested tree to an immutable LXP release (main only)
#
# Auto-deploy to lxp runs on every main push: deploy:lxp → smoke:lxp (auto-rollback
# on failure) → post-deploy:lxp:*. (The 2026-07 presentation freeze has been lifted.)
# ═══════════════════════════════════════════════════════════════════════════

# ── Release: make the tag set legible ─────────────────────────────────────────
# The project had a full tag history and *zero* GitLab Releases, so the tags carried no
# notes and nothing linked a version to what changed in it. This turns each tag into a
# Release whose description is that version's own CHANGELOG section — no hand-written
# notes to keep in sync, and it fails loudly if the section is missing, which is the
# cheapest possible check that the CHANGELOG was actually updated before tagging.
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false      # a half-created release is worse than a slow one
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  needs:
    - job: test:examlops
    - job: test:infra:compose
    - job: test:infra:slurm-lint
    - job: test:infra:alert-rules
    - job: test:infra:helm
    - job: test:docs
    - job: test:integration
    - job: test:agent
    - job: test:frontend
    - job: test:control-plane
    - job: test:postgres
    - job: sanity:secret-scan
  script:
    # `release:` (below) is what actually creates the object; this only prepares the text.
    # awk over the CHANGELOG: print the section for this tag, stopping at the next `## [`.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      awk -v v="$VERSION" '
        BEGIN { gsub(/\./, "\\.", v) }              # 0.48.0 must not match 0X48Y0
        $0 ~ "^## \\[v?" v "\\]" { inside = 1; next }  # headings use both [0.46.0] and [v0.48.0]
        inside && /^## \[/          { inside = 0 }    # not `exit`: 0.37.0 already heads two
        inside                       { print }         #   sections, and they are only both read
      ' CHANGELOG.md > release-notes.md                #   today because rule 1 is evaluated first
      if [ ! -s release-notes.md ]; then
        echo "CHANGELOG.md has no '## [$VERSION]' section — tag $CI_COMMIT_TAG has nothing to describe." >&2
        exit 1
      fi
      echo "Release notes for $CI_COMMIT_TAG ($(wc -l < release-notes.md) lines):"
      head -20 release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: release-notes.md
  artifacts:
    paths: [release-notes.md]
    expire_in: 30 days

deploy:lxp:
  stage: deploy
  image: ubuntu:22.04
  timeout: 20 minutes
  # There is exactly one LXP node. Two pipelines reaching this job at once would otherwise
  # change the active release while smoke:lxp is still deciding whether to roll back. The
  # resource group makes GitLab run them one after another; it is shared with smoke:lxp
  # so a deploy cannot start while the previous deploy's health gate is still deciding.
  resource_group: production-lxp
  # `needs:` makes this a DAG job: it starts as soon as THESE jobs pass, whatever else in
  # the pipeline has failed. So this list is not documentation of the suite — it IS the
  # gate, and a blocking job left out of it turns the pipeline red while production is
  # deployed anyway. Every blocking sanity/test job therefore appears here; the guard
  # tests/unit/test_ci_gate_coverage.py fails if a new one is added and forgotten.
  # test:modelzoo is the one deliberate exclusion: it is `allow_failure: true`
  # (ModelZoo owns its own CI/CD) and is not created on plain main pushes, so requiring
  # it would break pipeline creation.
  needs:
    - job: test:examlops            # core gate — always runs
    - job: test:infra:compose
    - job: test:infra:slurm-lint
    - job: test:infra:alert-rules
    - job: test:infra:helm
    - job: test:docs
    - job: test:integration
    - job: test:agent
    - job: test:frontend
    - job: test:control-plane
    - job: test:postgres
    - job: sanity:secret-scan
    # Not created unless EXAMLOPS_USE_REGISTRY is set; `optional` is what lets the same
    # pipeline definition work in both the build-on-node and pull-from-registry modes.
    - job: build:images
      optional: true
      artifacts: true
  rules:
    # A nightly schedule exists to *find out* whether main is green, not to ship it.
    # Without this a scheduled pipeline satisfies the branch condition below and would
    # redeploy production every night with no one asking for it.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Set DEPLOY_REQUIRES_APPROVAL (project CI/CD variable, any value) to turn
    # production into a button instead of an automatic consequence of merging. This is
    # the tier-free substitute for GitLab's Premium deployment approvals: it gates *when*
    # rather than *who*, which is the half that matters with one maintainer.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_REQUIRES_APPROVAL
      when: manual
      allow_failure: false   # a skipped manual deploy must not report the pipeline green
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  environment:
    name: production-lxp
    url: http://$LXP_HOST:18099
  before_script:
    - *ssh_setup
  script:
    - |
      PREV_RELEASE=$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "if [ -L \"${LXP_DEPLOY_PATH}-current\" ]; then readlink -f -- \"${LXP_DEPLOY_PATH}-current\"; else printf '%s\\n' \"$LXP_DEPLOY_PATH\"; fi")
      echo "Previous production release: $PREV_RELEASE"
      printf '%s\n' "$PREV_RELEASE" > prev_release.txt

      ARCHIVE="examlops-${CI_COMMIT_SHA}.tar.gz"
      REMOTE_ARCHIVE="/tmp/$ARCHIVE"
      REMOTE_SCRIPT="/tmp/examlops-lxp-release-${CI_COMMIT_SHA}.sh"
      git archive --format=tar.gz -o "$ARCHIVE" "$CI_COMMIT_SHA"
      scp -i ~/.ssh/id_ed25519 -o BatchMode=yes "$ARCHIVE" \
        "$LXP_USER@$LXP_HOST:$REMOTE_ARCHIVE"
      scp -i ~/.ssh/id_ed25519 -o BatchMode=yes platform/ci/lxp_release.sh \
        "$LXP_USER@$LXP_HOST:$REMOTE_SCRIPT"
      # In registry mode the node pulls prebuilt images instead of building them. Passing
      # the prefix through the environment (rather than a positional argument) keeps
      # lxp_release.sh's `activate` path identical for deploy and for rollback, which is
      # what makes a rollback re-run the *same* images rather than rebuild them.
      REMOTE_ENV=""
      if [ -n "$EXAMLOPS_USE_REGISTRY" ]; then
        echo "$CI_REGISTRY_PASSWORD" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
          "docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
        REMOTE_ENV="EXAMLOPS_IMAGE_PREFIX='$CI_REGISTRY_IMAGE/examlops' EXAMLOPS_IMAGE_TAG='$CI_COMMIT_SHA'"
      fi
      REMOTE_ENV="$REMOTE_ENV EXAMLOPS_ACTOR='${GITLAB_USER_LOGIN:-gitlab-ci}'"
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "$REMOTE_ENV bash \"$REMOTE_SCRIPT\" deploy \"$LXP_DEPLOY_PATH\" \"$CI_COMMIT_SHA\" \"$REMOTE_ARCHIVE\""
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "rm -f -- \"$REMOTE_ARCHIVE\" \"$REMOTE_SCRIPT\""
  artifacts:
    paths:
      - prev_release.txt
    expire_in: 1 hour

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: SMOKE — health probes after deploy, auto-rollback on failure
# ═══════════════════════════════════════════════════════════════════════════

smoke:lxp:
  stage: smoke
  image: ubuntu:22.04
  timeout: 10 minutes
  needs: [deploy:lxp]
  resource_group: production-lxp   # see deploy:lxp — the rollback path writes to the node too
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  before_script:
    - *ssh_setup
  script:
    - PREV_RELEASE=$(cat prev_release.txt)
    - echo "==> Waiting ${SMOKE_STARTUP_WAIT}s for services to initialise..."
    - sleep "$SMOKE_STARTUP_WAIT"
    - |
      run_smoke() {
        # Copy the smoke script to the remote host and execute it there.
        ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
          "EXAMLOPS_DEPLOY_PATH=${LXP_DEPLOY_PATH}-current bash -s" \
          < platform/ci/smoke_check.sh
      }

      ATTEMPT=1
      while [ "$ATTEMPT" -le "$SMOKE_RETRY_COUNT" ]; do
        echo "==> Smoke probe attempt $ATTEMPT/$SMOKE_RETRY_COUNT"
        if run_smoke; then
          echo "==> All services healthy."
          exit 0
        fi
        ATTEMPT=$((ATTEMPT + 1))
        [ "$ATTEMPT" -le "$SMOKE_RETRY_COUNT" ] && {
          echo "==> Retrying in ${SMOKE_RETRY_DELAY}s..."
          sleep "$SMOKE_RETRY_DELAY"
        }
      done

      echo ""
      echo "==> Smoke checks FAILED after $SMOKE_RETRY_COUNT attempts."

      if [ -z "$PREV_RELEASE" ]; then
        echo "==> No previous release recorded — cannot auto-rollback. Manual intervention required."
        exit 1
      fi

      echo "==> Auto-rolling back to $PREV_RELEASE ..."
      REMOTE_SCRIPT="/tmp/examlops-lxp-rollback-${CI_COMMIT_SHA}.sh"
      scp -i ~/.ssh/id_ed25519 -o BatchMode=yes platform/ci/lxp_release.sh \
        "$LXP_USER@$LXP_HOST:$REMOTE_SCRIPT"
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "bash \"$REMOTE_SCRIPT\" activate \"$LXP_DEPLOY_PATH\" \"$PREV_RELEASE\""
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "rm -f -- \"$REMOTE_SCRIPT\""

      echo "==> Waiting ${SMOKE_STARTUP_WAIT}s for rollback to stabilise..."
      sleep "$SMOKE_STARTUP_WAIT"

      if ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
          "EXAMLOPS_DEPLOY_PATH=${LXP_DEPLOY_PATH}-current bash -s" < platform/ci/smoke_check.sh; then
        echo "==> Rollback is healthy. Previous release ($PREV_RELEASE) restored."
      else
        echo "==> WARNING: Rollback health check also failed. Manual intervention required."
      fi

      exit 1  # pipeline must still fail to signal the bad commit


# ── Manual rollback ───────────────────────────────────────────────────────────
# smoke:lxp rolls back automatically when the health gate fails. Nothing covered the other
# case: a release that passes every probe and is discovered to be wrong ten minutes later,
# by a human. That needed an SSH session, knowledge of the release directory layout and the
# right SHA typed by hand — at the moment someone is already under pressure.
#
# Deliberately `needs: []`. You roll back *because* something went wrong, so this job must be
# clickable in a pipeline where other jobs are red; a `needs:` list would make the button
# unavailable in precisely the situation it exists for.
#
# `allow_failure: true` is what keeps an un-clicked button from blocking the pipeline. It
# does NOT mean a failed rollback is ignored — if you click it and it fails, the job is red
# and the smoke probe at the end says the platform is still unhealthy.
rollback:lxp:
  stage: smoke
  image: ubuntu:22.04
  timeout: 15 minutes
  when: manual
  allow_failure: true
  needs: []
  resource_group: production-lxp   # must not race a deploy that is still being decided
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - when: never
  environment:
    name: production-lxp
    url: http://$LXP_HOST:18099
  variables:
    # Set ROLLBACK_TO (a release SHA, from the list this job prints) when running the job to
    # target a specific release. Left empty it takes the most recent release that is not the
    # active one, which is the answer to "undo the last deploy".
    ROLLBACK_TO: ""
  before_script:
    - *ssh_setup
  script:
    - |
      REMOTE_SCRIPT="/tmp/examlops-lxp-rollback-manual-$CI_JOB_ID.sh"
      scp -i ~/.ssh/id_ed25519 -o BatchMode=yes platform/ci/lxp_release.sh \
        "$LXP_USER@$LXP_HOST:$REMOTE_SCRIPT"

      echo "==> Releases currently on the node (* = active):"
      RELEASES=$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "bash \"$REMOTE_SCRIPT\" list \"$LXP_DEPLOY_PATH\"")
      echo "$RELEASES"

      TARGET="$ROLLBACK_TO"
      if [ -z "$TARGET" ]; then
        # First line without the active marker: newest release that is not the running one.
        TARGET=$(printf '%s\n' "$RELEASES" | grep -v '^\*' | awk 'NF {print $1; exit}')
        echo "==> ROLLBACK_TO not set; using the most recent inactive release: $TARGET"
      fi
      if [ -z "$TARGET" ]; then
        echo "No release to roll back to — the node has only the active one." >&2
        exit 1
      fi

      echo "==> Rolling back to $TARGET"
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "EXAMLOPS_ACTOR='${GITLAB_USER_LOGIN:-manual}' bash \"$REMOTE_SCRIPT\" activate \"$LXP_DEPLOY_PATH\" \"${LXP_DEPLOY_PATH}-releases/$TARGET\""
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" "rm -f -- \"$REMOTE_SCRIPT\""

      echo "==> Waiting ${SMOKE_STARTUP_WAIT}s for the restored release to stabilise..."
      sleep "$SMOKE_STARTUP_WAIT"

      # A rollback that is not health-checked is a hope, not a recovery.
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "EXAMLOPS_DEPLOY_PATH=${LXP_DEPLOY_PATH}-current bash -s" < platform/ci/smoke_check.sh

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: POST-DEPLOY — notify + retrain (only after smoke passes)
# ═══════════════════════════════════════════════════════════════════════════

post-deploy:lxp:notify-model-changes:
  stage: post-deploy
  image: python:3.12-slim
  needs: [smoke:lxp]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  variables:
    CONTROL_PLANE_URL: $LXP_CONTROL_PLANE_URL
    CONTROL_PLANE_TOKEN: $LXP_CONTROL_PLANE_TOKEN
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet httpx
  script:
    - |
      python platform/ci/notify_model_changes.py \
        --before "$CI_COMMIT_BEFORE_SHA" \
        --after  "$CI_COMMIT_SHA" \
        --commit-msg "$CI_COMMIT_MESSAGE" || true

post-deploy:lxp:retrain-push-models:
  stage: post-deploy
  image: python:3.12-slim
  needs: [smoke:lxp]
  # Best-effort: the deploy is already validated by deploy:lxp + smoke:lxp. This
  # only kicks off Prefect retraining, which is racy right after a fresh deploy
  # (Prefect still warming up) and is also driven by drift/schedule — so a timeout
  # here must not mark an otherwise-healthy deploy as failed.
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  variables:
    MODELS: "JPCP MACK MCBound"
    RETRAIN_DATASET: "FDataDataset"
    RETRAIN_DUMMY: "false"
    CONTROL_PLANE_URL: $LXP_CONTROL_PLANE_URL
    CONTROL_PLANE_TOKEN: $LXP_CONTROL_PLANE_TOKEN
  script:
    - pip install --quiet httpx
    - python platform/ci/retrain_push_models.py

# ── Failure notification ──────────────────────────────────────────────────────
# Fires when any job on main fails, if NOTIFICATION_WEBHOOK_URL is set.

notify:failure:
  stage: post-deploy
  image: python:3.12-slim
  when: on_failure
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NOTIFICATION_WEBHOOK_URL
      when: on_failure
  script:
    - python platform/ci/notify_failure.py
