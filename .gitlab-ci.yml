# ExaMLOps — GitLab CI/CD (primary host)
#
# Pipeline: sanity → test (parallel DAG) → deploy → smoke → post-deploy
#
# Key improvements over the previous version:
#   • test:examlops always runs before every deploy (was change-triggered only)
#   • deploy:lxp requires test:examlops to pass (was optional — deploy could run
#     on a broken examlops test suite)
#   • New smoke stage: probes all critical services after deploy; auto-rolls back
#     to the previous commit if health checks fail (self-healing)
#   • Failure notification webhook (set NOTIFICATION_WEBHOOK_URL CI variable)
#   • JUnit test-report artifacts for all pytest jobs (visible in MR test tab)
#   • retry on Docker-dependent jobs (runner/DinD transient failures)
#   • deploy has an explicit 20-minute timeout (was unbounded)
#   • ruff format --check is now a hard failure (was || true)
#   • retrain script extracted to platform/ci/retrain_push_models.py
#   • post-deploy jobs depend on smoke:lxp (not directly on deploy:lxp)
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   LXP_SSH_KEY         masked, protected — ED25519 private key for lxp-cpu01
#   LXP_HOST_KEY        masked            — known_hosts entry for lxp-cpu01
#   LXP_USER                              — SSH username on the deploy node
#   LXP_HOST                              — hostname or IP of lxp-cpu01
#   LXP_DEPLOY_PATH                       — /opt/examlops
#   LXP_DEPLOY_REPO                       — GitLab SSH URL of this repo
#   LXP_CONTROL_PLANE_URL                 — http://lxp-cpu01:18002
#   LXP_CONTROL_PLANE_TOKEN masked        — bearer token for /retrain + /api/changes
#
# Optional CI/CD variables:
#   NOTIFICATION_WEBHOOK_URL  masked — Slack-compatible webhook; enables notify:failure
#   LXP_MODELZOO_REPO   masked — clone URL (with credentials) of the UPSTREAM
#                                software/modelzoo repo. Since 2026-08-07 modelzoo is
#                                not vendored here, so deploy:lxp fetches it into
#                                $LXP_DEPLOY_PATH/modelzoo. Unset ⇒ not fetched, and
#                                training/serving fail until it is present.
#   SMOKE_STARTUP_WAIT        seconds to wait after compose-up before probing (default 45)
#   SMOKE_RETRY_COUNT         health-probe retry attempts (default 3)
#   SMOKE_RETRY_DELAY         seconds between retries (default 15)
#
# Runtime self-healing (separate from CI):
#   One-time setup on lxp-cpu01:  sudo bash platform/ci/setup_selfheal_systemd.sh
#   This installs a systemd timer that restarts unhealthy containers every 2 min.

workflow:
  auto_cancel:
    on_new_commit: interruptible  # cancel in-progress runs on re-push

stages:
  - sanity
  - test
  - release     # tag pipelines only: turn the tag into a GitLab Release
  - deploy
  - smoke       # post-deploy health gate + auto-rollback
  - post-deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR:  "$CI_PROJECT_DIR/.cache/uv"
  PYTHONPATH:    "${CI_PROJECT_DIR}:${PYTHONPATH}"
  SMOKE_STARTUP_WAIT: "45"
  SMOKE_RETRY_COUNT:  "3"
  SMOKE_RETRY_DELAY:  "15"

# ─── Cache anchors ────────────────────────────────────────────────────────────

.poetry_cache: &poetry_cache
  key: "$CI_COMMIT_REF_SLUG-poetry"
  paths:
    - .cache/pip

.uv_cache: &uv_cache
  key: "uv-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/uv
    - .venv

# ─── Reusable SSH setup (deploy, smoke, post-deploy) ─────────────────────────

.ssh_setup: &ssh_setup
  - apt-get update -qq && apt-get install -y -qq openssh-client curl
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - printf '%s\n' "$LXP_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519
  - printf '%s\n' "$LXP_HOST_KEY" >> ~/.ssh/known_hosts
  - chmod 600 ~/.ssh/known_hosts

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: SANITY — fast checks that block everything on failure
# ═══════════════════════════════════════════════════════════════════════════

sanity:python-syntax:
  stage: sanity
  image: python:3.12-slim
  interruptible: true
  script:
    - >
      find platform/ pipelines/ serving/ tests/ tools/ usecases/
      -name "*.py" -print0
      | xargs -0 -r python -m py_compile

sanity:check-structure:
  stage: sanity
  image: python:3.12-slim
  interruptible: true
  script:
    - test -f pyproject.toml
    - test -d platform/cli/src/examlops
    - test -d platform/services/dashboard
    - test -d platform/services/control_plane
    - test -f platform/infra/docker-compose/docker-compose.yml
    # Models moved from pipelines/models/ to the use-case packs (ADR 0094 platform/use-case split);
    # verify the default pack's model dir instead of the retired pipelines/models/.
    - test -d usecases/seanergy/models
    - echo "Structure OK"

# D7 (ADR 0011): block any commit that introduces a plaintext secret. Uses the
# dependency-free built-in scanner (examlops.secrets.scan_text) so no external
# gitleaks/trufflehog binary is needed in CI. Fails the pipeline on any finding.
sanity:secret-scan:
  stage: sanity
  image: python:3.12-slim
  interruptible: true
  script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv
    - uv pip install -e ".[dev]"
    - .venv/bin/exa secrets scan platform/
    - .venv/bin/exa secrets scan pipelines/

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: TEST — parallel DAG; all jobs need both sanity jobs
# ═══════════════════════════════════════════════════════════════════════════

# ── ModelZoo: unit + smoke + integration (Poetry) ────────────────────────────
#
# Clones the real upstream modelzoo repo (main branch). Since 2026-08-07 modelzoo
# is no longer vendored in this repo at all — it is an upstream library, not part
# of ExaMLOps (ADR 0094) — so this job is the ONLY place its suite runs here.
# Triggered three ways:
#   1. Pipeline trigger — fired by the control plane when modelzoo pushes to main
#   2. Scheduled pipeline — catches any drift not covered by webhooks
#   3. Manually from a default-branch pipeline
#
# NON-BLOCKING, informational only — NOT a deploy gate.
# ModelZoo has its own CI/CD in its own repo (software/modelzoo) which runs its
# full unit/smoke/integration suite. Re-cloning and re-running that suite here
# is redundant, couples our deploy to upstream-repo health, and requires a
# GITLAB_TOKEN that can clone the upstream repo. So this job:
#   • never blocks the pipeline or deploy (allow_failure: true, off deploy needs)
#   • does NOT run on every main push/tag — only on the control-plane webhook
#     trigger, a schedule, or an explicit manual run.
test:modelzoo:
  stage: test
  image: python:3.12-slim
  interruptible: true
  allow_failure: true
  needs: [sanity:python-syntax, sanity:check-structure]
  # modelzoo is no longer vendored here (it is upstream: software/modelzoo), so
  # there is no in-tree path left to watch with `changes:`. The job always cloned
  # the upstream repo anyway; it now runs only when something asks it to — the
  # control-plane pipeline trigger on a modelzoo push, a schedule, or manually.
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - when: never
  cache:
    - <<: *poetry_cache
      policy: pull-push
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet --upgrade pip
    - pip install --quiet poetry
    - git clone --depth=1
        "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/software/modelzoo.git"
        modelzoo_fresh
    - cd modelzoo_fresh
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --with dev,ci
  script:
    - mkdir -p ../reports
    - ruff check seanergys_modelzoo ci tests
    - ruff format --check seanergys_modelzoo ci tests
    - mypy seanergys_modelzoo ci tests --ignore-missing-imports --explicit-package-bases || true
    - pytest tests/unit/        -v --tb=short --junit-xml=../reports/modelzoo-unit.xml
    - pytest tests/smoke/       -v --tb=short --junit-xml=../reports/modelzoo-smoke.xml
    - pytest tests/integration/ -v --tb=short --junit-xml=../reports/modelzoo-integration.xml
    - python -c "from seanergys_modelzoo.logger.seanergys_logger import SeanergysLogger; print('Import OK')"
  artifacts:
    reports:
      junit: reports/modelzoo-*.xml
    when: always
    expire_in: 7 days

# ── Infra: docker-compose validation (3 profiles) ────────────────────────────

test:infra:compose:
  stage: test
  image: docker:25
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/infra/docker-compose/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  services:
    - docker:25-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DASHBOARD_VIEWER_PASSWORD: "ci-dummy"
    DASHBOARD_ADMIN_PASSWORD: "ci-dummy"
    DASHBOARD_JWT_SECRET: "ci-dummy-jwt-secret-32-chars-min!"
    DASHBOARD_SECRET_KEY: "ci-dummy-fernet-key-44-chars-min-pad=="
    # `docker compose config` interpolates every service, including profile-gated ones, so a
    # `${VAR:?}` guard anywhere in the file makes the whole file unvalidatable without a value.
    # The vLLM service is GPU-only and never starts here; this is a placeholder, not a model.
    EXAMLOPS_VLLM_MODEL: "ci-dummy-model"
  script:
    - touch platform/infra/docker-compose/.env
    - docker compose -f platform/infra/docker-compose/docker-compose.yml config --quiet
    - docker compose -f platform/infra/docker-compose/docker-compose.yml --profile monitoring config --quiet
    - docker compose -f platform/infra/docker-compose/docker-compose.yml --profile dev config --quiet

# ── Infra: Slurm adapter lint ─────────────────────────────────────────────────

test:infra:slurm-lint:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/infra/slurm-adapter/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    - pip install --quiet ruff
    - ruff check platform/infra/slurm-adapter/

# ── Infra: Prometheus alert rules ─────────────────────────────────────────────

test:infra:alert-rules:
  stage: test
  image:
    name: prom/prometheus:v2.54.1
    entrypoint: [""]
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/infra/docker-compose/alert_rules.yml
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    - /bin/promtool check rules platform/infra/docker-compose/alert_rules.yml

# ── ExaMLOps: lint + mypy + unit + dashboard backend ─────────────────────────
#
# This is the core quality gate. It runs on EVERY push (no change-filter) so
# that deploy:lxp always has a real test result to depend on.  Removing the
# change-filter means a cold-cache run on unrelated commits costs ~2 min extra
# but guarantees the platform is healthy before every deploy.

test:examlops:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  cache:
    - <<: *uv_cache
      policy: pull-push
  before_script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv   # --clear: runners reuse build dirs; a leftover .venv otherwise fails
    - uv pip install -e ".[dev]"
  script:
    - .venv/bin/ruff check platform/cli/src/ tests/ pipelines/ serving/ platform/services/ platform/clients/ usecases/
    - .venv/bin/ruff format --check platform/cli/src/ tests/ pipelines/ serving/ platform/services/ platform/clients/ usecases/
    - .venv/bin/mypy pipelines/ serving/ platform/services/ --ignore-missing-imports || true
    - .venv/bin/pytest tests/unit/ -v --tb=short
        --junit-xml=reports/examlops-unit.xml
        --cov=platform/cli/src/examlops --cov=pipelines --cov=serving
        --cov-report=term-missing --cov-report=xml:reports/coverage.xml
    - pip install -r platform/services/dashboard/backend/requirements.txt -q
    # The dashboard write routers (Phase 42: connections/projects/storage) and the
    # FinOps carbon-methodology surface call into the `examlops` package the same way
    # the CLI does; without it these tests hit the "examlops package not available"
    # 503 guard. The dashboard reqs run in system-python (not the .venv above), so
    # install examlops here too. Base package is enough (metadata/write paths need no
    # optional extras).
    - pip install -e platform/cli -q
    # EXAMLOPS_DOCS_ROOT: the docs router's auto-detection of the project root
    # fails in CI's checkout layout and returns 503; point it at the repo root.
    # test_storage is skipped in CI only: moto's MockRawResponse is incompatible
    # with aiobotocore 2.13 (no raw_headers) — a test-infra version issue, not a
    # product bug. Runs locally; tracked as tech debt to re-enable once aligned.
    - EXAMLOPS_DOCS_ROOT="$CI_PROJECT_DIR" pytest platform/services/dashboard/backend/tests/ -v --tb=short
        --ignore=platform/services/dashboard/backend/tests/test_storage.py
        --junit-xml=reports/dashboard-backend.xml
  artifacts:
    reports:
      junit:
        - reports/examlops-unit.xml
        - reports/dashboard-backend.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    when: always
    expire_in: 7 days
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ── Postgres engine parity ────────────────────────────────────────────────────
# `EXAMLOPS_DB_BACKEND=postgres` is a supported production engine (enterprise-readiness
# item 0.1), but until now nothing in CI ever ran on it — every job used the SQLite
# default, so a dialect regression could only be found by someone remembering to run
# `make test-postgres` by hand. The two suites that carry the platform's data layer now
# run against a real Postgres 16 service.
#
# Both suites, not just the unit one: the dashboard is a separate app with its own
# connection adapter, and every Postgres-specific defect found so far (row shape, numeric
# widening, INTEGER narrowing) surfaced there first.
test:postgres:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: examlops
    POSTGRES_PASSWORD: examlops
    POSTGRES_DB: examlops
    EXAMLOPS_DB_BACKEND: postgres
    EXAMLOPS_POSTGRES_DSN: postgresql://examlops:examlops@postgres:5432/examlops
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → always, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:                                      # branches/MRs → only when it can break
        - platform/cli/src/examlops/storage/**/*
        - platform/cli/src/examlops/platform_db*.py
        - platform/services/dashboard/backend/**/*
        - tests/unit/test_storage*.py
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 20 minutes
  cache:
    - <<: *uv_cache
      policy: pull
  before_script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv
    - uv pip install -e ".[dev]"
    # Deliberately not in the root `[dev]` extra: psycopg is what makes the *optional*
    # Postgres engine optional, and only this job needs it. Adding it to `[dev]` would
    # install a driver into every SQLite job and quietly weaken that claim.
    - uv pip install --quiet "psycopg[binary]>=3.3" "psycopg-pool>=3.3"
  script:
    # Separate schemas: one Postgres database holds both suites, and each has its own
    # truncate-based isolation fixture. Sharing one schema would let them race.
    - EXAMLOPS_POSTGRES_SCHEMA=exa_ci .venv/bin/pytest tests/unit/ -q --tb=short
        --junit-xml=reports/postgres-unit.xml
    - .venv/bin/pip install -r platform/services/dashboard/backend/requirements.txt -q
    - cd platform/services/dashboard/backend &&
      EXAMLOPS_POSTGRES_SCHEMA=exa_ci_dash
      EXAMLOPS_DOCS_ROOT="$CI_PROJECT_DIR"
      PYTHONPATH="$CI_PROJECT_DIR/platform/cli/src"
      "$CI_PROJECT_DIR/.venv/bin/pytest" tests/ -q --tb=short
        --ignore=tests/test_storage.py
        --junit-xml="$CI_PROJECT_DIR/reports/postgres-dashboard.xml"
  artifacts:
    reports:
      junit:
        - reports/postgres-unit.xml
        - reports/postgres-dashboard.xml
    when: always
    expire_in: 7 days

# ── Integration: Ray Serve end-to-end ─────────────────────────────────────────
# Needs ≥4 CPUs on the runner (the active runner already satisfies this).
# Blocking gate: a failure here fails the pipeline and blocks deploy. Runs on
# every main push and tag (full-suite policy) plus any branch/MR touching
# serving/ or tests/integration/.
# ── Skipper agent ─────────────────────────────────────────────────────────────
# The agent's 206 tests ran in neither `make check` nor any pipeline until now: the
# root `test` target is `pytest tests/`, and the suite lives under
# platform/services/agent/tests. A change to skipper/ could break all of them with
# every gate green — the worst place for that to be true, since an agent's regressions
# are the hardest kind to notice by using it.
#
# Its own job rather than folding it into test:examlops, because it needs eleven
# LangChain/LangGraph packages the root [dev] extras deliberately do not carry. For the
# same reason it declares NO cache: the shared `uv-$CI_COMMIT_REF_SLUG` key holds the
# .venv every other job pulls, and pushing a langchain-laden one into it would slow
# them all down for nothing.
test:agent:
  stage: test
  image: python:3.12-slim
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/services/agent/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 15 minutes
  before_script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv
    # requirements.txt is the pinned source of truth for the agent's dependencies;
    # pytest-asyncio is a test-only dep the service itself does not need.
    - uv pip install -r platform/services/agent/requirements.txt
    - uv pip install pytest pytest-asyncio
    # the tests import `examlops` (platform_db, audit, vector store) the way the agent does
    - uv pip install -e platform/cli
  script:
    - .venv/bin/pytest platform/services/agent/tests -v --tb=short
        --junit-xml=reports/agent-unit.xml
  artifacts:
    reports:
      junit: reports/agent-unit.xml
    when: always
    expire_in: 7 days

test:frontend:
  stage: test
  image: node:24-alpine
  interruptible: true
  needs: [sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - platform/services/dashboard/frontend/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 15 minutes
  # The dashboard frontend ran in NO pipeline until 2026-08-20. `tsc -b` happened only inside
  # the image build in deploy:lxp, so a type error surfaced on the production node AFTER
  # release:gitlab had already tagged — the most expensive place to find it. 373 vitest tests
  # gated nothing at all. The four steps below are the same ones `make dashboard-check` runs.
  before_script:
    - cd platform/services/dashboard/frontend
    - npm ci                       # lockfile-exact, unlike the image build's `npm install`
  script:
    - npm run lint
    - npx vitest run --reporter=junit --outputFile="$CI_PROJECT_DIR/reports/frontend-unit.xml"
    - npm run build                # tsc -b && vite build — the type check, before deploy
  artifacts:
    reports:
      junit: reports/frontend-unit.xml
    when: always
    expire_in: 7 days

test:integration:
  stage: test
  image: python:3.12
  interruptible: true
  needs: [sanity:python-syntax, sanity:check-structure]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # main → full suite, gates deploy
      when: on_success
    - if: $CI_COMMIT_TAG                            # tags → release gate
      when: on_success
    - changes:
        - serving/**/*
        - tests/integration/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  timeout: 15 minutes
  cache:
    - <<: *uv_cache
      policy: pull
  before_script:
    - pip install --quiet --upgrade pip uv
    - uv venv --clear .venv   # --clear: runners reuse build dirs; a leftover .venv otherwise fails
    - uv pip install -e ".[dev]"
  script:
    - .venv/bin/pytest tests/integration/ -v --tb=short
        --junit-xml=reports/integration.xml
  artifacts:
    reports:
      junit: reports/integration.xml
    when: always
    expire_in: 7 days

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: DEPLOY — SSH to lxp-cpu01, git pull, docker compose up (main only)
#
# Auto-deploy to lxp runs on every main push: deploy:lxp → smoke:lxp (auto-rollback
# on failure) → post-deploy:lxp:*. (The 2026-07 presentation freeze has been lifted.)
# ═══════════════════════════════════════════════════════════════════════════

# ── Release: make the tag set legible ─────────────────────────────────────────
# The project had a full tag history and *zero* GitLab Releases, so the tags carried no
# notes and nothing linked a version to what changed in it. This turns each tag into a
# Release whose description is that version's own CHANGELOG section — no hand-written
# notes to keep in sync, and it fails loudly if the section is missing, which is the
# cheapest possible check that the CHANGELOG was actually updated before tagging.
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false      # a half-created release is worse than a slow one
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  needs:
    - job: test:examlops
    - job: test:infra:compose
    - job: test:infra:slurm-lint
    - job: test:infra:alert-rules
    - job: test:integration
    - job: test:agent
    - job: test:frontend
  script:
    # `release:` (below) is what actually creates the object; this only prepares the text.
    # awk over the CHANGELOG: print the section for this tag, stopping at the next `## [`.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      awk -v v="$VERSION" '
        $0 ~ "^## \\[" v "\\]" { inside = 1; next }
        inside && /^## \[/        { exit }
        inside                     { print }
      ' CHANGELOG.md > release-notes.md
      if [ ! -s release-notes.md ]; then
        echo "CHANGELOG.md has no '## [$VERSION]' section — tag $CI_COMMIT_TAG has nothing to describe." >&2
        exit 1
      fi
      echo "Release notes for $CI_COMMIT_TAG ($(wc -l < release-notes.md) lines):"
      head -20 release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: release-notes.md
  artifacts:
    paths: [release-notes.md]
    expire_in: 30 days

deploy:lxp:
  stage: deploy
  image: ubuntu:22.04
  timeout: 20 minutes
  # There is exactly one LXP node, and deploying to it is a `git pull` + image rebuild.
  # Two pipelines reaching this job at once would interleave on the same checkout, and
  # smoke:lxp's rollback would then reset to a SHA the *other* pipeline recorded. The
  # resource group makes GitLab run them one after another; it is shared with smoke:lxp
  # so a deploy cannot start while the previous deploy's health gate is still deciding.
  resource_group: production-lxp
  # deploy:lxp only runs on main, where every gating test job is created
  # (full-suite policy), so all are required here — deploy proceeds only when the
  # entire suite is green. test:modelzoo is intentionally excluded: it is a
  # non-blocking, informational job (ModelZoo owns its own CI/CD) and is not
  # created on plain main pushes, so requiring it would break pipeline creation.
  needs:
    - job: test:examlops            # core gate — always runs
    - job: test:infra:compose
    - job: test:infra:slurm-lint
    - job: test:infra:alert-rules
    - job: test:integration
    - job: test:agent
    - job: test:frontend
  rules:
    # A nightly schedule exists to *find out* whether main is green, not to ship it.
    # Without this a scheduled pipeline satisfies the branch condition below and would
    # redeploy production every night with no one asking for it.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Set DEPLOY_REQUIRES_APPROVAL (project CI/CD variable, any value) to turn
    # production into a button instead of an automatic consequence of merging. This is
    # the tier-free substitute for GitLab's Premium deployment approvals: it gates *when*
    # rather than *who*, which is the half that matters with one maintainer.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_REQUIRES_APPROVAL
      when: manual
      allow_failure: false   # a skipped manual deploy must not report the pipeline green
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  environment:
    name: production-lxp
    url: http://$LXP_HOST:18099
  before_script:
    - *ssh_setup
  script:
    - |
      # Record the current production commit so smoke:lxp can roll back to it.
      PREV_SHA=$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
        "cd \"$LXP_DEPLOY_PATH\" && git rev-parse HEAD 2>/dev/null || echo NONE")
      echo "Previous production SHA: $PREV_SHA"
      echo "$PREV_SHA" > prev_sha.txt

      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" "
        set -e
        if [ ! -d \"$LXP_DEPLOY_PATH/.git\" ]; then
          mkdir -p \"$LXP_DEPLOY_PATH\"
          GIT_TERMINAL_PROMPT=0 git clone \"$LXP_DEPLOY_REPO\" \"$LXP_DEPLOY_PATH\"
        fi
        cd \"$LXP_DEPLOY_PATH\"
        GIT_TERMINAL_PROMPT=0 git pull origin main
        # Upstream model library (ADR 0094). Since 2026-08-07 it is NOT vendored in this
        # repo — it is not our code — so the deploy node fetches it beside the checkout at
        # \$LXP_DEPLOY_PATH/modelzoo, which is exactly where the default resolution of
        # EXAMLOPS_MODELZOO_DIR already looks. Non-fatal: only training + serving need it.
        if [ -n \"\$LXP_MODELZOO_REPO\" ]; then
          if [ -d modelzoo/.git ]; then
            ( cd modelzoo && GIT_TERMINAL_PROMPT=0 git fetch --depth=1 origin main \
              && git reset --hard FETCH_HEAD ) && echo \"modelzoo refreshed: \$(cd modelzoo && git rev-parse --short HEAD)\" \
              || echo \"warn: modelzoo refresh failed — keeping the existing checkout\"
          else
            GIT_TERMINAL_PROMPT=0 git clone --depth=1 \"\$LXP_MODELZOO_REPO\" modelzoo \
              && echo \"modelzoo cloned\" || echo \"warn: modelzoo clone failed — training will fail until it is present\"
          fi
        else
          echo \"warn: LXP_MODELZOO_REPO unset — modelzoo not fetched (training/serving need it)\"
        fi
        # Refresh the host operator CLI so \`exa\` stays present + matches the deployed
        # code. \`uv sync --frozen\` prunes the editable \`examlops\` member (leaving the
        # .venv with only the workspace coordinator and no exa script), so we install it
        # explicitly. Non-fatal: the containerized services are the real deploy; a host
        # CLI hiccup must not fail production.
        export PATH=\"\$HOME/.local/bin:/localhome/\$LXP_USER/.local/bin:\$PATH\"
        uv pip install -e . >/dev/null 2>&1 && echo \"exa CLI refreshed: \$(.venv/bin/exa --version 2>/dev/null)\" || echo \"warn: exa CLI refresh skipped (uv unavailable) — non-fatal\"
        # Grant the JupyterHub workbench notebook user (uid 1000 / jovyan) write access to the
        # pipeline-code dirs so notebooks can edit model YAML / configs / the engine. NFS ACL +
        # default ACL so new files inherit it. Non-fatal (host repo stays owned by the deploy user).
        setfacl -R -m u:1000:rwX -m d:u:1000:rwX usecases pipelines 2>/dev/null && echo \"workbench pipeline ACL set\" || echo \"warn: pipeline ACL skipped — non-fatal\"
        # Rebuild the core stack. NOTE: NO --remove-orphans — it deletes the on-demand
        # profile services (monitoring, JupyterHub, SeanerBUS bridge) and breaks those tabs
        # (project workbenches / Grafana embeds / SeanerBUS) on every deploy.
        docker compose \
          -f platform/infra/docker-compose/docker-compose.yml \
          -f platform/infra/docker-compose/docker-compose.lxp.yml \
          up --build -d
        # Persist JupyterHub (project workbenches spawn as Hub named servers) + the SeanerBUS
        # bridge across deploys. All non-fatal — a build/network hiccup must never fail production.
        docker build --network=host -t examlops-jupyterlab \
          -f platform/infra/docker-compose/Dockerfile.jupyterlab \
          platform/infra/docker-compose >/dev/null 2>&1 && echo \"jupyterlab image built\" || echo \"warn: jupyterlab image build skipped\"
        docker compose \
          -f platform/infra/docker-compose/docker-compose.yml \
          -f platform/infra/docker-compose/docker-compose.lxp.yml \
          --profile jupyter up -d --build jupyterhub >/dev/null 2>&1 && echo \"jupyterhub up\" || echo \"warn: jupyterhub start skipped\"
        docker compose \
          -f platform/infra/docker-compose/docker-compose.yml \
          -f platform/infra/docker-compose/docker-compose.lxp.yml \
          --profile seanerbus up -d seanerbus-bridge >/dev/null 2>&1 && echo \"seanerbus bridge up\" || echo \"warn: seanerbus bridge start skipped\"
        echo \"Deploy complete: \$(git rev-parse HEAD)\"
      "
  artifacts:
    paths:
      - prev_sha.txt
    expire_in: 1 hour

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: SMOKE — health probes after deploy, auto-rollback on failure
# ═══════════════════════════════════════════════════════════════════════════

smoke:lxp:
  stage: smoke
  image: ubuntu:22.04
  timeout: 10 minutes
  needs: [deploy:lxp]
  resource_group: production-lxp   # see deploy:lxp — the rollback path writes to the node too
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  before_script:
    - *ssh_setup
  script:
    - PREV_SHA=$(cat prev_sha.txt)
    - echo "==> Waiting ${SMOKE_STARTUP_WAIT}s for services to initialise..."
    - sleep "$SMOKE_STARTUP_WAIT"
    - |
      run_smoke() {
        # Copy the smoke script to the remote host and execute it there.
        ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
          "EXAMLOPS_DEPLOY_PATH=$LXP_DEPLOY_PATH bash -s" \
          < platform/ci/smoke_check.sh
      }

      ATTEMPT=1
      while [ "$ATTEMPT" -le "$SMOKE_RETRY_COUNT" ]; do
        echo "==> Smoke probe attempt $ATTEMPT/$SMOKE_RETRY_COUNT"
        if run_smoke; then
          echo "==> All services healthy."
          exit 0
        fi
        ATTEMPT=$((ATTEMPT + 1))
        [ "$ATTEMPT" -le "$SMOKE_RETRY_COUNT" ] && {
          echo "==> Retrying in ${SMOKE_RETRY_DELAY}s..."
          sleep "$SMOKE_RETRY_DELAY"
        }
      done

      echo ""
      echo "==> Smoke checks FAILED after $SMOKE_RETRY_COUNT attempts."

      if [ "$PREV_SHA" = "NONE" ]; then
        echo "==> No previous SHA recorded — cannot auto-rollback. Manual intervention required."
        exit 1
      fi

      echo "==> Auto-rolling back to $PREV_SHA ..."
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" "
        set -e
        cd \"$LXP_DEPLOY_PATH\"
        echo 'Resetting to $PREV_SHA ...'
        git reset --hard '$PREV_SHA'
        docker compose \
          -f platform/infra/docker-compose/docker-compose.yml \
          -f platform/infra/docker-compose/docker-compose.lxp.yml \
          up --build -d --remove-orphans
        echo 'Rollback deployed: $PREV_SHA'
      "

      echo "==> Waiting ${SMOKE_STARTUP_WAIT}s for rollback to stabilise..."
      sleep "$SMOKE_STARTUP_WAIT"

      if ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$LXP_USER@$LXP_HOST" \
          "EXAMLOPS_DEPLOY_PATH=$LXP_DEPLOY_PATH bash -s" < platform/ci/smoke_check.sh; then
        echo "==> Rollback is healthy. Previous release ($PREV_SHA) restored."
      else
        echo "==> WARNING: Rollback health check also failed. Manual intervention required."
      fi

      exit 1  # pipeline must still fail to signal the bad commit

# ═══════════════════════════════════════════════════════════════════════════
# STAGE: POST-DEPLOY — notify + retrain (only after smoke passes)
# ═══════════════════════════════════════════════════════════════════════════

post-deploy:lxp:notify-model-changes:
  stage: post-deploy
  image: python:3.12-slim
  needs: [smoke:lxp]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  variables:
    CONTROL_PLANE_URL: $LXP_CONTROL_PLANE_URL
    CONTROL_PLANE_TOKEN: $LXP_CONTROL_PLANE_TOKEN
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet httpx
  script:
    - |
      python platform/ci/notify_model_changes.py \
        --before "$CI_COMMIT_BEFORE_SHA" \
        --after  "$CI_COMMIT_SHA" \
        --commit-msg "$CI_COMMIT_MESSAGE" || true

post-deploy:lxp:retrain-push-models:
  stage: post-deploy
  image: python:3.12-slim
  needs: [smoke:lxp]
  # Best-effort: the deploy is already validated by deploy:lxp + smoke:lxp. This
  # only kicks off Prefect retraining, which is racy right after a fresh deploy
  # (Prefect still warming up) and is also driven by drift/schedule — so a timeout
  # here must not mark an otherwise-healthy deploy as failed.
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  variables:
    MODELS: "JPCP MACK MCBound"
    RETRAIN_DATASET: "FDataDataset"
    RETRAIN_DUMMY: "false"
    CONTROL_PLANE_URL: $LXP_CONTROL_PLANE_URL
    CONTROL_PLANE_TOKEN: $LXP_CONTROL_PLANE_TOKEN
  script:
    - pip install --quiet httpx
    - python platform/ci/retrain_push_models.py

# ── Failure notification ──────────────────────────────────────────────────────
# Fires when any job on main fails, if NOTIFICATION_WEBHOOK_URL is set.

notify:failure:
  stage: post-deploy
  image: python:3.12-slim
  when: on_failure
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $NOTIFICATION_WEBHOOK_URL
      when: on_failure
  script:
    - python platform/ci/notify_failure.py
