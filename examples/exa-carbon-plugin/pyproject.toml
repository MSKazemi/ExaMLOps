[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exa-carbon-plugin-example"
version = "0.1.0"
description = "Example ExaMLOps carbon provider plugin (entry-point) — copy-paste scaffolding."
requires-python = ">=3.12"
# `examlops` provides the Provider base class at runtime; not pinned here so the example
# installs against whatever examlops is already on the host.

# This is what makes the provider discoverable: a `pip install .` registers it under the
# `exa.providers.carbon` entry-point group, and `exa finops carbon providers` then lists it.
[project.entry-points."exa.providers.carbon"]
example-fixed-grid = "exa_carbon_plugin.provider:FixedGridProvider"

[tool.setuptools.packages.find]
where = ["src"]
