[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "examlops-serving"
version = "0.52.0"
requires-python = ">=3.12"
description = "ExaMLOps model serving — Ray Serve multi-model server + inference pipeline."
dependencies = [
    "ray[serve]==2.55.0",
    "mlflow==3.16.0",
    # Cap fastapi below 0.137: ray 2.55.0's @serve.ingress cloudpickles the FastAPI app and
    # fastapi>=0.137 holds an unpicklable _thread.lock. See root pyproject note.
    "fastapi>=0.141.1,<0.142",
    "scikit-learn>=1.3.0",
    "examlops-pipelines",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["serving*"]
