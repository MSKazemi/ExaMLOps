[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

# Workspace coordinator: the installable `examlops` package now lives in
# platform/cli/. This root is renamed so it does not collide with that member
# name in [tool.uv.workspace]; it still carries the aggregate dependency set so
# `make install-dev` (uv pip install -e ".[dev]") bootstraps the whole dev env.
[project]
name = "examlops-workspace"
version = "0.41.0"
requires-python = ">=3.12"
dependencies = [
    # workspace members — installs exa CLI entry point
    "examlops",
    # shared across all components
    "setuptools>=65,<80",
    "mlflow==3.11.1",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "boto3>=1.28.0",        # S3-compatible artifact store (MinIO / production MinIO)
    "pyyaml>=6.0",
    # modelzoo dependencies
    "torch",
    "numpy",
    "sentence-transformers>=2.0.0",
    "xgboost>=1.7.0",
    # pipeline / orchestration
    "prefect>=3.0.0,<4.0",
    # serving — FastAPI is used as the HTTP layer inside Ray Serve (@serve.ingress).
    # Upper-bound is REQUIRED: ray 2.55.0's `@serve.ingress` cloudpickles the FastAPI app at
    # import time, and fastapi>=0.137 holds an unpicklable `_thread.lock` ("cannot pickle
    # '_thread.lock' object"). 0.136.x is verified-compatible. Lift the cap when the ray pin
    # moves to a release that tolerates the newer fastapi. (starlette version is unaffected.)
    "fastapi>=0.100.0,<0.137",
    # ray serving
    "ray[serve]==2.55.0",
    # CLI
    "typer>=0.12",
    "prometheus-client>=0.20",
    # SeanerBUS bridge (runtime transport only; pycapnp is the C extension)
    "pycapnp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local path — only resolved when explicitly requested (make seanerbus-install).
# Not installed in CI; unit tests stub out the seanerbus package entirely.
seanerbus = [
    "seanerbus @ file:///home/mohsen/seanergys/seanerbus/bindings/python",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",  # async test support
    "pytest-cov>=4.1",
    "httpx>=0.24",        # HTTP client for integration tests
    "ruff==0.15.6",     # pinned: ruff's formatter evolves between releases; an exact
                        # pin keeps `ruff format --check` deterministic in CI (the
                        # loose `>=0.4` let CI install a newer ruff than the code was
                        # formatted with, breaking the pipeline on every release).
    "mypy>=1.8",
    "pandas-stubs>=2.0",
    "paramiko>=3.5.0",  # SSH-transport tests (tests/unit/test_executor.py). The runtime
                        # dep lives in pipelines/pyproject.toml, but CI installs only the
                        # root workspace `.[dev]`, so without it here the executor tests
                        # fail in CI with ModuleNotFoundError while passing locally.
    "simpleeval>=1.0",  # Declarative-expression provider (ADR 0074) + policy `when`
                        # conditions (ADR 0079). The runtime dep is the optional
                        # `examlops[finops]` extra, but CI installs only root `.[dev]`;
                        # without it here 17 provider/policy tests that exercise the
                        # expression path fail in CI (ProviderError) while passing locally.
    "pyjwt>=2.10",      # OIDC SSO token validation (examlops.oidc, Phase 2 item 2.1).
                        # The runtime dep is the optional `examlops[oidc]` extra, but CI
                        # installs only root `.[dev]`; without it here tests/unit/test_oidc.py
                        # fails collection with ModuleNotFoundError: No module named 'jwt'.
]

# ─── Tool config ─────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# First-party source roots so import-sorting (I001) groups examlops/pipelines/
# serving as first-party. examlops lives under platform/cli/src after the
# Phase 15 restructure; pipelines/ and serving/ are first-party at the repo root.
src = [".", "platform/cli/src"]

[tool.ruff.format]
# platform_db.py is a mid-module re-export barrel: each `from examlops.data.<domain>
# import (...)` line carries a line-level `# noqa: E402, F401` that only works while the
# import stays on ONE physical line. `ruff format` would wrap them multi-line and strand
# the noqa on the closing paren (254 spurious F401/E402). The layout is deliberate; exclude
# it from the formatter (it stays `ruff check`-clean).
exclude = ["platform/cli/src/examlops/platform_db.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# sys.path manipulation before local imports is intentional in scripts and tests
"pipelines/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"**/tests/**/*.py" = ["E402"]
# sys.path injection for registry_loader — intentional before third-party imports
"serving/ray_serving/app.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.uv.workspace]
members = ["pipelines", "serving", "platform/cli"]

[tool.uv.sources]
examlops = { workspace = true }
examlops-pipelines = { workspace = true }
examlops-serving = { workspace = true }
