name: Feature request
description: Propose a new capability or an improvement.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution — the best features come from a clear
        description of what is hard today. Many extensions need no change here at all:
        use-case packs, provider plugins and `exa` CLI plugins live in their own packages
        (see [Extend without forking](https://github.com/MSKazemi/ExaMLOps/blob/main/.github/CONTRIBUTING.md#extend-without-forking)).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard or impossible today?
      placeholder: On our Flux cluster I can't see which project spent the GPU-hours for a retrain...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? A sketch of the command, API or UI is welcome.
      placeholder: "`exa project cost research --since 30d --by model`"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you use today, or tools that already do this.
  - type: dropdown
    id: area
    attributes:
      label: Lifecycle area
      options:
        - Training & pipelines
        - Data & features
        - Models & registry
        - Serving & inference
        - GenAI & LLMOps
        - Agents & automation
        - Monitoring & quality
        - HPC, fleet & FinOps
        - Governance & security
        - Projects & workspaces
        - Platform & integrations
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I'd like to implement it"
        - "Yes, with some guidance"
        - "No, but I can test it"
        - "No"
