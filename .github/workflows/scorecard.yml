name: OpenSSF Scorecard

# OpenSSF Scorecard grades the repository's security posture — pinned dependencies, token
# permissions, branch protection, signed releases, SAST, vulnerability disclosure, and more —
# and publishes the result to api.scorecard.dev (the README badge). Posture, not a gate: it
# reports to code scanning and never blocks a merge.
#
# The public API rejects results from a workflow that breaks its integrity rules, so this file
# stays minimal on purpose: no top-level env or defaults, no write permission at the workflow
# level, id-token only on the Scorecard job, and only the actions Scorecard approves in it.

on:
  branch_protection_rule:
  schedule:
    - cron: "29 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'MSKazemi/ExaMLOps'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the repository being graded
      actions: read # read workflow runs (CI-Tests, SAST checks)
      security-events: write # upload the SARIF report to code scanning
      id-token: write # publish results to the Scorecard API (the badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard.sarif
          category: scorecard
