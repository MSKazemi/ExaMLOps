name: Docs site

# CI already builds the documentation with `mkdocs build --strict` and uploads it
# as an artifact, with the note that this "is exactly what a Pages deploy would
# publish" — and then throws it away, so the site 404'd while every page it should
# serve sat in the tree. This job is the missing half: the same strict build,
# published at https://mskazemi.com/ExaMLOps/ (the user site's custom domain;
# mskazemi.github.io/ExaMLOps redirects there).
#
# Deployment of the PLATFORM still belongs to .gitlab-ci.yml, which owns the
# deploy node (see ci.yml). This deploys documentation to GitHub Pages only, so
# the boundary that keeps deployment out of ci.yml is not crossed.
#
# Hardened like ci.yml (see its header): SHA-pinned actions, no persisted credentials, a
# timeout on every job, and the write scopes granted only to the job that deploys.
#
# PREREQUISITE (a repository setting, not code): Settings → Pages → Source must be
# "GitHub Actions" (enabled 2026-09-10). Without it the deploy job fails with
# `Failed to create deployment (status: 404)`.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "platform/ci/requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one midway, or Pages is left half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: python -m pip install --quiet -r platform/ci/requirements-docs.txt

      # The site serves mermaid and KaTeX itself (docs/overrides/docs_assets_hook.py), so the
      # build needs both pinned packages and stops without them rather than letting the published
      # page fetch them from a CDN in every reader's browser. This is the job that publishes that
      # page: leaving the packages out of it took the Pages deploy down while CI's own docs job,
      # which had them, stayed green.
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            platform/ci/mermaid/package-lock.json
            platform/ci/katex/package-lock.json

      - name: Install the pinned front-end assets
        run: |
          npm ci --prefix platform/ci/mermaid
          npm ci --prefix platform/ci/katex

      # Same flags as the CI job: a broken link, a broken anchor or a page missing
      # from the nav stops the deploy instead of reaching a reader.
      - name: Build (strict)
        run: mkdocs build --clean --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    # The private repository carries this file too; only the public one publishes the site.
    if: ${{ github.repository == 'MSKazemi/ExaMLOps' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # create the Pages deployment
      id-token: write # OIDC token deploy-pages uses to prove which workflow is deploying
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
