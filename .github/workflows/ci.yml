name: CI

# Slim public CI: lint + unit tests, so a contributor's PR gets a real signal.
#
# Deliberately NOT here:
#   • deployment — that lives in .gitlab-ci.yml, which owns the deploy node.
#   • the modelzoo suite — `seanergys_modelzoo` is an UPSTREAM library with its
#     own repo and its own CI. It is not vendored here (ADR 0094): the platform
#     core never imports it, only the use-case pack does, through the loader
#     seam. The tests that need it skip cleanly when it is absent, which is
#     exactly the situation in this repo. Set EXAMLOPS_MODELZOO_DIR to a
#     checkout to run them.
#
# Supply-chain rules, enforced by tests/unit/test_github_workflows_hardened.py and by the
# `workflow lint` job below (actionlint + zizmor) — both read every file in this directory:
#   • every third-party action is pinned to a full commit SHA with its version in a comment
#     (`owner/repo@<40-hex> # vX.Y.Z`); Dependabot keeps the pair current. A tag is mutable:
#     on 2026-03-19 76 of 77 existing aquasecurity/trivy-action tags were force-pushed to
#     credential-stealing code (GHSA-69fq-xp46-6x23 / CVE-2026-33634).
#   • every checkout sets `persist-credentials: false`, so no later step can reuse the token.
#   • every job has a `timeout-minutes`; a hung job otherwise burns six hours of runner time.
#   • the workflow token is read-only; a job that needs more asks for it by name.
#
# Branch protection should require exactly ONE check: `ci-ok` (bottom of this file). It fails
# unless every job it names succeeded or was deliberately skipped, so adding a job never
# means editing the protection rule — only its `needs:` list, which the guard test enforces.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# A newer push to the same PR supersedes the old run. Pushes to main are NEVER cancelled:
# each commit on main gets its own verdict, or a red commit hides behind a green successor
# (the cancelled "--help" run of 2026-09-10 is exactly that gap).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  examlops:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # uv.lock is what every environment is built from. A manifest edited without relocking
      # (Dependabot PR #4 raised a setuptools bound in four pyproject.toml files and left the
      # lock untouched) otherwise merges green and breaks the next `uv sync`.
      - name: Lockfile matches the manifests
        run: uv lock --check

      # Install EXACTLY what uv.lock pins. `uv pip install -e ".[dev]"` ignored the lock and
      # resolved the newest of everything on each run, so on 2026-09-10 main went red with no
      # commit of ours: typer 0.27 (vendoring click as `typer._click`) was published, CI picked
      # it up, and the CLI mypy ratchet failed while the lock still said typer 0.25.1. A red
      # build must mean a change in THIS repository; a dependency moves only through a
      # Dependabot PR, where its breakage shows up on that PR instead of on main.
      - name: Install dependencies (from uv.lock)
        id: install
        if: ${{ !cancelled() }}
        run: uv sync --frozen --extra dev --python 3.12

      # Every check below runs even when an earlier one failed (`!cancelled()`), so one push
      # reports every problem at once. A red mypy step used to hide the unit and dashboard
      # results entirely — a Dependabot PR could not show whether its bump broke a test.
      - name: Ruff (lint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/ruff check platform/cli/src/ tests/ pipelines/ serving/ platform/services/ platform/clients/ usecases/

      - name: Ruff (format)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/ruff format --check platform/cli/src/ tests/ pipelines/ serving/ platform/services/ platform/clients/ usecases/

      # Mirror the GitLab `test:examlops` job (the deploy gate): without these two steps a PR
      # with a mypy regression in the ratcheted platform/cli/src/ (baseline 0) or a broken
      # dashboard-backend test merged green on GitHub and only reddened the pipeline that
      # gates the production deploy — the v0.26.x "passed locally, failed in deploy CI" saga
      # relocated to a new surface.
      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/mypy pipelines/ serving/ platform/services/ --ignore-missing-imports

      - name: mypy (ratcheted CLI package)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make typecheck-cli

      # `-n auto`: the suite is 2781 tests and was running in one process. Measured locally,
      # 520s serial vs 66s across cores. Safe because every test gets a private PLATFORM_DB
      # (tests/conftest.py) — the shared-state leak that made parallel runs fail is closed.
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv/bin/pytest tests/unit/ -n auto -q --tb=short --junit-xml=reports/examlops-unit.xml

      - name: Dashboard backend tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pip install -r platform/services/dashboard/backend/requirements.txt -q
          pip install -e platform/cli -q
          EXAMLOPS_DOCS_ROOT="$GITHUB_WORKSPACE" pytest platform/services/dashboard/backend/tests/ -q --tb=short \
            --ignore=platform/services/dashboard/backend/tests/test_storage.py \
            --junit-xml=reports/dashboard-backend.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: reports/
          if-no-files-found: ignore

  package:
    # The `examlops` wheel is what `pip install examlops` delivers, and nothing built it:
    # the docs advertised an install no job had ever performed. This job builds the wheel +
    # sdist exactly as the release does, then installs the wheel into a fresh venv in a
    # directory with NO checkout and runs the CLI there — the only test that notices when
    # runtime code reaches back into the repository instead of into its own package.
    name: package (wheel · py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Every artifact of a release carries one version; a drifted copy fails here, on the
      # PR, rather than as a tag whose chart and wheel disagree about what they are.
      - name: Version copies agree
        run: python3 platform/ci/release_version.py check

      - name: Build wheel + sdist
        run: uv build platform/cli --out-dir dist

      - name: Metadata renders on PyPI (twine check --strict)
        run: uvx twine@7.0.0 check --strict dist/*

      - name: Install the wheel outside the repository and run it
        env:
          PY: ${{ matrix.python }}
        run: |
          set -euo pipefail
          want="$(python3 platform/ci/release_version.py current)"
          wheel="$(ls "$PWD"/dist/examlops-*.whl)"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/home" && cd "$smoke"
          uv venv --python "$PY" venv
          uv pip install --python venv/bin/python "$wheel"
          export HOME="$smoke/home" PLATFORM_DB="$smoke/platform.db"
          got="$(venv/bin/exa --version)"
          echo "$got"
          [ "$got" = "exa version $want" ] || { echo "::error::installed exa reports '$got', expected $want"; exit 1; }
          venv/bin/exa --help >/dev/null
          venv/bin/exa --json docs > docs.json
          venv/bin/python -c "import json; json.load(open('docs.json'))"

      - name: Upload distributions
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  agent:
    # The Skipper suite (206 tests) ran nowhere: `make check` is `pytest tests/` at the
    # repo root, and these live under platform/services/agent/tests, so a change to
    # skipper/ could break all of them with every gate green. Its own job because it needs
    # eleven LangChain/LangGraph packages the root [dev] extras deliberately do not carry.
    name: skipper agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --clear .venv
          uv pip install -r platform/services/agent/requirements.txt
          uv pip install pytest pytest-asyncio
          uv pip install -e platform/cli

      - name: Agent tests
        run: .venv/bin/pytest platform/services/agent/tests -q --tb=short --junit-xml=reports/agent-unit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-test-report
          path: reports/
          if-no-files-found: ignore

  frontend:
    name: dashboard frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/services/dashboard/frontend/package-lock.json

      - name: Install dependencies
        id: install
        working-directory: platform/services/dashboard/frontend
        run: npm ci

      # Lint, tests and build each report independently (see the examlops job).
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: platform/services/dashboard/frontend
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: platform/services/dashboard/frontend
        run: npx vitest run --reporter=junit --outputFile="$GITHUB_WORKSPACE/reports/frontend-unit.xml"

      # tsc -b is the type check. Until 2026-08-20 it ran ONLY inside the deploy image build.
      - name: Type check + build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: platform/services/dashboard/frontend
        run: npm run build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-report
          path: reports/
          if-no-files-found: ignore

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned rather than relying on the runner image: the chart is a published
      # artifact, so which helm validated it is part of the result. Downloaded from the helm
      # project and checked against the SHA-256 published in its v3.16.3 release notes, so a
      # third-party setup action is not needed to install one static binary.
      - name: Set up Helm
        env:
          HELM_VERSION: v3.16.3
          HELM_SHA256: f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          helm version --short

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Lint, the no-registry refusal check, and render. The kubectl schema step
      # inside the target self-skips: `kubectl apply --dry-run=client` downloads the
      # OpenAPI schema from a live apiserver, so it is not an offline check and a
      # runner has no cluster.
      - name: Validate chart
        run: make helm-validate

      # Structure the render cannot judge: appVersion tracking the platform version,
      # maintainer identity, and every workload promising maxUnavailable=0 actually
      # having a readiness probe. These skip when helm is absent, which is why they
      # live here and not only in the unit job.
      - name: Chart guards
        run: |
          # The three packages after pyyaml are not test dependencies — they are what the
          # autouse fixtures in tests/conftest.py drag in (prometheus_client at collection,
          # examlops.cli -> typer and examlops -> httpx at setup). Mirrors the identical fix
          # on GitLab's test:infra:helm (pipeline #3241): if a future fixture adds an import,
          # this job fails loudly rather than silently skipping the chart guards.
          python -m pip install --quiet pytest pyyaml prometheus_client httpx typer
          python -m pytest tests/unit/test_helm_chart.py tests/unit/test_dockerfile_build_context.py -q

      # A chart repository nobody can build is not publishable; this is the same
      # command the release would run, minus the copy to the host.
      - name: Package (dry run)
        run: make helm-package

  control-plane:
    name: control plane tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The service has no requirements.txt — its deps are an inline pip line in its
      # Dockerfile. These are what app.py/metrics.py/model_meta.py actually import.
      # app.py imports examlops.admission / .coordination / .data.events at module level,
      # so the package itself must be installed — mirrors GitLab's test:control-plane,
      # which hit the identical ModuleNotFoundError on pipeline #3241.
      - name: Install dependencies
        run: |
          uv venv --clear .venv
          uv pip install fastapi "uvicorn[standard]" prometheus_client pyyaml
          uv pip install -e platform/cli
          uv pip install pytest pytest-asyncio httpx

      - name: Control plane tests
        run: .venv/bin/pytest platform/services/control_plane/tests -q --tb=short --junit-xml=reports/control-plane-unit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-test-report
          path: reports/
          if-no-files-found: ignore

  docs:
    name: docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The docs were never built by CI. Twenty-one dead links accumulated in the published
      # site — twenty guides linking `design/adr/*.md`, which is outside docs_dir and never
      # published — and nothing failed, because mkdocs only warns and no job ran it. The
      # strict build is the whole point of this job: a broken link, a broken heading anchor
      # or a page missing from the nav stops the build instead of reaching a reader.
      - name: Install MkDocs
        run: python -m pip install --quiet -r platform/ci/requirements-docs.txt

      - name: Build (strict)
        run: mkdocs build --clean --strict

      # If it built, it is worth keeping: this is exactly what a Pages deploy would publish.
      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  workflow-lint:
    # The workflows are code that runs with the repository's token, and nothing checked them.
    # actionlint catches what GitHub only reports at run time (a bad expression, an unknown
    # input, shellcheck findings in `run:` blocks); zizmor audits the security properties the
    # header of this file promises — pinning, credential persistence, template injection,
    # excessive permissions. Both are pinned PyPI releases run through uvx, so linting the
    # workflows adds no third-party action to trust. `make lint-workflows` runs the same pair.
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.24 actionlint -color

      # Online audits (impostor commits, known-vulnerable actions, ref confusion) need a token;
      # the workflow's read-only one is enough.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.30.0 --format=github .github/workflows/

  dependency-review:
    # Blocks a PR that introduces a dependency with a known high/critical advisory, before it
    # reaches main. Reads the dependency graph diff through the API, so it needs no checkout.
    name: dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  ci-ok:
    # The ONE check branch protection requires. It runs even when a job it needs failed
    # (`always()`), and fails unless every job succeeded — dependency-review alone may be
    # skipped, because it only runs on pull requests. Without an aggregate, protection has to
    # list every job by name, and a job added later is silently not required.
    # tests/unit/test_github_workflows_hardened.py fails if a job in this file is missing here.
    name: ci-ok
    if: ${{ always() }}
    needs:
      - examlops
      - package
      - agent
      - frontend
      - helm
      - control-plane
      - docs
      - workflow-lint
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[]
            | select(.value.result != "success")
            | select(.key != "dependency-review" or .value.result != "skipped")
            | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::required jobs did not pass: $bad"
            exit 1
          fi
