name: CI

# Slim public CI: lint + unit tests, so a contributor's PR gets a real signal.
#
# Deliberately NOT here:
#   • deployment — that lives in .gitlab-ci.yml, which owns the deploy node.
#   • the modelzoo suite — `seanergys_modelzoo` is an UPSTREAM library with its
#     own repo and its own CI. It is not vendored here (ADR 0094): the platform
#     core never imports it, only the use-case pack does, through the loader
#     seam. The tests that need it skip cleanly when it is absent, which is
#     exactly the situation in this repo. Set EXAMLOPS_MODELZOO_DIR to a
#     checkout to run them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examlops:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --clear .venv
          uv pip install -e ".[dev]"

      - name: Ruff (lint)
        run: .venv/bin/ruff check platform/cli/src/ tests/ pipelines/ serving/ platform/services/ platform/clients/ usecases/

      - name: Ruff (format)
        run: .venv/bin/ruff format --check platform/cli/src/ tests/ pipelines/ serving/ platform/services/ platform/clients/ usecases/

      - name: Unit tests
        run: .venv/bin/pytest tests/unit/ -q --tb=short --junit-xml=reports/examlops-unit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/
          if-no-files-found: ignore

  agent:
    # The Skipper suite (206 tests) ran nowhere: `make check` is `pytest tests/` at the
    # repo root, and these live under platform/services/agent/tests, so a change to
    # skipper/ could break all of them with every gate green. Its own job because it needs
    # eleven LangChain/LangGraph packages the root [dev] extras deliberately do not carry.
    name: skipper agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --clear .venv
          uv pip install -r platform/services/agent/requirements.txt
          uv pip install pytest pytest-asyncio
          uv pip install -e platform/cli

      - name: Agent tests
        run: .venv/bin/pytest platform/services/agent/tests -q --tb=short --junit-xml=reports/agent-unit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-report
          path: reports/
          if-no-files-found: ignore

  frontend:
    name: dashboard frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/services/dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: platform/services/dashboard/frontend
        run: npm ci

      - name: Lint
        working-directory: platform/services/dashboard/frontend
        run: npm run lint

      - name: Unit tests
        working-directory: platform/services/dashboard/frontend
        run: npx vitest run --reporter=junit --outputFile="$GITHUB_WORKSPACE/reports/frontend-unit.xml"

      # tsc -b is the type check. Until 2026-08-20 it ran ONLY inside the deploy image build.
      - name: Type check + build
        working-directory: platform/services/dashboard/frontend
        run: npm run build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: reports/
          if-no-files-found: ignore

  control-plane:
    name: control plane tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The service has no requirements.txt — its deps are an inline pip line in its
      # Dockerfile. These are what app.py/metrics.py/model_meta.py actually import.
      - name: Install dependencies
        run: |
          uv venv --clear .venv
          uv pip install fastapi "uvicorn[standard]" prometheus_client pyyaml
          uv pip install pytest pytest-asyncio httpx

      - name: Control plane tests
        run: .venv/bin/pytest platform/services/control_plane/tests -q --tb=short --junit-xml=reports/control-plane-unit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-test-report
          path: reports/
          if-no-files-found: ignore

