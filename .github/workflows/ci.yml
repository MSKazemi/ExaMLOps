name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv and install all deps
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check src/ tests/ pipelines/ services/

      - name: Type check (mypy)
        run: .venv/bin/mypy pipelines/ services/ --ignore-missing-imports

      - name: Tests
        run: .venv/bin/pytest tests/ -v --tb=short
