# Automates the repo's standing dependency rule — always the latest stable — instead of
# relying on remembering it. Every bump arrives as a PR already run through CI, grouped
# weekly so the review cost is one PR per ecosystem, not one per package.
version: 2
updates:
  # Root uv workspace (pyproject.toml + uv.lock): the examlops CLI, pipelines, serving.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  # Services that keep their own pinned requirements.txt.
  - package-ecosystem: "pip"
    directories:
      - "/platform/services/agent"
      - "/platform/services/dashboard/backend"
    schedule:
      interval: "weekly"
    groups:
      service-deps:
        patterns: ["*"]

  # Dashboard frontend.
  - package-ecosystem: "npm"
    directory: "/platform/services/dashboard/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        patterns: ["*"]

  # CI actions (checkout/setup-python/setup-uv/…).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
