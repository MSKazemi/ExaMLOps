# Automates the repo's standing dependency rule — always the latest stable — instead of
# relying on remembering it. Every bump arrives as a PR already run through CI.
#
# Shape (the first cut grouped EVERY update of an ecosystem into one PR, and that failed):
#   • minor + patch updates are grouped per ecosystem — one routine PR, cheap to review.
#   • MAJOR updates arrive one package per PR. One breaking major inside a group blocked every
#     safe update beside it: PR #2 (28 frontend bumps) could not install at all because it
#     carried typescript 7, which typescript-eslint's peer range does not admit yet.
#   • cooldown: a release must be 7 days old before it is proposed (14 for a major). Most
#     malicious releases are found and yanked within days — the 2026-03-19 trivy-action tag
#     hijack was public within a week (GHSA-69fq-xp46-6x23) — so waiting a week costs little
#     and keeps a compromised release from arriving as a green PR.
#   • every `ignore` below carries its reason and the condition that lifts it. An
#     unexplained ignore is how a pin outlives the reason it was added.
#   • each ecosystem runs on its own weekday (uv Mon · pip Tue · npm Wed · actions Thu ·
#     docker Fri). On 2026-09-10 four fired at once: 13 PRs × ~11 CI jobs overran the runner
#     pool, and main's own run sat queued until a newer push replaced it.
version: 2
updates:
  # Root uv workspace (pyproject.toml + uv.lock): the examlops CLI, pipelines, serving.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # vllm (the `serving-vllm` extra of examlops, required by the workspace) declares
      # setuptools>=77.0.3,<81, so the workspace's `setuptools<80` bound is load-bearing:
      # Dependabot's own resolver reported the workspace unsatisfiable with setuptools>=84
      # (PR #4). Lift when the vllm release the lock resolves admits setuptools>=80.
      - dependency-name: "setuptools"
        versions: [">=80"]
      # mlflow and xgboost must be ONE version where a model is trained (this lock), where it
      # is served (serving/ray_serving/requirements.txt) and, for mlflow, in the tracking-server
      # and notebook images. Dependabot moves each manifest alone — PR #16 would have trained on
      # xgboost 3.4 and served on 3.2. Upgrade both by hand, everywhere at once;
      # tests/unit/test_training_serving_versions_agree.py fails on any skew.
      - dependency-name: "mlflow"
      # xgboost: same rule as mlflow directly above.
      - dependency-name: "xgboost"
      # ray: Ray Client needs the cluster's exact version, and the fastapi<0.137 cap is tied to
      # ray 2.55 — so ray moves in this lock, the serving and notebook images together (PR #6).
      - dependency-name: "ray"

  # Services that keep their own pinned requirements.txt, and the docs toolchain.
  - package-ecosystem: "pip"
    directories:
      - "/platform/services/agent"
      - "/platform/services/dashboard/backend"
      - "/serving/ray_serving"
      - "/platform/ci"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      service-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # serving/ray_serving pins the versions models are SERVED with; they move only together
      # with the training lock — see the uv entry above and
      # tests/unit/test_training_serving_versions_agree.py.
      - dependency-name: "mlflow"
      # xgboost: same rule as mlflow directly above.
      - dependency-name: "xgboost"
      # ray: must equal the workspace's ray — see the uv entry above.
      - dependency-name: "ray"

  # Dashboard frontend.
  - package-ecosystem: "npm"
    directory: "/platform/services/dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint 8.x declares peer typescript ">=4.8.4 <6.1.0", so typescript 7
      # cannot even install next to it (`npm ci` → ERESOLVE, PR #2). Lift when a
      # typescript-eslint release admits typescript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Container base images. A Dockerfile that pins `image:tag@sha256:<digest>` (OpenSSF
  # Scorecard, Pinned-Dependencies) builds reproducibly, and Dependabot re-pins the digest when the
  # tag is re-published with patched layers, so a pin never freezes a known CVE in place.
  - package-ecosystem: "docker"
    directories:
      - "/platform/infra/docker-compose"
      - "/platform/services/agent"
      - "/platform/services/control_plane"
      - "/serving/ray_serving"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    groups:
      images-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The images run the Python CI tests (3.12, ci.yml); a 3.13 image would run code no job
      # tested. Move the image and CI's python-version together, by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The dashboard's frontend builder stage matches CI's Node (setup-node 24); same rule.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # A Postgres major is a data-directory migration (pg_upgrade), never a routine bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # The tracking server moves with the mlflow client pins, all at once —
      # tests/unit/test_training_serving_versions_agree.py.
      - dependency-name: "*mlflow/mlflow"
      # A Grafana major changes the dashboard and provisioning formats; upgrade deliberately.
      - dependency-name: "grafana/grafana"
        update-types: ["version-update:semver-major"]
      # A Prometheus major (v2 → v3) changes config and rule semantics; upgrade deliberately.
      - dependency-name: "prom/prometheus"
        update-types: ["version-update:semver-major"]
      # A JupyterHub major needs `jupyterhub upgrade-db` on the hub's database first.
      - dependency-name: "*jupyterhub/jupyterhub"
        update-types: ["version-update:semver-major"]

  # CI actions. Workflows pin each action to a commit SHA with the version in a comment;
  # Dependabot updates the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
