site_name: ExaMLOps Documentation
site_description: End-to-end MLOps platform for HPC workload management in EU research projects
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.integrate
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Guides:
      - Quick Start: guides/quickstart.md
      - Architecture: guides/architecture.md
      - All Interfaces: guides/interfaces.md
      - Add a New Model: guides/add-a-new-model.md
      - Control Plane (Retraining API): guides/control-plane.md
      - DataPlane Bridge: guides/dataplane.md
      - DataPlane Setup (real bus): guides/dataplane-sim.md
      - DataPlane Architecture: guides/dataplane-architecture.md
      - Management Agent: guides/agent.md
      - CI/CD — GitLab Pipeline: guides/cicd.md
      - JupyterHub Notebooks: guides/jupyter.md
  - Components:
      - Prefect — Pipelines: components/prefect.md
      - Slurm Adapter — HPC: components/slurm-adapter.md
      - Ray Serve — Inference: components/ray-serve.md
      - ModelZoo — Models: components/modelzoo.md
      - MLflow — Tracking: components/mlflow.md
      - Grafana — Monitoring: components/grafana.md
  - Dashboard:
      - Overview: dashboard/index.md
      - Architecture: dashboard/architecture.md
      - Authentication: dashboard/auth.md
      - Secrets: dashboard/secrets.md
      - Configuration: dashboard/configuration.md
      - Operations: dashboard/operations.md
  - Reference:
      - exa CLI: reference/cli.md
      - make Commands: reference/commands.md
      - API Reference: reference/api.md
      - Environment Variables: reference/env-vars.md
