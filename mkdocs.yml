site_name: ExaMLOps Documentation
# Doubles as the <meta name="description"> and the social/JSON-LD description of every page that
# sets no `description:` of its own — it is what a search result or an AI answer quotes first.
site_description: >-
  ExaMLOps is an open-source MLOps platform for HPC and supercomputers: train models as Slurm
  or Flux jobs, version them in MLflow, promote them through metric and approval gates, and
  serve them with Ray Serve.
site_author: Mohsen Seyedkazemi Ardebili
# Set so the theme emits correct canonical URLs and a valid sitemap once the site is served.
site_url: https://mskazemi.com/ExaMLOps/
# The repo link in the header and the "edit this page" button on every page — the shortest path
# from reading a mistake to fixing it.
repo_url: https://github.com/MSKazemi/ExaMLOps
repo_name: MSKazemi/ExaMLOps
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mohsen Seyedkazemi Ardebili · Apache License 2.0
docs_dir: docs
# docs/overrides/ is the theme's custom_dir (SEO + JSON-LD head), not a page source.
exclude_docs: |
  overrides/

# A link to a heading that does not exist is as broken as a link to a file that does not exist,
# but mkdocs logs the first at INFO and the second at WARNING, so only the second fails --strict.
# Thirteen of these had accumulated: eleven guides pointed at `dashboard/architecture.md` with one
# hyphen too many (the heading's "&" is dropped by the slugifier, not turned into a separator),
# and two named headings that had been renamed. Promote them so --strict catches the next one.
validation:
  links:
    anchors: warn

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.integrate
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - navigation.footer

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MSKazemi/ExaMLOps
      name: ExaMLOps on GitHub
    - icon: fontawesome/solid/user
      link: https://mskazemi.com/about/
      name: Mohsen Seyedkazemi Ardebili — maintainer
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mskazemi/
      name: Maintainer on LinkedIn

# "Platform in motion": the transit-map animations (Explore tab + home page). The engine is
# dependency-free; each scene file registers one map. See docs/explore/ and docs/assets/explore/.
extra_css:
  - assets/explore/css/explore.css
  # KaTeX for the Algorithms pages (pymdownx.arithmatex below). Pinned, so a KaTeX release can
  # never change how a published formula renders; without it the TeX source shows instead.
  - https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.css

extra_javascript:
  - assets/explore/js/xm-flow.js
  - assets/explore/js/scenes/system.js
  - assets/explore/js/scenes/prediction.js
  - assets/explore/js/scenes/retrain.js
  - assets/explore/js/scenes/decisions.js
  - assets/explore/js/scenes/hpc.js
  - assets/explore/js/scenes/signals.js
  - assets/explore/js/scenes/llm.js
  - assets/explore/js/scenes/llmserve.js
  - assets/explore/js/scenes/rag.js
  - assets/explore/js/scenes/roadmap.js
  - assets/explore/js/xm-atlas.js
  - assets/explore/js/xm-roadmap.js
  - https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/contrib/auto-render.min.js
  - assets/javascripts/katex.js

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  # ```mermaid fences render as diagrams (Material loads Mermaid itself). Without this they showed
  # as raw source, so every architecture diagram in the docs read as a code block.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true
  # Math on the Algorithms pages. Inline math is \( … \) only — never `$` — so dollar amounts and
  # shell variables elsewhere in the docs are not mistaken for TeX. Display math is $$ … $$.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]

