# ExaMLOps — install bundle (single node, pull-only).
#
# This is the *deployment* layer of ADR 0128, shipped on its own: it pulls the released images and
# never builds, never mounts the source tree, and refuses to start with a missing or weak secret.
# Everything a site creates lives in ./state (the ADR 0128 data root, mounted at /state).
#
#   ./install.sh init        # writes .env with generated secrets, creates ./state
#   docker compose up -d     # core stack
#   docker compose --profile backup up -d backup
#
# Differences from the development stack (../docker-compose.yml), each deliberate:
#   * images come from ${EXAMLOPS_REGISTRY}; application images are pinned to ${EXAMLOPS_VERSION}
#     and every upstream image is pinned by digest, so an install is reproducible;
#   * no `env_file:` — each service gets only the variables it uses, so a secret reaches only the
#     services that need it;
#   * no `container_name:` — two installs can share a host under different project names;
#   * every port binds to ${EXAMLOPS_BIND} (loopback by default); widen it deliberately, or put a
#     TLS-terminating reverse proxy in front;
#   * one use-case pack for the whole stack: /state/usecase (EXAMLOPS_USECASE_DIR). With no pack
#     the platform starts empty rather than serving a pack baked into one image but not another.
#
# Optional profiles (COMPOSE_PROFILES in .env): `minio` (bundled object store, on by default) and
# `monitoring`. Not in this bundle yet: JupyterHub, the SeanerBUS bridge and vLLM; they run from
# the development stack. See docs/guides/install-compose-bundle.md.
#
# Guarded by tests/unit/test_install_bundle.py.

name: ${EXAMLOPS_PROJECT_NAME:-examlops}

x-state-env: &state-env
  PLATFORM_DB: /state/platform.db
  EXAMLOPS_DATA_DIR: /state
  EXAMLOPS_USECASE_DIR: /state/usecase
  EXAMLOPS_DB_BACKEND: ${EXAMLOPS_DB_BACKEND:-sqlite}
  EXAMLOPS_POSTGRES_DSN: ${EXAMLOPS_POSTGRES_DSN:-}

services:

  # One-shot: create the data root (idempotent; never overwrites an existing pack). Set
  # EXAMLOPS_SEED_PACK to a pack path inside the image (e.g. /app/usecases/seanergy) to seed
  # /state/usecase on first start.
  #
  # The services do not share a uid (the agent runs as 10001, others as root), so the data root is
  # handed to the operator's uid/gid, group-writable with setgid directories, and every non-root
  # service joins that group. SQLite gives a new WAL/journal the database file's owner and mode,
  # so a root service opening platform.db first does not lock the others out.
  instance-init:
    image: ${EXAMLOPS_REGISTRY:-ghcr.io/mskazemi}/examlops-control-plane:${EXAMLOPS_VERSION:?set EXAMLOPS_VERSION in .env}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        exa --json instance init --data-dir /state $${EXAMLOPS_SEED_PACK:+--pack "$$EXAMLOPS_SEED_PACK"}
        mkdir -p /state/agent /state/prometheus-targets
        chown -R "$${EXAMLOPS_STATE_UID}:$${EXAMLOPS_STATE_GID}" /state
        chmod -R g+rwX /state
        find /state -type d -exec chmod g+s {} +
    environment:
      <<: *state-env
      EXAMLOPS_SEED_PACK: ${EXAMLOPS_SEED_PACK:-}
      EXAMLOPS_STATE_UID: ${EXAMLOPS_STATE_UID:?set EXAMLOPS_STATE_UID in .env (./install.sh init records it)}
      EXAMLOPS_STATE_GID: ${EXAMLOPS_STATE_GID:?set EXAMLOPS_STATE_GID in .env (./install.sh init records it)}
    volumes:
      - ${EXAMLOPS_STATE_DIR:-./state}:/state:rw
    restart: "no"

  postgres:
    image: ${EXAMLOPS_REGISTRY:-ghcr.io/mskazemi}/examlops-postgres:${EXAMLOPS_VERSION:?set EXAMLOPS_VERSION in .env}
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (./install.sh init generates it)}
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # Over TCP: on first start the image runs a socket-only init server that a socket probe
      # reports as ready, and dependents connecting over the network are then refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mlops -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Object store ─────────────────────────────────────────────────────────────
  # Any S3-compatible service works: point EXAMLOPS_S3_ENDPOINT at it and remove `minio` from
  # COMPOSE_PROFILES in .env. The bundled MinIO (the `minio` profile, on by default) is for
  # evaluation and small sites: MinIO stopped publishing community images after this release
  # (2025-09-07), so it receives no security fixes. MinIO also removed minio/minio and minio/mc
  # from Docker Hub (2026-09-11); the same images, same digests, are on quay.io.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [minio]
    mem_limit: ${MINIO_MEM_LIMIT:-1g}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${EXAMLOPS_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${EXAMLOPS_S3_SECRET_KEY}
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_MINIO:-19000}:9000"
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_MINIO_CONSOLE:-19001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot, MinIO only: the read-only credential Ray Serve uses (it only ever downloads
  # models). With an external store, issue a read-only key there and put it in
  # EXAMLOPS_S3_SERVING_ACCESS_KEY / _SECRET_KEY.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: [minio]
    depends_on:
      s3-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set store "$${EXAMLOPS_S3_ENDPOINT}" "$${EXAMLOPS_S3_ACCESS_KEY}" "$${EXAMLOPS_S3_SECRET_KEY}"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' \
          "$${EXAMLOPS_S3_ARTIFACT_BUCKET}" "$${EXAMLOPS_S3_ARTIFACT_BUCKET}" > /tmp/serving-readonly.json
        mc admin policy create store serving-readonly /tmp/serving-readonly.json
        mc admin user add store "$${EXAMLOPS_S3_SERVING_ACCESS_KEY}" "$${EXAMLOPS_S3_SERVING_SECRET_KEY}"
        mc admin policy attach store serving-readonly --user "$${EXAMLOPS_S3_SERVING_ACCESS_KEY}" 2>/dev/null || true
        echo '[minio-init] read-only serving credential ready.'
    environment:
      EXAMLOPS_S3_ENDPOINT: ${EXAMLOPS_S3_ENDPOINT}
      EXAMLOPS_S3_ACCESS_KEY: ${EXAMLOPS_S3_ACCESS_KEY}
      EXAMLOPS_S3_SECRET_KEY: ${EXAMLOPS_S3_SECRET_KEY}
      EXAMLOPS_S3_ARTIFACT_BUCKET: ${EXAMLOPS_S3_ARTIFACT_BUCKET:-mlflow-artifacts}
      EXAMLOPS_S3_SERVING_ACCESS_KEY: ${EXAMLOPS_S3_SERVING_ACCESS_KEY}
      EXAMLOPS_S3_SERVING_SECRET_KEY: ${EXAMLOPS_S3_SERVING_SECRET_KEY}
    restart: "no"

  # One-shot, any S3 service: create the platform's buckets if they are missing.
  s3-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
        required: false
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set store "$${EXAMLOPS_S3_ENDPOINT}" "$${EXAMLOPS_S3_ACCESS_KEY}" "$${EXAMLOPS_S3_SECRET_KEY}"
        for bucket in "$${EXAMLOPS_S3_ARTIFACT_BUCKET}" "$${EXAMLOPS_PROJECTS_BUCKET}" "$${DASHBOARD_MINIO_BUCKET}"; do
          mc mb --ignore-existing --region "$${EXAMLOPS_S3_REGION}" "store/$${bucket}"
        done
        echo '[s3-init] buckets ready.'
    environment:
      EXAMLOPS_S3_ENDPOINT: ${EXAMLOPS_S3_ENDPOINT:?set EXAMLOPS_S3_ENDPOINT in .env}
      EXAMLOPS_S3_REGION: ${EXAMLOPS_S3_REGION:-us-east-1}
      EXAMLOPS_S3_ACCESS_KEY: ${EXAMLOPS_S3_ACCESS_KEY:?set EXAMLOPS_S3_ACCESS_KEY in .env}
      EXAMLOPS_S3_SECRET_KEY: ${EXAMLOPS_S3_SECRET_KEY:?set EXAMLOPS_S3_SECRET_KEY in .env}
      EXAMLOPS_S3_ARTIFACT_BUCKET: ${EXAMLOPS_S3_ARTIFACT_BUCKET:-mlflow-artifacts}
      EXAMLOPS_PROJECTS_BUCKET: ${EXAMLOPS_PROJECTS_BUCKET:-examlops-projects}
      DASHBOARD_MINIO_BUCKET: ${DASHBOARD_MINIO_BUCKET:-dashboard-model-docs}
    restart: "no"

  mlflow:
    image: ${EXAMLOPS_REGISTRY:-ghcr.io/mskazemi}/examlops-mlflow:${EXAMLOPS_VERSION:?set EXAMLOPS_VERSION in .env}
    # MLflow 3.16 measured 2.1 GiB resident with 4 workers and 1.8 GiB with 2; the 2g limit it
    # shipped with OOM-killed it on every start. Scale MLFLOW_WORKERS and the limit together.
    mem_limit: ${MLFLOW_MEM_LIMIT:-4g}
    command: >
      mlflow server
      --backend-store-uri postgresql://mlops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/mlflow
      --default-artifact-root s3://${EXAMLOPS_S3_ARTIFACT_BUCKET:-mlflow-artifacts}/
      --artifacts-destination s3://${EXAMLOPS_S3_ARTIFACT_BUCKET:-mlflow-artifacts}/
      --host 0.0.0.0
      --port 5000
      --workers ${MLFLOW_WORKERS:-2}
      --allowed-hosts "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,${PUBLIC_HOST:-localhost},${PUBLIC_HOST:-localhost}:*"
      --cors-allowed-origins "http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_DASHBOARD:-18099}"
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${EXAMLOPS_S3_ENDPOINT:?set EXAMLOPS_S3_ENDPOINT in .env}
      AWS_DEFAULT_REGION: ${EXAMLOPS_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${EXAMLOPS_S3_ACCESS_KEY:?set EXAMLOPS_S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${EXAMLOPS_S3_SECRET_KEY:?set EXAMLOPS_S3_SECRET_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_MLFLOW:-15000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Prefect server. The development stack's orchestrator image adds nothing to upstream, so the
  # bundle uses upstream directly, pinned by digest.
  orchestrator:
    image: prefecthq/prefect:3.6.27-python3.11@sha256:ed9c73b555c114a8abca2a833ae4b36f7d47d918a25d6b7e08803e214755b0b4
    mem_limit: ${ORCHESTRATOR_MEM_LIMIT:-2g}
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_UI_API_URL: /api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://mlops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/prefect
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_PREFECT:-14200}:4200"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  ray-serving:
    image: ${EXAMLOPS_REGISTRY:-ghcr.io/mskazemi}/examlops-ray-serving:${EXAMLOPS_VERSION:?set EXAMLOPS_VERSION in .env}
    # Whatever uid the image runs as, the data root's group makes /state writable to it.
    group_add:
      - "${EXAMLOPS_STATE_GID:?set EXAMLOPS_STATE_GID in .env (./install.sh init records it)}"
    environment:
      <<: *state-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${EXAMLOPS_S3_ENDPOINT:?set EXAMLOPS_S3_ENDPOINT in .env}
      AWS_DEFAULT_REGION: ${EXAMLOPS_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${EXAMLOPS_S3_SERVING_ACCESS_KEY:?set EXAMLOPS_S3_SERVING_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${EXAMLOPS_S3_SERVING_SECRET_KEY:?set EXAMLOPS_S3_SERVING_SECRET_KEY in .env}
      MODEL_STAGE: Production
      RAY_NUM_REPLICAS: "1"
      RAY_SERVE_PORT: "8001"
      RAY_METRICS_EXPORT_PORT: "8080"
      # Ray's dashboard embeds metrics from these when the monitoring profile runs.
      RAY_PROMETHEUS_HOST: http://prometheus:9090
      RAY_GRAFANA_HOST: http://grafana:3000
      RAY_GRAFANA_IFRAME_HOST: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_GRAFANA:-13000}
      RAY_SERVE_ADMIN_TOKEN: ${RAY_SERVE_ADMIN_TOKEN:-}
      EXAMLOPS_SERVING_VERIFY: ${EXAMLOPS_SERVING_VERIFY:-warn}
      EXAMLOPS_SIGNING_PUBLIC_KEYS: ${EXAMLOPS_SIGNING_PUBLIC_KEYS:-}
      EXAMLOPS_SIGNING_KEY: ${EXAMLOPS_SIGNING_KEY:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ray-serving
    volumes:
      - ${EXAMLOPS_STATE_DIR:-./state}:/state:rw
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_RAY_SERVE:-18001}:8001"
      # Always loopback: the Ray dashboard's Jobs API runs arbitrary code and has no auth.
      - "127.0.0.1:${EXAMLOPS_PORT_RAY_DASHBOARD:-18265}:8265"
    shm_size: '2gb'
    mem_limit: ${RAY_MEM_LIMIT:-6g}
    cpus: ${RAY_CPUS:-2.0}
    depends_on:
      instance-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      # The read-only serving credential must exist before the first model download.
      minio-init:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped
    # /ready, not /health: /health is 503 while the hot set is empty, which would restart-loop.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  control-plane:
    image: ${EXAMLOPS_REGISTRY:-ghcr.io/mskazemi}/examlops-control-plane:${EXAMLOPS_VERSION:?set EXAMLOPS_VERSION in .env}
    # Whatever uid the image runs as, the data root's group makes /state writable to it.
    group_add:
      - "${EXAMLOPS_STATE_GID:?set EXAMLOPS_STATE_GID in .env (./install.sh init records it)}"
    mem_limit: ${CONTROL_PLANE_MEM_LIMIT:-512m}
    environment:
      <<: *state-env
      CONTROL_PLANE_PORT: "8002"
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?set CONTROL_PLANE_TOKEN in .env}
      CONTROL_PLANE_ALLOWED_HOSTS: ${CONTROL_PLANE_ALLOWED_HOSTS:-localhost,127.0.0.1,control-plane}
      PREFECT_API_URL: http://orchestrator:4200/api
      PREFECT_DEPLOYMENT_NAME: ${PREFECT_DEPLOYMENT_NAME:-training_flow/examlops-dispatch}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RAY_SERVE_URL: http://ray-serving:8001
      DASHBOARD_URL: http://dashboard:8099
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: control-plane
    volumes:
      - control_plane_data:/data
      - ${EXAMLOPS_STATE_DIR:-./state}:/state:rw
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_CONTROL_PLANE:-18002}:8002"
    depends_on:
      instance-init:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Skipper agent (the dashboard Copilot). Loopback only; the dashboard reaches it in-network.
  agent:
    image: ${EXAMLOPS_REGISTRY:-ghcr.io/mskazemi}/examlops-agent:${EXAMLOPS_VERSION:?set EXAMLOPS_VERSION in .env}
    # Whatever uid the image runs as, the data root's group makes /state writable to it.
    group_add:
      - "${EXAMLOPS_STATE_GID:?set EXAMLOPS_STATE_GID in .env (./install.sh init records it)}"
    mem_limit: ${AGENT_MEM_LIMIT:-2g}
    environment:
      <<: *state-env
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: "18004"
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-llama3.1:8b}
      AGENT_OLLAMA_URL: ${AGENT_CONTAINER_OLLAMA_URL:-http://host.docker.internal:11434}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RAY_SERVE_URL: http://ray-serving:8001
      PROMETHEUS_URL: http://prometheus:9090
      CONTROL_PLANE_URL: http://control-plane:8002
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?set CONTROL_PLANE_TOKEN in .env}
      RAY_SERVE_ADMIN_TOKEN: ${RAY_SERVE_ADMIN_TOKEN:-}
      DASHBOARD_URL: http://dashboard:8099
      # The agent's memory is instance data: it lives in the data root, not in a volume the
      # image's uid (10001) could not write to.
      AGENT_DB: /state/agent/agent_memory.db
      AGENT_MEMORY_DB: /state/agent/skipper_memory.db
      AGENT_MEMORY_REVIEW_DB: /state/agent/skipper_review.db
      AGENT_DOCS_ROOT: /app/docs
      AGENT_KNOWLEDGE_ROOTS: /app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${EXAMLOPS_PORT_AGENT:-18004}:18004"
    volumes:
      - ${EXAMLOPS_STATE_DIR:-./state}:/state:rw
    depends_on:
      control-plane:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:18004/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Scoped Docker API for the dashboard's service controls: containers + lifecycle POSTs only.
  # A raw docker.sock mount would be root-equivalent; this proxy holds it read-only.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0@sha256:083bd0ed8783e366d745f332f0e4489816dd35d984bef8f16e6d89484a22c082
    mem_limit: ${SOCKET_PROXY_MEM_LIMIT:-128m}
    environment:
      CONTAINERS: "1"
      POST: "1"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      INFO: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SERVICES: "0"
      TASKS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      NODES: "0"
      PLUGINS: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  dashboard:
    image: ${EXAMLOPS_REGISTRY:-ghcr.io/mskazemi}/examlops-dashboard:${EXAMLOPS_VERSION:?set EXAMLOPS_VERSION in .env}
    # Whatever uid the image runs as, the data root's group makes /state writable to it.
    group_add:
      - "${EXAMLOPS_STATE_GID:?set EXAMLOPS_STATE_GID in .env (./install.sh init records it)}"
    mem_limit: ${DASHBOARD_MEM_LIMIT:-1g}
    environment:
      <<: *state-env
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      MLFLOW_URL: http://mlflow:5000
      PREFECT_URL: http://orchestrator:4200
      RAY_SERVE_URL: http://ray-serving:8001
      RAY_DASHBOARD_URL: http://ray-serving:8265
      # Monitoring profile; the dashboard degrades to "not configured" when it does not run.
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      LOKI_URL: http://loki:3100
      PUBLIC_GRAFANA_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_GRAFANA:-13000}
      PUBLIC_LOKI_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_LOKI:-13100}
      GRAFANA_LOKI_EXPLORE_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_GRAFANA:-13000}/explore
      MINIO_URL: ${EXAMLOPS_S3_ENDPOINT:?set EXAMLOPS_S3_ENDPOINT in .env}
      MINIO_ACCESS_KEY: ${EXAMLOPS_S3_ACCESS_KEY:?set EXAMLOPS_S3_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${EXAMLOPS_S3_SECRET_KEY:?set EXAMLOPS_S3_SECRET_KEY in .env}
      DASHBOARD_MINIO_BUCKET: ${DASHBOARD_MINIO_BUCKET:-dashboard-model-docs}
      EXAMLOPS_PROJECTS_BUCKET: ${EXAMLOPS_PROJECTS_BUCKET:-examlops-projects}
      DATABASE_URL: postgresql+asyncpg://mlops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres/mlflow
      DASHBOARD_VIEWER_PASSWORD: ${DASHBOARD_VIEWER_PASSWORD:?set DASHBOARD_VIEWER_PASSWORD in .env}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:?set DASHBOARD_ADMIN_PASSWORD in .env}
      DASHBOARD_JWT_SECRET: ${DASHBOARD_JWT_SECRET:?set DASHBOARD_JWT_SECRET in .env}
      DASHBOARD_JWT_TTL_HOURS: ${DASHBOARD_JWT_TTL_HOURS:-12}
      DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY:?set DASHBOARD_SECRET_KEY in .env}
      DASHBOARD_PORT: "8099"
      CONTROL_PLANE_URL: http://control-plane:8002
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?set CONTROL_PLANE_TOKEN in .env}
      AGENT_URL: http://agent:18004
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      PUBLIC_DASHBOARD_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_DASHBOARD:-18099}
      PUBLIC_MLFLOW_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_MLFLOW:-15000}
      PUBLIC_PREFECT_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_PREFECT:-14200}
      PUBLIC_RAY_SERVE_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_RAY_SERVE:-18001}
      PUBLIC_CONTROL_PLANE_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_CONTROL_PLANE:-18002}
      PUBLIC_MINIO_CONSOLE_URL: http://${PUBLIC_HOST:-localhost}:${EXAMLOPS_PORT_MINIO_CONSOLE:-19001}
      SLURM_MODE: ${EXAMLOPS_SLURM_MODE:-mock}
      EXAMLOPS_PROVIDERS_DIR: /state/.providers
      EXAMLOPS_CONFIG: /var/lib/examlops-dashboard/config.toml
      EXAMLOPS_DASHBOARD_CLI_WORKSPACE: /var/lib/examlops-dashboard/cli-workspace
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: dashboard
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_DASHBOARD:-18099}:8099"
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      agent:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    volumes:
      - ${EXAMLOPS_STATE_DIR:-./state}:/state:rw
      - dashboard_cli_data:/var/lib/examlops-dashboard
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Monitoring (opt-in): add `monitoring` to COMPOSE_PROFILES ─────────────────
  # Prometheus + Alertmanager + Grafana + Loki/Promtail + Tempo, with the platform's alert rules
  # and dashboards. Config comes from ./monitoring (shared with the development stack by
  # symlink; the release tarball carries real copies). Profile-gated services take no `:?`:
  # compose interpolates before filtering by profile, so a required variable would abort every
  # command on installs that do not monitor.
  prometheus:
    image: prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
    profiles: [monitoring]
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-1g}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # Fleet targets written by `exa hpc prometheus-sd` into the data root; re-read every 30 s.
      - ${EXAMLOPS_STATE_DIR:-./state}/prometheus-targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_PROMETHEUS:-19090}:9090"
    depends_on:
      alertmanager:
        condition: service_started
      instance-init:
        condition: service_completed_successfully
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles: [monitoring]
    # The image's uid (nobody), plus the operator's group so it can read ./secrets/alertmanager
    # (mode 0750) without the secrets being world-readable.
    user: "65534:${EXAMLOPS_STATE_GID}"
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-256m}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Slack / PagerDuty / heartbeat secrets, one file each; a missing file disables that
      # receiver. Created by `install.sh init`, never part of the release tarball.
      - ./secrets/alertmanager:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_ALERTMANAGER:-19093}:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
    profiles: [monitoring]
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_GRAFANA:-13000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.10@sha256:35b02acc67654ddc38273e519b4f26f3967a907b9db5489af300c21f37ee1ae7
    profiles: [monitoring]
    mem_limit: ${LOKI_MEM_LIMIT:-1g}
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_LOKI:-13100}:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Read-only Docker API for promtail's discovery, which also needs GET /networks. That is not
  # widened on the dashboard's proxy: its POST switch covers every allowed section, so allowing
  # networks there would let the dashboard create and attach networks. This one never POSTs.
  logs-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0@sha256:083bd0ed8783e366d745f332f0e4489816dd35d984bef8f16e6d89484a22c082
    profiles: [monitoring]
    mem_limit: ${SOCKET_PROXY_MEM_LIMIT:-128m}
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
      IMAGES: "0"
      VOLUMES: "0"
      EXEC: "0"
      INFO: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SERVICES: "0"
      TASKS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      NODES: "0"
      PLUGINS: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Ships every container's logs to Loki, discovering them through the read-only logs-proxy.
  promtail:
    image: grafana/promtail:2.9.10@sha256:63a2e57a5b1401109f77d36a49a637889d431280ed38f5f885eedcd3949e52cf
    profiles: [monitoring]
    mem_limit: ${PROMTAIL_MEM_LIMIT:-256m}
    command: ["-config.file=/etc/promtail/promtail.yml", "-config.expand-env=true"]
    environment:
      DOCKER_HOST: tcp://logs-proxy:2375
      EXAMLOPS_PROJECT_NAME: ${EXAMLOPS_PROJECT_NAME:-examlops}
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - promtail_data:/tmp
    depends_on:
      loki:
        condition: service_healthy
      logs-proxy:
        condition: service_started
    restart: unless-stopped

  # Traces. Services export to it when OTEL_SDK_DISABLED=false and
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317 are set in .env.
  tempo:
    image: grafana/tempo:2.5.0@sha256:f0200a9bff6d14eb3a4332194f7b77c37ee1a3535e7e41db024d95aab6f1b4e8
    profiles: [monitoring]
    mem_limit: ${TEMPO_MEM_LIMIT:-1g}
    # Root, so the named volume under /var/tempo is writable (the image does not create it).
    user: "0"
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./monitoring/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${EXAMLOPS_BIND:-127.0.0.1}:${EXAMLOPS_PORT_TEMPO:-13200}:3200"
    restart: unless-stopped

  # Scheduled whole-platform backup (opt-in): docker compose --profile backup up -d backup
  # Profile-gated, so no `:?` here: compose interpolates before filtering by profile, and a
  # required variable would abort every command. The core services already require all of them.
  backup:
    image: ${EXAMLOPS_REGISTRY:-ghcr.io/mskazemi}/examlops-backup:${EXAMLOPS_VERSION}
    # Whatever uid the image runs as, the data root's group makes /state writable to it.
    group_add:
      - "${EXAMLOPS_STATE_GID}"
    profiles: [backup]
    command: ["backup", "schedule", "--all"]
    environment:
      <<: *state-env
      EXAMLOPS_ACTOR: backup-sidecar
      EXAMLOPS_BACKUP_DIR: /backups
      EXAMLOPS_BACKUP_INTERVAL: ${EXAMLOPS_BACKUP_INTERVAL:-3600}
      EXAMLOPS_BACKUP_RETAIN: ${EXAMLOPS_BACKUP_RETAIN:-keep=14}
      EXAMLOPS_BACKUP_S3_URI: ${EXAMLOPS_BACKUP_S3_URI:-}
      CONTROL_PLANE_DB: /state/platform.db
      PGHOST: postgres
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EXAMLOPS_BACKUP_PG_DBS: mlflow,prefect
      MLFLOW_S3_ENDPOINT_URL: ${EXAMLOPS_S3_ENDPOINT}
      AWS_DEFAULT_REGION: ${EXAMLOPS_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${EXAMLOPS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${EXAMLOPS_S3_SECRET_KEY}
      EXAMLOPS_PROJECTS_BUCKET: ${EXAMLOPS_PROJECTS_BUCKET:-examlops-projects}
      EXAMLOPS_BACKUP_BUCKETS: ${EXAMLOPS_S3_ARTIFACT_BUCKET:-mlflow-artifacts},${EXAMLOPS_PROJECTS_BUCKET:-examlops-projects}
      # The agent's memory stores (in the data root) and the dashboard's own `exa` config + CLI
      # workspace (in its volume), so a bundle captures them too.
      AGENT_DB: /state/agent/agent_memory.db
      AGENT_MEMORY_DB: /state/agent/skipper_memory.db
      AGENT_MEMORY_REVIEW_DB: /state/agent/skipper_review.db
      EXAMLOPS_CONFIG: /dashboard-cli/config.toml
    volumes:
      - ${EXAMLOPS_STATE_DIR:-./state}:/state:rw
      - backups_data:/backups
      - dashboard_cli_data:/dashboard-cli:ro
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  promtail_data:
  tempo_data:
  minio_data:
  control_plane_data:
  dashboard_cli_data:
  backups_data:
