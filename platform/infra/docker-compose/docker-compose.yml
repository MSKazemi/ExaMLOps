# Docker Compose project name — scopes ALL resources (containers, networks,
# volumes) under the "examlops" prefix so they never collide with other
# projects on the same machine.
name: examlops

services:

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-postgres:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-postgres
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO — S3-compatible object store for MLflow artifacts ───────────────────
  # Dev credentials: minioadmin / minioadmin  (override via .env or env vars)
  # Production: point MINIO_ROOT_USER / MINIO_ROOT_PASSWORD at your real MinIO.
  minio:
    # MinIO removed minio/minio and minio/mc from Docker Hub on 2026-09-11; the same images are on
    # quay.io. Pinned to the digests the Compose bundle uses.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: examlops-minio
    mem_limit: ${MINIO_MEM_LIMIT:-1g}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "19000:9000"   # S3 API  — used by MLflow clients and pipeline code
      - "19001:9001"   # MinIO Console UI
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init container — creates the mlflow-artifacts bucket if absent.
  # Exits 0 immediately after; never restarted.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: examlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/mlflow-artifacts &&
        mc mb --ignore-existing local/$${EXAMLOPS_PROJECTS_BUCKET:-examlops-projects} &&
        mc mb --ignore-existing local/$${EXAMLOPS_DATA_BUCKET:-examlops-data} &&
        echo '[minio-init] buckets mlflow-artifacts + project storage + dataplane data ready.' &&
        D="$${EXAMLOPS_DATA_BUCKET:-examlops-data}" &&
        RW='"s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket","s3:GetBucketLocation","s3:ListMultipartUploadParts","s3:AbortMultipartUpload"' &&
        grant() {
          if [ -n "$$2" ] && [ -n "$$3" ]; then
            printf '%s' "{\"Version\":\"2012-10-17\",\"Statement\":[$$4]}" > "/tmp/$$1.json" &&
            mc admin policy create local "$$1" "/tmp/$$1.json" &&
            mc admin user add local "$$2" "$$3" &&
            { mc admin policy attach local "$$1" --user "$$2" 2>/dev/null || true; } &&
            echo "[minio-init] least-privilege credential $$1 ready.";
          else
            echo "[minio-init] no key for $$1: that service falls back to the root credential.";
          fi;
        } &&
        grant dataplane-rw "$${MINIO_DATAPLANE_ACCESS_KEY}" "$${MINIO_DATAPLANE_SECRET_KEY}" "{\"Effect\":\"Allow\",\"Action\":[$$RW],\"Resource\":[\"arn:aws:s3:::$$D\",\"arn:aws:s3:::$$D/*\"]}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      EXAMLOPS_PROJECTS_BUCKET: ${EXAMLOPS_PROJECTS_BUCKET:-examlops-projects}
      EXAMLOPS_DATA_BUCKET: ${EXAMLOPS_DATA_BUCKET:-examlops-data}
      MINIO_DATAPLANE_ACCESS_KEY: ${MINIO_DATAPLANE_ACCESS_KEY:-}
      MINIO_DATAPLANE_SECRET_KEY: ${MINIO_DATAPLANE_SECRET_KEY:-}
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
      network: host
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-mlflow:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-mlflow
    mem_limit: ${MLFLOW_MEM_LIMIT:-2g}
    command: >
      mlflow server
      --backend-store-uri postgresql://mlops:${POSTGRES_PASSWORD:-mlops}@postgres/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --artifacts-destination s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"
      --cors-allowed-origins "*"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    env_file:
      - path: .env
        required: true
      - path: .env.dashboard
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "15000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-orchestrator:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-orchestrator
    mem_limit: ${ORCHESTRATOR_MEM_LIMIT:-2g}
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_UI_API_URL: /api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      # Persist Prefect metadata in Postgres (shares the postgres_data volume)
      # instead of the default ephemeral SQLite inside the container.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://mlops:${POSTGRES_PASSWORD:-mlops}@postgres/prefect
    ports:
      - "14200:4200"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ray Serve — multi-model serving, loads ALL Production models from MLflow
  ray-serving:
    build:
      context: ../../..
      dockerfile: serving/ray_serving/Dockerfile
      network: host
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-ray-serving:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-ray-serving
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MODEL_STAGE: Production
      RAY_NUM_REPLICAS: "1"
      RAY_SERVE_PORT: "8001"
      RAY_METRICS_EXPORT_PORT: "8080"
      RAY_PROMETHEUS_HOST: http://prometheus:9090
      RAY_GRAFANA_HOST: http://grafana:3000
      RAY_GRAFANA_IFRAME_HOST: http://${PUBLIC_HOST:-localhost}:13000
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      OTEL_SERVICE_NAME: ray-serving
    env_file:
      - path: .env
        required: true
      - path: .env.dashboard
        required: false
    ports:
      - "18001:8001"   # Ray Serve HTTP
      - "18265:8265"   # Ray dashboard
      - "18080:8080"   # Prometheus metrics (Ray)
    shm_size: '2gb'
    mem_limit: ${RAY_MEM_LIMIT:-6g}
    cpus: ${RAY_CPUS:-2.0}
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    # Liveness probe on /ready (always 200 while the process is up). Deliberately
    # NOT /health — /health returns 503 when the hot set is empty (MLflow briefly
    # down), which would otherwise trigger a restart loop. Consumers that need
    # readiness use /health directly.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Control plane — retraining trigger API (Phase 4) ────────────────────────
  # Sits in front of Prefect so clients/dataplane can POST /retrain without
  # holding Prefect credentials. Bearer token auth via CONTROL_PLANE_TOKEN.
  control-plane:
    build:
      context: ../../..
      dockerfile: platform/services/control_plane/Dockerfile
      network: host
      # The upstream model library, baked in when the checkout has it (ADR 0094: it is not part
      # of the platform, and the Dockerfile builds without it). Point elsewhere for a site build.
      additional_contexts:
        modelzoo: ${EXAMLOPS_MODELZOO_BUILD_CONTEXT:-../../../modelzoo}
      # Dev: the image's non-root user is the host user, so it can write the host-owned
      # /state/platform.db bind mount (same reason as the agent below). Helm/prod keep 10001.
      args:
        APP_UID: ${EXAMLOPS_UID:-1000}
        APP_GID: ${EXAMLOPS_GID:-1000}
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-control-plane:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-control-plane
    mem_limit: ${CONTROL_PLANE_MEM_LIMIT:-512m}
    environment:
      CONTROL_PLANE_PORT: "8002"
      # No insecure default: unset/placeholder tokens fail closed (write endpoints 503).
      # Set CONTROL_PLANE_TOKEN in .env to enable POST /retrain (item 0.8 / QW6).
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:-}
      # Identity federation (ADR 0120): the trust file listing the data centers' IdPs, as a path
      # INSIDE the container — conventionally /state/config/identity-providers.yaml. Unset ⇒ off.
      EXAMLOPS_IAM_CONFIG: ${EXAMLOPS_IAM_CONFIG:-}
      # Allowed-hosts scoping (item 0.8): "*"=dev; set a comma-separated allow-list in prod.
      CONTROL_PLANE_ALLOWED_HOSTS: ${CONTROL_PLANE_ALLOWED_HOSTS:-*}
      PREFECT_API_URL: http://orchestrator:4200/api
      PREFECT_DEPLOYMENT_NAME: ${PREFECT_DEPLOYMENT_NAME:-examlops_scheduled_training/nightly}
      MODELZOO_WEBHOOK_SECRET: ${MODELZOO_WEBHOOK_SECRET:-}
      MODELZOO_AUTO_RETRAIN: ${MODELZOO_AUTO_RETRAIN:-false}
      MODELZOO_POLL_SECONDS: ${MODELZOO_POLL_SECONDS:-300}
      MODELZOO_WATCH_BRANCH: ${MODELZOO_WATCH_BRANCH:-main}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_PROJECT_ID: ${GITLAB_PROJECT_ID:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RAY_SERVE_URL: http://ray-serving:8001
      DASHBOARD_URL: http://dashboard:8099
      # ADR 0094: point the registry resolver at the baked use-case pack (this container has no
      # /repo mount). Explicit so resolve_models_dir() never falls back to the removed legacy dir.
      EXAMLOPS_USECASE_DIR: ${EXAMLOPS_USECASE_DIR:-/app/usecases/seanergy}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      OTEL_SERVICE_NAME: control-plane
      # ONE shared platform DB across the stack (X1) + datastore engine pass-through (X2).
      PLATFORM_DB: /state/platform.db
      # ADR 0128: /state is this instance's data root (site.toml, usecase/, config/).
      EXAMLOPS_DATA_DIR: /state
      EXAMLOPS_DB_BACKEND: ${EXAMLOPS_DB_BACKEND:-sqlite}
      EXAMLOPS_POSTGRES_DSN: ${EXAMLOPS_POSTGRES_DSN:-}
    env_file:
      - path: .env
        required: true
      - path: .env.dashboard
        required: false
    depends_on:
      orchestrator:
        condition: service_healthy
    volumes:
      - control_plane_data:/data
      - ${EXAMLOPS_STATE_DIR:-../../..}:/state:rw
    ports:
      - "18002:8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Dataplane — pulls external data into versioned snapshots (ADR 0130) ────────
  dataplane:
    build:
      context: ../../..
      dockerfile: platform/services/dataplane/Dockerfile
      network: host
      # Dev: the image's non-root user is the host user, so it can write the host-owned
      # /state/platform.db bind mount (same reason as control-plane/agent above). Helm/prod
      # keep 10001.
      args:
        APP_UID: ${EXAMLOPS_UID:-1000}
        APP_GID: ${EXAMLOPS_GID:-1000}
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-dataplane:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-dataplane
    mem_limit: ${DATAPLANE_MEM_LIMIT:-2g}
    environment:
      DATAPLANE_PORT: "8010"
      DATAPLANE_TOKEN: ${DATAPLANE_TOKEN:-}
      # OpenLineage receiver for this service's lineage events (ADR 0004); unset ⇒ platform_db
      # only. http://marquez:5000 with `--profile lineage`.
      EXAMLOPS_OPENLINEAGE_URL: ${EXAMLOPS_OPENLINEAGE_URL:-}
      EXAMLOPS_DATA_BUCKET: ${EXAMLOPS_DATA_BUCKET:-examlops-data}
      EXAMLOPS_DATA_S3_ENDPOINT: ${EXAMLOPS_DATA_S3_ENDPOINT:-http://minio:9000}
      # Its own least-privilege credential (plan P3.4 pattern), the same fallback shape as the
      # dashboard's: read-write on EXAMLOPS_DATA_BUCKET only, root only until one is issued.
      EXAMLOPS_DATA_S3_ACCESS_KEY: ${MINIO_DATAPLANE_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      EXAMLOPS_DATA_S3_SECRET_KEY: ${MINIO_DATAPLANE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      EXAMLOPS_DATAPLANE_ALLOWED_HOSTS: ${EXAMLOPS_DATAPLANE_ALLOWED_HOSTS:-}
      # No cloud instance-metadata probe (169.254.169.254) from the S3 client: credentials come
      # only from the env above, and the probe is an SSRF-shaped request this service never needs.
      AWS_EC2_METADATA_DISABLED: "true"
      EXAMLOPS_SECRETS_KEYS: ${EXAMLOPS_SECRETS_KEYS:-}
      EXAMLOPS_SECRETS_ACTIVE_KEY: ${EXAMLOPS_SECRETS_ACTIVE_KEY:-}
      # Named Connection secrets created from the dashboard were encrypted with this (legacy
      # decrypt path, ADR 0011); without it the dataplane cannot read them.
      DASHBOARD_SECRET_KEY: ${DASHBOARD_SECRET_KEY:-}
      EXAMLOPS_COORDINATOR: ${EXAMLOPS_COORDINATOR:-db}
      PLATFORM_DB: /state/platform.db
      # ADR 0128: /state is this instance's data root (site.toml, usecase/, config/).
      EXAMLOPS_DATA_DIR: /state
      EXAMLOPS_DB_BACKEND: ${EXAMLOPS_DB_BACKEND:-sqlite}
      # Also publish every audit event as audit.recorded (docs/guides/audit-trail.md).
      EXAMLOPS_AUDIT_STREAM: ${EXAMLOPS_AUDIT_STREAM:-}
      EXAMLOPS_POSTGRES_DSN: ${EXAMLOPS_POSTGRES_DSN:-}
      # Identity federation (ADR 0120): the trust file path inside the container, as the control
      # plane has. Unset ⇒ off.
      EXAMLOPS_IAM_CONFIG: ${EXAMLOPS_IAM_CONFIG:-}
      TMPDIR: /stage
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      OTEL_SERVICE_NAME: dataplane
    volumes:
      - ${EXAMLOPS_STATE_DIR:-../../..}:/state:rw
      - dataplane_stage:/stage
    ports:
      # Loopback by default: with no DATAPLANE_TOKEN and no identity federation, reads are open
      # (auth.py), which is only safe when nothing but this host can reach the port.
      - "${DATAPLANE_BIND:-127.0.0.1}:18010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Skipper agent — serves the OpenAI-compatible endpoint used by the dashboard Copilot.
  # `localhost` inside the dashboard container points back to that container, so the BFF
  # must use this service name instead.
  agent:
    build:
      context: ../../..
      dockerfile: platform/services/agent/Dockerfile
      network: host
      # Dev: build the image's user as the host user, so it can write both its own /data volume and
      # the host-owned /state/platform.db bind mount. Helm/prod builds keep the Dockerfile default
      # (10001). Without this the non-root agent failed with "attempt to write a readonly database".
      args:
        APP_UID: ${EXAMLOPS_UID:-1000}
        APP_GID: ${EXAMLOPS_GID:-1000}
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-agent:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-agent
    mem_limit: ${AGENT_MEM_LIMIT:-2g}
    environment:
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: "18004"
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_API_KEYS_JSON: ${AGENT_API_KEYS_JSON:-}
      AGENT_MODEL: ${AGENT_MODEL:-llama3.1:8b}
      # Do not reuse the host CLI's localhost URL inside a container. Override this only when
      # Compose should reach an Ollama server somewhere other than the Docker host.
      AGENT_OLLAMA_URL: ${AGENT_CONTAINER_OLLAMA_URL:-http://host.docker.internal:11436}
      AGENT_OLLAMA_KEEP_ALIVE: ${AGENT_OLLAMA_KEEP_ALIVE:-30m}
      AGENT_OLLAMA_REASONING: ${AGENT_OLLAMA_REASONING:-false}
      AGENT_OLLAMA_NUM_CTX: ${AGENT_OLLAMA_NUM_CTX:-16384}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5.5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RAY_SERVE_URL: http://ray-serving:8001
      PROMETHEUS_URL: http://prometheus:9090
      CONTROL_PLANE_URL: http://control-plane:8002
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:-}
      DASHBOARD_URL: http://dashboard:8099
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:-}
      # ONE shared platform DB across the stack (X1): /data/platform.db was a private volume
      # copy — the agent answered drift/audit questions from a database nothing else wrote to.
      PLATFORM_DB: /state/platform.db
      # ADR 0128: /state is this instance's data root (site.toml, usecase/, config/).
      EXAMLOPS_DATA_DIR: /state
      EXAMLOPS_DB_BACKEND: ${EXAMLOPS_DB_BACKEND:-sqlite}
      EXAMLOPS_POSTGRES_DSN: ${EXAMLOPS_POSTGRES_DSN:-}
      AGENT_DB: /data/agent_memory.db
      AGENT_MEMORY_DB: /data/skipper_memory.db
      AGENT_MEMORY_REVIEW_DB: /data/skipper_review.db
      AGENT_DOCS_ROOT: /app/docs
      AGENT_KNOWLEDGE_ROOTS: /app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18004:18004"
    volumes:
      - agent_data:/data
      - ${EXAMLOPS_STATE_DIR:-../../..}:/state:rw
    depends_on:
      control-plane:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:18004/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Kafka (dev/test only, `--profile kafka`) — a single-node KRaft broker ───────────
  # For exercising the dataplane's `kafka` connector (ADR 0130) and stream ingress (ADR 0131)
  # against a real broker. Not a production deployment: one node, no replication, PLAINTEXT.
  # Containers reach it as `kafka:9092`; the host as `localhost:19092` (+10000 rule).
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: [kafka]
    container_name: examlops-kafka
    mem_limit: ${KAFKA_MEM_LIMIT:-1g}
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Topics are created on purpose, never by a typo in a consumer's config.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Lineage receiver (`--profile lineage`) — Marquez, the OpenLineage reference server ────
  # ADR 0004 clause 3. Every lineage emit path POSTs OpenLineage run events to
  # EXAMLOPS_OPENLINEAGE_URL; this receives them and draws the graph (docs/guides/lineage.md).
  # Opt-in like every profile: without it `exa models lineage` reads the same graph from
  # platform_db, which is always written.
  # Marquez has NO authentication — whoever reaches its API can write or delete lineage — so both
  # ports are published on loopback only, and its database sits on a network nothing else joins.
  # API: http://localhost:15050 (host) · http://marquez:5000 (containers). UI:
  # http://localhost:13050, which proxies the API and is no less sensitive. Point the containers'
  # emitters at it with EXAMLOPS_OPENLINEAGE_URL=http://marquez:5000 in this directory's .env.
  marquez-db:
    image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
    profiles: [lineage]
    container_name: examlops-marquez-db
    mem_limit: ${MARQUEZ_DB_MEM_LIMIT:-512m}
    environment:
      POSTGRES_USER: marquez
      # Dev default; the database publishes no port and only `marquez` shares its network.
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD:-marquez}
      POSTGRES_DB: marquez
    volumes:
      - marquez_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 10

  marquez:
    # 0.51.1 is the newest Marquez release (2025-03-27). Pinned by digest; the image's own dev
    # config is replaced by ./marquez/marquez.yml (no inline password, no OpenSearch).
    image: marquezproject/marquez:0.51.1@sha256:0721c976cff17d8b14f7949d85d6dac9c7ea37cb9fe857caa19833730fcb1a50
    profiles: [lineage]
    container_name: examlops-marquez
    mem_limit: ${MARQUEZ_MEM_LIMIT:-1g}
    # The image runs as root; nothing in it needs to. Verified serving with this user, a
    # read-only root filesystem and no capabilities.
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MARQUEZ_CONFIG: /etc/marquez/marquez.yml
      MARQUEZ_DB_PASSWORD: ${MARQUEZ_DB_PASSWORD:-marquez}
    volumes:
      - ./marquez/marquez.yml:/etc/marquez/marquez.yml:ro
    ports:
      - "127.0.0.1:15050:5000"
    depends_on:
      marquez-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  marquez-web:
    image: marquezproject/marquez-web:0.51.1@sha256:7312112ca0e611b0a37b00d3da6a677485ae4a97622b23d3ae24d849a927868b
    profiles: [lineage]
    container_name: examlops-marquez-web
    mem_limit: ${MARQUEZ_WEB_MEM_LIMIT:-256m}
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "127.0.0.1:13050:3000"
    depends_on:
      marquez:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── Optional monitoring stack (start with: make monitoring-up) ─────────────
  # Run under the "monitoring" profile — not started by dev-up.
  # Use on a laptop only when you need metrics; stop with make monitoring-down.

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-prometheus:${EXAMLOPS_IMAGE_TAG:-latest}
    profiles: [monitoring]
    container_name: examlops-prometheus
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-1g}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # Generated fleet targets (node_exporter/DCGM + running vLLM endpoints), written by
      # `exa hpc prometheus-sd`. Re-read every 30s — no Prometheus reload needed.
      - ./targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "19090:9090"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    container_name: examlops-alertmanager
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-256m}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Delivery secrets (Slack/PagerDuty/heartbeat) read at notify time; gitignored,
      # absent files degrade that receiver to a no-op. See alertmanager-secrets/README.md.
      - ./alertmanager-secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports:
      - "19093:9093"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    profiles: [monitoring]
    container_name: examlops-tempo
    mem_limit: ${TEMPO_MEM_LIMIT:-1g}
    # Run as root so the named volume under /var/tempo is writable (dev convenience).
    user: "0"
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "13200:3200"
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-grafana:${EXAMLOPS_IMAGE_TAG:-latest}
    profiles: [monitoring]
    container_name: examlops-grafana
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    environment:
      # Hardened defaults (item 0.8): anonymous access is opt-in, and the port below binds to
      # 127.0.0.1 unless GRAFANA_BIND widens it — so the well-known dev admin password is never
      # reachable from off-host by default (remote access goes through the ssh port-forwards).
      # A compose-level required var is NOT usable here: compose interpolates before profile
      # filtering, so `:?` on this profile-gated service would abort every compose command.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:13000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Loki — log aggregation. Promtail tails Docker stdout/stderr and ships here.
  loki:
    image: grafana/loki:2.9.10
    profiles: [monitoring]
    container_name: examlops-loki
    mem_limit: ${LOKI_MEM_LIMIT:-1g}
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "13100:3100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Promtail — log shipper. No per-service code change: it tails container
  # stdout via the Docker socket and forwards to Loki with compose-service
  # labels.
  promtail:
    image: grafana/promtail:2.9.10
    profiles: [monitoring]
    container_name: examlops-promtail
    mem_limit: ${PROMTAIL_MEM_LIMIT:-256m}
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/tmp
    depends_on:
      - loki
    restart: unless-stopped

  # Scoped Docker API proxy (item 0.6). The dashboard needs container start/stop/restart +
  # logs, but a raw rw /var/run/docker.sock mount is root-equivalent host takeover. This proxy
  # holds the socket read-only and exposes ONLY the allow-listed API sections (containers + POST
  # for lifecycle); IMAGES/EXEC/VOLUMES/NETWORKS/SWARM/SECRETS/AUTH are all denied. No published
  # port — reachable only on the internal compose network.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: examlops-docker-socket-proxy
    mem_limit: ${SOCKET_PROXY_MEM_LIMIT:-128m}
    environment:
      CONTAINERS: "1"   # list/inspect/logs
      POST: "1"         # allow POST → start/stop/restart (scoped to permitted sections)
      # Everything else denied (defaults to 0), explicit for auditability:
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      INFO: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SERVICES: "0"
      TASKS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      NODES: "0"
      PLUGINS: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  dashboard:
    build:
      context: ../../..
      dockerfile: platform/infra/docker-compose/Dockerfile.dashboard
      network: host
      # Dev: run as the host user — it writes the /state bind mount and scaffolds into /repo.
      args:
        APP_UID: ${EXAMLOPS_UID:-1000}
        APP_GID: ${EXAMLOPS_GID:-1000}
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-dashboard:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-dashboard
    mem_limit: ${DASHBOARD_MEM_LIMIT:-1g}
    environment:
      # Talk to Docker through the scoped proxy, NOT the raw socket (item 0.6).
      # docker.from_env() honors DOCKER_HOST, so no code change is needed.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      MLFLOW_URL: http://mlflow:5000
      PREFECT_URL: http://orchestrator:4200
      RAY_SERVE_URL: http://ray-serving:8001
      RAY_DASHBOARD_URL: http://ray-serving:8265
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      PUBLIC_GRAFANA_URL: "http://${PUBLIC_HOST:-localhost}:13000"
      # OpenLineage receiver for this service's lineage events (ADR 0004); unset ⇒ platform_db
      # only. http://marquez:5000 with `--profile lineage`.
      EXAMLOPS_OPENLINEAGE_URL: ${EXAMLOPS_OPENLINEAGE_URL:-}
      MINIO_URL: http://minio:9000
      PUBLIC_MINIO_CONSOLE_URL: http://${PUBLIC_HOST:-localhost}:19001
      DATABASE_URL: postgresql+asyncpg://mlops:${POSTGRES_PASSWORD:-mlops}@postgres/mlflow
      DASHBOARD_VIEWER_PASSWORD: ${DASHBOARD_VIEWER_PASSWORD:?must be set in .env}
      DASHBOARD_ADMIN_PASSWORD:  ${DASHBOARD_ADMIN_PASSWORD:?must be set in .env}
      # Organisation SSO (ADR 0120) — see docs/guides/identity-federation.md.
      EXAMLOPS_IAM_CONFIG: ${EXAMLOPS_IAM_CONFIG:-}
      DASHBOARD_LOCAL_LOGIN: ${DASHBOARD_LOCAL_LOGIN:-true}
      DASHBOARD_SESSION_COOKIE_SECURE: ${DASHBOARD_SESSION_COOKIE_SECURE:-true}
      DASHBOARD_SSO_SESSION_HOURS: ${DASHBOARD_SSO_SESSION_HOURS:-8}
      DASHBOARD_JWT_SECRET:      ${DASHBOARD_JWT_SECRET:?must be set in .env}
      DASHBOARD_JWT_TTL_HOURS:   ${DASHBOARD_JWT_TTL_HOURS:-12}
      DASHBOARD_SECRET_KEY:      ${DASHBOARD_SECRET_KEY:?must be set in .env}
      DASHBOARD_PORT: "8099"
      CONTROL_PLANE_URL: http://control-plane:8002
      AGENT_URL: http://agent:18004
      DASHBOARD_AGENT_API_KEY: ${DASHBOARD_AGENT_API_KEY:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      PUBLIC_CONTROL_PLANE_URL: http://${PUBLIC_HOST:-localhost}:18002
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DASHBOARD_MINIO_BUCKET: dashboard-model-docs
      GRAFANA_LOKI_EXPLORE_URL: http://${PUBLIC_HOST:-localhost}:13000/explore
      EXAMLOPS_REPO_URL: ${EXAMLOPS_REPO_URL:-}
      EXAMLOPS_REPO_BRANCH: ${EXAMLOPS_REPO_BRANCH:-main}
      PUBLIC_MLFLOW_URL: http://${PUBLIC_HOST:-localhost}:15000
      PUBLIC_PREFECT_URL: http://${PUBLIC_HOST:-localhost}:14200
      PUBLIC_RAY_SERVE_URL: http://${PUBLIC_HOST:-localhost}:18001
      REPO_ROOT: /repo
      # Use-case content lives in a pack, separate from the platform (ADR 0094).
      EXAMLOPS_USECASE_DIR: /repo/usecases/seanergy
      MODELS_YAML_DIR: /repo/usecases/seanergy/models
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      OTEL_SERVICE_NAME: dashboard
      SEANERBUS_BRIDGE_STATUS_URL: http://seanerbus-bridge:8003
      PUBLIC_SEANERBUS_BRIDGE_URL: http://${PUBLIC_HOST:-localhost}:18003
      LOKI_URL: http://loki:3100
      PUBLIC_LOKI_URL: http://${PUBLIC_HOST:-localhost}:13100
      EXAMLOPS_DATAPLANE_URL: http://dataplane:8010
      PUBLIC_DATAPLANE_URL: http://${PUBLIC_HOST:-localhost}:18010
      JUPYTERHUB_URL: http://jupyterhub:8000
      PUBLIC_JUPYTERHUB_URL: http://${PUBLIC_HOST:-localhost}:18888
      PUBLIC_DASHBOARD_URL: http://${PUBLIC_HOST:-localhost}:18099
      SLURM_MODE: ${EXAMLOPS_SLURM_MODE:-mock}
      PLATFORM_DB: /state/platform.db
      # ADR 0128: /state is this instance's data root (site.toml, usecase/, config/).
      EXAMLOPS_DATA_DIR: /state
      # Datastore engine pass-through (X2): docs/guides/postgres-backend.md says these must
      # reach EVERY state-touching process, or that process silently stays on SQLite.
      EXAMLOPS_DB_BACKEND: ${EXAMLOPS_DB_BACKEND:-sqlite}
      EXAMLOPS_POSTGRES_DSN: ${EXAMLOPS_POSTGRES_DSN:-}
      # Point the /documents docs router (routers/docs.py) at the bind-mounted repo so the
      # Documents page serves the live README.md + docs/** during dev. Takes precedence over the
      # image's baked docs/ copy (Dockerfile.dashboard) — that copy is the fallback for K8s/PVC
      # where /repo is not mounted. Without either, the tree resolves empty ("No results").
      EXAMLOPS_DOCS_ROOT: /repo
      # Authored calculation providers (ADR 0074) live under the bind-mounted repo so they persist
      # across restarts and are shared with the CLI/pipeline (all resolve the same path).
      EXAMLOPS_PROVIDERS_DIR: /state/.providers
      # Project workbenches (ADR 0090) spawn as JupyterHub named servers — the Hub holds the Docker
      # access the dashboard's socket-proxy denies. API URL is in-cluster; the public URL is what the
      # browser's "Open" button points at (through the tunnel).
      JUPYTERHUB_API_URL: ${JUPYTERHUB_API_URL:-http://examlops-jupyterhub:8000/hub/api}
      JUPYTERHUB_PUBLIC_URL: "http://${PUBLIC_HOST:-localhost}:18888"
      JUPYTERHUB_DASHBOARD_TOKEN: ${JUPYTERHUB_DASHBOARD_TOKEN:-}
      JUPYTERHUB_WORKBENCH_USER: ${JUPYTERHUB_WORKBENCH_USER:-admin}
      # The dashboard's config-write routers (projects storage, named connections) call the
      # SAME `examlops.*` code paths as the `exa` CLI (phase 42) instead of re-implementing them,
      # so the UI can never drift from the CLI and secrets flow through one store. The examlops
      # source is bind-mounted at /repo (see REPO_ROOT / MODELS_YAML_DIR above); putting its src
      # dir on PYTHONPATH makes it importable. Without this, those write paths degrade to 503
      # ("… requires the examlops package (not available in this deployment)").
      PYTHONPATH: /repo/platform/cli/src
      # CLI Console / Resources / Config (ADR 0119): the `config.toml` the dashboard's own `exa`
      # runs use, and the workspace path arguments are contained in. On a named volume so config
      # edits and uploaded/produced files survive a rebuild — and never land in the repo.
      EXAMLOPS_CONFIG: /var/lib/examlops-dashboard/config.toml
      EXAMLOPS_DASHBOARD_CLI_WORKSPACE: /var/lib/examlops-dashboard/cli-workspace
    ports:
      - "18099:8099"
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      agent:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    restart: unless-stopped
    volumes:
      # Raw docker.sock replaced by the scoped proxy (DOCKER_HOST above) — item 0.6.
      # NB (prod): the whole-repo rw bind below is a dev convenience so the host CLI and the
      # container share one platform.db; K8s (Phase 1.1) replaces it with a least-priv PVC.
      - ${EXAMLOPS_HOST_REPO:-../../..}:/repo:rw
      - ${EXAMLOPS_STATE_DIR:-../../..}:/state:rw
      - dashboard_cli_data:/var/lib/examlops-dashboard
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── JupyterHub — multi-user notebook server (make jupyter-up) ────────────
  # Run under the "jupyter" profile — not started by stack-up.
  # Each login spawns a dedicated JupyterLab container via DockerSpawner.
  jupyterhub:
    build:
      context: .
      dockerfile: Dockerfile.jupyterhub
      network: host
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-jupyterhub:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-jupyterhub
    mem_limit: ${JUPYTERHUB_MEM_LIMIT:-2g}
    profiles: [jupyter]
    ports:
      - "18888:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyter_hub_data:/data
    environment:
      DOCKER_NETWORK_NAME: examlops_default
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Host path of the platform repo — bind-mounted into each spawned notebook (read-only) so a
      # notebook can `import examlops` for plugin/provider management (ADR 0074); the .providers
      # subdir is mounted read-write so authored plugins are shared with the CLI/dashboard.
      EXAMLOPS_HOST_REPO: ${EXAMLOPS_HOST_REPO:-/opt/examlops}
      EXAMLOPS_HOST_STATE: ${EXAMLOPS_STATE_DIR:-/opt/examlops}
      # Shared token the dashboard uses to start/stop project workbenches (named servers) via the
      # Hub API. Set in the deploy env (never committed); when empty, the dashboard workbench
      # Open/Start simply degrades (no spawn).
      JUPYTERHUB_DASHBOARD_TOKEN: ${JUPYTERHUB_DASHBOARD_TOKEN:-}
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/hub/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── SeanerBUS bridge ─────────────────────────────────────────────────────────
  # Connects to the real SeanerBUS (seanerbus repo docker-compose, port 5398).
  # Start with: make seanerbus-up
  # Real SeanerBUS must be running first: cd ../seanerbus && docker compose up -d
  seanerbus-bridge:
    build:
      # context is the parent seanergys/ dir so both repos are accessible
      context: ../../../..
      dockerfile: ai-productions/platform/infra/docker-compose/Dockerfile.bridge
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-bridge:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-seanerbus-bridge
    mem_limit: ${BRIDGE_MEM_LIMIT:-1g}
    networks:
      - default
      - seanerbus-net     # shared with seanerbus repo — allows direct container-to-container connection
    # Lets SEANERBUS_HOST=host.docker.internal reach a SeanerBUS running bare-metal on the host (Linux needs host-gateway)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SEANERBUS_HOST: "${SEANERBUS_HOST:-seanerbus-reqgen}"
      SEANERBUS_PORT: "${SEANERBUS_PORT:-5398}"
      SEANERBUS_MODE: "reqres"
      SEANERBUS_RETRAIN_UUID: "${SEANERBUS_RETRAIN_UUID:-}"
      SEANERBUS_VECTOR_UUID: "${SEANERBUS_VECTOR_UUID:-}"
      RAY_SERVE_URL: "http://ray-serving:8001"
      CONTROL_PLANE_URL: "http://control-plane:8002"
      CONTROL_PLANE_TOKEN: "${CONTROL_PLANE_TOKEN:-}"
      SEANERBUS_DEFAULT_MODEL: "${SEANERBUS_DEFAULT_MODEL:-JPCP}"
      SEANERBUS_DEFAULT_ALIAS: "${SEANERBUS_DEFAULT_ALIAS:-Production}"
      MODELS_YAML_DIR: "/app/usecases/seanergy/models"
      # ONE shared platform DB across the stack (X1): without this the bridge wrote its
      # drift/audit/input telemetry into an ephemeral container-local ./platform.db that
      # nothing else could see and a recreate erased.
      PLATFORM_DB: /state/platform.db
      # ADR 0128: /state is this instance's data root (site.toml, usecase/, config/).
      EXAMLOPS_DATA_DIR: /state
      EXAMLOPS_DB_BACKEND: ${EXAMLOPS_DB_BACKEND:-sqlite}
      EXAMLOPS_POSTGRES_DSN: ${EXAMLOPS_POSTGRES_DSN:-}
    volumes:
      - ${EXAMLOPS_STATE_DIR:-../../..}:/state:rw
    env_file:
      - path: .env
        required: true
      - path: .env.dashboard
        required: false
    ports:
      - "18003:8003"   # bridge HTTP status server — probed by dashboard
    profiles:
      - seanerbus
    depends_on:
      ray-serving:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    # unless-stopped (was on-failure) so the bridge is restarted after any exit,
    # matching its long-lived peers; its own reconnect backoff handles transients.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Whole-platform backup sidecar (Phase 0 item 0.9, extended) ─────────────
  # Runs `exa backup schedule` inside the stack so it can reach Postgres + MinIO. Opt-in via the
  # `backup` profile: `docker compose --profile backup up -d backup`. Off-site replication is
  # enabled by setting EXAMLOPS_BACKUP_S3_URI. Degrades gracefully: any tier whose tooling/endpoint
  # is unavailable is skipped, never crashing the cycle.
  backup:
    build:
      context: ../../..
      dockerfile: platform/infra/docker-compose/Dockerfile.backup
    image: ${EXAMLOPS_IMAGE_PREFIX:-examlops}-backup:${EXAMLOPS_IMAGE_TAG:-latest}
    container_name: examlops-backup
    command: ["backup", "schedule", "--all"]
    profiles:
      - backup
    environment:
      EXAMLOPS_BACKUP_DIR: /backups
      EXAMLOPS_BACKUP_INTERVAL: ${EXAMLOPS_BACKUP_INTERVAL:-3600}
      EXAMLOPS_BACKUP_RETAIN: ${EXAMLOPS_BACKUP_RETAIN:-keep=14}
      EXAMLOPS_BACKUP_S3_URI: ${EXAMLOPS_BACKUP_S3_URI:-}
      EXAMLOPS_ACTOR: backup-sidecar
      PLATFORM_DB: /state/platform.db
      # ADR 0128: /state is this instance's data root (site.toml, usecase/, config/).
      EXAMLOPS_DATA_DIR: /state
      CONTROL_PLANE_DB: /data/approvals.db
      # Postgres tier (mlflow + prefect metadata) — reaches the postgres service over the network.
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      EXAMLOPS_BACKUP_PG_DBS: ${EXAMLOPS_BACKUP_PG_DBS:-mlflow,prefect}
      # Object tier (MinIO buckets) — same creds/endpoint as the rest of the stack.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      EXAMLOPS_PROJECTS_BUCKET: ${EXAMLOPS_PROJECTS_BUCKET:-examlops-projects}
    volumes:
      - ${EXAMLOPS_HOST_REPO:-../../..}:/repo:rw
      - ${EXAMLOPS_STATE_DIR:-../../..}:/state:rw
      - control_plane_data:/data:ro  # read the control-plane approvals DB
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── vLLM OpenAI-compatible server (Track V / ADR 0107) ──────────────────────
  # Behind the `vllm` profile: it is the only GPU service in the stack, so a plain
  # `docker compose up` on a CPU box must not try to start it. Bring it up with
  # `exa serve llm start <model> --launcher compose`, or:
  #   docker compose --profile vllm up -d vllm
  #
  # EXAMLOPS_VLLM_ARGS is rendered by engines.to_vllm_args() — the same renderer the
  # Slurm template and the KServe manifest use, so the engine block means one thing
  # everywhere. Do not hand-edit flags here.
  #
  # NB: EXAMLOPS_VLLM_MODEL must NOT use `:?`. Compose interpolates every service before
  # it filters by profile, so a required-variable error here aborted *every* compose
  # command — `up`, `down`, `ps`, `logs` — on any machine that had not set a GPU variable,
  # which is every CPU node the profile exists to protect. The sentinel default keeps the
  # message useful (vLLM reports the unset variable by name) while leaving the rest of the
  # stack operable.
  vllm:
    profiles: ["vllm"]
    image: ${EXAMLOPS_VLLM_IMAGE_TAG:-vllm/vllm-openai:latest}
    container_name: examlops-vllm
    mem_limit: ${VLLM_MEM_LIMIT:-8g}
    command: >
      --model ${EXAMLOPS_VLLM_MODEL:-EXAMLOPS_VLLM_MODEL-is-not-set}
      --host 0.0.0.0
      --port ${EXAMLOPS_VLLM_PORT:-8000}
      ${EXAMLOPS_VLLM_ARGS:-}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      VLLM_API_KEY: ${EXAMLOPS_VLLM_API_KEY:-}
    ports:
      - "${EXAMLOPS_VLLM_HOST_PORT:-18011}:${EXAMLOPS_VLLM_PORT:-8000}"
    volumes:
      # Cache the weights on the host: a cold pull is tens of GB per restart otherwise.
      - vllm_cache:/root/.cache/huggingface
    # PagedAttention needs far more shared memory than Docker's 64 MB default; too little
    # shows up as an opaque NCCL/worker crash rather than an out-of-shm error.
    shm_size: '8gb'
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EXAMLOPS_VLLM_GPUS:-1}
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:${EXAMLOPS_VLLM_PORT:-8000}/health')\""]
      interval: 30s
      timeout: 10s
      # Loading a large model takes minutes; a short start_period would mark the
      # container unhealthy and restart it forever before it ever finished loading.
      start_period: 600s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  vllm_cache:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
  alertmanager_data:
  tempo_data:
  jupyter_hub_data:
  control_plane_data:
  agent_data:
  backups_data:
  dashboard_cli_data:
  dataplane_stage:
  kafka_data:
  marquez_db_data:

networks:
  seanerbus-net:
    external: true        # created once: docker network create seanerbus-net
