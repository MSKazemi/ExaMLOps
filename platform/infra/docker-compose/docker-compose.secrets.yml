# Opt-in overlay: point the services that resolve secrets at the bundled OpenBao (ADR 0011).
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml --profile secrets up -d openbao
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml --profile secrets up -d
#
# Off by default: without this overlay no service is told about a vault and the resolution order
# stays exactly what it was (local Fernet store, then environment). Initialise and unseal the server
# first (docs/runbooks/openbao.md) and put the token it issues in .env as EXAMLOPS_VAULT_TOKEN.
# The token is read from the environment at `up` time; nothing here holds a value.
#
# Set EXAMLOPS_VAULT_STRICT=1 once OpenBao is the system of record, so an unreachable vault fails a
# read instead of silently serving the local store or an environment variable.
# tests/unit/test_openbao_deployable.py holds this file to those claims.
x-vault: &vault
  EXAMLOPS_VAULT_ADDR: ${EXAMLOPS_VAULT_ADDR:-http://openbao:8200}
  EXAMLOPS_VAULT_TOKEN: ${EXAMLOPS_VAULT_TOKEN:-}
  EXAMLOPS_VAULT_STRICT: ${EXAMLOPS_VAULT_STRICT:-}

services:
  control-plane:
    environment: *vault
  dashboard:
    environment: *vault
  agent:
    environment: *vault
  dataplane:
    environment: *vault
