global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Stamped onto every scraped series and every alert, so the Alertmanager route tree can
  # branch by cluster/tenant. Override per-deployment (env-templated in prod / per-fleet).
  external_labels:
    cluster: local
    tenant: default

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert_rules.yml

# HA / long-term metrics (item 3.3): ship scraped samples to Mimir/Thanos on object storage for
# unlimited retention + horizontal query. Disabled in dev (no Mimir); uncomment + set the URL in
# prod. The OTel Collector (otel-collector-config.yml) also remote-writes OTLP metrics there.
# remote_write:
#   - url: http://mimir:9009/api/v1/push
#     queue_config: {max_shards: 30, capacity: 10000}

scrape_configs:
  # Ray Serve metrics — auto-exported by Ray's built-in Prometheus integration.
  # RAY_METRICS_EXPORT_PORT=8080 must be set on the ray-serving container.
  - job_name: ray_serve
    static_configs:
      - targets: ['ray-serving:8080']
    metrics_path: /metrics

  - job_name: control_plane
    static_configs:
      - targets: ['control-plane:8002']
    metrics_path: /metrics

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  # Loki holds the platform's logs. It was the one monitoring component nothing scraped, which
  # made `LokiDown` — and the generic `TargetDown` — permanently silent for it: `up{job="loki"}`
  # is empty rather than 0 when no scrape config names the job.
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics

  - job_name: seanerbus_bridge
    static_configs:
      - targets: ['seanerbus-bridge:8003']
    metrics_path: /metrics

  - job_name: dataplane
    static_configs:
      - targets: ['dataplane:8010']
    metrics_path: /metrics

  # vLLM (Track V / ADR 0107) — TTFT, inter-token latency, queue depth, KV-cache usage.
  # The Compose service is a fixed target; endpoints launched on HPC land on whichever
  # node the scheduler allocated, so those are discovered from the endpoint registry via
  # `exa hpc prometheus-sd --out /etc/prometheus/targets/fleet.json` (file_sd below).
  - job_name: vllm
    static_configs:
      - targets: ['vllm:8000']
    metrics_path: /metrics
    # The Compose service sits behind the `vllm` GPU profile and is absent on a CPU host;
    # a down target there is expected, not an incident.
    honor_labels: true

  # Fleet service discovery: node_exporter + DCGM + running vLLM endpoints, regenerated
  # by `exa hpc prometheus-sd`. Prometheus re-reads the file automatically — no reload.
  - job_name: fleet
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
        refresh_interval: 30s
    metrics_path: /metrics
