# Prometheus alerting rules for ExaMLOps.
# All expressions reference metrics the platform already emits
# (serving: serving/ray_serving/app.py; control plane: platform/services/control_plane/metrics.py).
groups:
  - name: examlops-serving
    rules:
      - alert: RayServeHighErrorRate
        expr: |
          sum(rate(examlops_predict_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(examlops_predict_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ray Serve prediction error rate above 5%"
          description: "5m error ratio is {{ $value | humanizePercentage }}."
      - alert: RayServeHighLatencyP99
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(examlops_predict_latency_seconds_bucket[5m]))) > 1.0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ray Serve p99 prediction latency above 1s"
          description: "p99 latency is {{ $value }}s over the last 5m."
      - alert: RayServeNoModelsLoaded
        expr: max(examlops_models_loaded) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No models loaded in the Ray Serve hot set"
      - alert: RayServeReloadFailures
        expr: increase(examlops_reload_total{status="error"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Ray Serve model reload failures detected"
  - name: examlops-control-plane
    rules:
      - alert: ApprovalsStale
        expr: examlops_approval_age_oldest_seconds > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Oldest pending model approval is older than 24h"
  - name: examlops-platform
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
