# Deploy-node overrides — apply with:
#   docker compose -f docker-compose.yml -f docker-compose.lxp.yml up -d
#
# Adjusts bridge build ARGs to match the deploy-node directory layout:
#   $EXAMLOPS_DEPLOY_PATH/            (this repo)
#   $EXAMLOPS_DEPLOY_PATH-seanerbus/seanerbus/   (the seanerbus repo)
#
# Site-specific values live in .env (gitignored), never here:
#   EXAMLOPS_GITLAB_HOST_ENTRY="<gitlab-host>:<ip>"   internal DNS pin for the
#       control plane, needed where the deploy node cannot resolve the internal
#       GitLab. Harmless default below; override in .env.

services:
  control-plane:
    extra_hosts:
      - "${EXAMLOPS_GITLAB_HOST_ENTRY:-gitlab.example.com:127.0.0.1}"

  seanerbus-bridge:
    build:
      dockerfile: examlops/platform/infra/docker-compose/Dockerfile.bridge
      network: host
      args:
        AI_PRODUCTIONS_DIR: examlops
        SEANERBUS_DIR: examlops-seanerbus/seanerbus
