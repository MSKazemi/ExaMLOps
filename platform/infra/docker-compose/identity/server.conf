# SPIRE server for the Compose `identity` profile (ADR 0125). Started with -expandEnv.
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  trust_domain = "${EXAMLOPS_SPIFFE_TRUST_DOMAIN}"
  data_dir = "/var/lib/spire/server"
  # The admin API socket, shared with spire-register on the spire_server_run volume.
  socket_path = "/run/spire/server/private/api.sock"
  log_level = "WARN"
  default_x509_svid_ttl = "1h"
  default_jwt_svid_ttl = "5m"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }
  # On disk, so a restart keeps the signing keys and every verifier's bundle stays valid.
  KeyManager "disk" {
    plugin_data { keys_path = "/var/lib/spire/server/keys.json" }
  }
  # The agent proves its node with a certificate from the local CA spire-pki creates. Unlike a
  # single-use join token, it can re-attest after any restart.
  NodeAttestor "x509pop" {
    plugin_data { ca_bundle_path = "/pki/node-ca.pem" }
  }
}
