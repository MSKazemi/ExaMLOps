# spiffe-helper beside a service that calls the control plane (ADR 0125). Keeps the service's
# JWT-SVID for the `control-plane` audience in /run/spire/svid/control-plane.jwt, rewritten before
# it expires; the service reads it on every call through CONTROL_PLANE_TOKEN_FILE.
agent_address = "/run/spire/sockets/agent.sock"
cmd = ""
cert_dir = "/run/spire/svid"
daemon_mode = true
jwt_svids = [{ jwt_audience = "control-plane", jwt_svid_file_name = "control-plane.jwt" }]
# Writable by the helper (it rewrites the file; without capabilities, root cannot bypass a
# read-only mode), readable by the service's own user. The file is a bearer credential valid for
# minutes, in a volume mounted only into this helper and its service (read-only there).
jwt_svid_file_mode = 0644
