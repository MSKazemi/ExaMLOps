# spiffe-helper beside the control plane (ADR 0125). Keeps the trust domain's JWT bundle, the keys
# every JWT-SVID is checked against, in /run/spire/svid/jwt-bundle.json; the control plane reads it
# through EXAMLOPS_SPIFFE_BUNDLE and re-reads it when SPIRE rotates its keys.
agent_address = "/run/spire/sockets/agent.sock"
cmd = ""
cert_dir = "/run/spire/svid"
daemon_mode = true
jwt_bundle_file_name = "jwt-bundle.json"
jwt_bundle_file_mode = 0644
