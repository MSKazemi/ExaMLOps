# SPIRE agent for the Compose `identity` profile (ADR 0125). Started with -expandEnv.
agent {
  data_dir = "/var/lib/spire/agent"
  log_level = "WARN"
  server_address = "spire-server"
  server_port = "8081"
  # The Workload API, shared with every spiffe-helper on the spire_agent_socket volume.
  socket_path = "/run/spire/sockets/agent.sock"
  trust_domain = "${EXAMLOPS_SPIFFE_TRUST_DOMAIN}"
  # The server's CA, exported by spire-register: the agent never trusts the server blindly.
  trust_bundle_path = "/pki/server-bundle.pem"
}

plugins {
  NodeAttestor "x509pop" {
    plugin_data {
      private_key_path = "/pki/agent-key.pem"
      certificate_path = "/pki/agent-cert.pem"
    }
  }
  KeyManager "memory" {
    plugin_data {}
  }
  # A caller is identified by its container's labels (examlops.spiffe=<service>), read through a
  # read-only Docker API proxy. Needs the host PID namespace to map a caller's PID to its container.
  WorkloadAttestor "docker" {
    plugin_data { docker_socket_path = "tcp://spire-docker-proxy:2375" }
  }
}
