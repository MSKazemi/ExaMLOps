# Minimal Alertmanager routing. The default receiver has no delivery integration,
# so alerts are visible in the Alertmanager UI (http://localhost:19093). To deliver to
# Slack, uncomment the slack_configs block and provide a webhook URL via your secret manager.
route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: default
  # - name: default
