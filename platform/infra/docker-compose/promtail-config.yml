# Promtail — ships container stdout/stderr to Loki by tailing the Docker
# socket. Each container shows up as a Loki stream labelled with its compose
# service name and project, so Grafana queries like {project="examlops"} or
# {compose_service="ray-serving"} just work.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only containers in the examlops compose project.
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [project]
        regex: examlops
        action: keep

      # Surface useful container metadata as labels.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
