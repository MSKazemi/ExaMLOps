# Reference identity broker + policy engine (ADR 0120) — for labs and for sites whose directory is
# LDAP/AD/Kerberos only. A data center that already runs an OIDC IdP (Keycloak, Unity/Helmholtz ID,
# EGI Check-in, MyAccessID) does NOT need this: point the trust file at its issuer instead.
#
#   KC_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 16) \
#     docker compose -f platform/infra/iam/docker-compose.iam.yml up -d
#
# Keycloak  http://localhost:18180  realm "examlops" (keycloak/examlops-realm.json): clients
#           `examlops-dashboard` (confidential, code + PKCE S256) and `exa-cli` (public, device
#           grant); groups examlops-admins/operators/viewers; `groups` + `aud: examlops` mappers.
#           Connect your directory under User federation → LDAP (edit mode READ_ONLY).
# OPA       http://localhost:18181  policy opa/examlops.rego at /v1/data/examlops/decision
#
# `start-dev` is Keycloak's development mode (HTTP, in-memory H2). Production: `start` with TLS, a
# real database and a hostname — https://www.keycloak.org/server/configuration-production
# Both ports are bound to loopback only.
name: examlops-iam

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://localhost:18180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18180:8080"
    volumes:
      - ./keycloak/examlops-realm.json:/opt/keycloak/data/import/examlops-realm.json:ro

  opa:
    image: openpolicyagent/opa:1.20.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "/policies"]
    ports:
      - "127.0.0.1:18181:8181"
    volumes:
      - ./opa:/policies:ro
