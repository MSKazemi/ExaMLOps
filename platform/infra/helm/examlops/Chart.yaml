apiVersion: v2
name: examlops
description: >-
  ExaMLOps enterprise reference topology — stateless, horizontally-scalable control-plane,
  dashboard, and agent tiers behind an ingress, designed for HA Postgres (CloudNativePG) and
  distributed MinIO (Phase 1 item 1.1). Compose remains dev-only; this chart is the production shape.
type: application
# Chart version, and it must move whenever the chart's contents do: `helm repo index`
# keys entries on it, so republishing a changed chart under a version a consumer has
# already cached is invisible to `helm repo update` — the upgrade path silently ends.
# Kept in lockstep with appVersion because the chart ships from the same repo as the
# code it deploys; tests/unit/test_helm_chart.py holds the two together.
version: 0.49.0
appVersion: "0.49.0"
keywords: [mlops, hpc, kubernetes, ha]
maintainers:
  - name: Mohsen Seyedkazemi Ardebili
    url: https://mskazemi.github.io
home: https://github.com/MSKazemi/ExaMLOps
