{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "examlops.fullname" . }}
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- $gatewayHost := and (.Values.gateway | default dict).enabled ((.Values.gateway | default dict).ingress | default dict).host }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}{{ if $gatewayHost }}, {{ $gatewayHost | quote }}{{ end }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Keep control-plane machine endpoints reachable without stealing the dashboard's
          # entire /api namespace. Kubernetes selects the longest matching prefix.
          - path: /api/changes
            pathType: Prefix
            backend:
              service:
                name: {{ include "examlops.fullname" . }}-control-plane
                port: {name: http}
          - path: /webhooks/modelzoo
            pathType: Prefix
            backend:
              service:
                name: {{ include "examlops.fullname" . }}-control-plane
                port: {name: http}
          - path: /retrain
            pathType: Prefix
            backend:
              service:
                name: {{ include "examlops.fullname" . }}-control-plane
                port: {name: http}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "examlops.fullname" . }}-dashboard
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "examlops.fullname" . }}-dashboard
                port: {name: http}
    {{- if $gatewayHost }}
    # The serving gateway on its own host: inference paths (/v2, /infer-pipeline) stay clear of
    # the dashboard's, and the gateway decides what is routed.
    - host: {{ $gatewayHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "examlops.fullname" . }}-gateway
                port: {name: http}
    {{- end }}
{{- end }}
