apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "examlops.fullname" . }}-dashboard
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # readiness-gated: never drop below desired during upgrade
      maxSurge: 1
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "examlops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "examlops.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "examlops.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "examlops.image" (dict "root" . "svc" .Values.dashboard) }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.dashboard.port }}}
          envFrom:
            - configMapRef:
                name: {{ include "examlops.fullname" . }}-config
            - secretRef:
                name: {{ include "examlops.dashboardSecret" . | quote }}
          env:
            - name: CONTROL_PLANE_URL
              value: http://{{ include "examlops.fullname" . }}-control-plane:{{ .Values.controlPlane.port }}
            - name: AGENT_URL
              value: http://{{ include "examlops.fullname" . }}-agent:{{ .Values.agent.port }}
            - name: DASHBOARD_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "examlops.dashboardSecret" . | quote }}
                  key: DASHBOARD_AGENT_API_KEY
                  optional: true
            # CLI Console state (ADR 0119) — on the cli-state volume, never the read-only root.
            - name: EXAMLOPS_CONFIG
              value: /var/lib/examlops-dashboard/config.toml
            - name: EXAMLOPS_DASHBOARD_CLI_WORKSPACE
              value: /var/lib/examlops-dashboard/cli-workspace
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cli-state, mountPath: /var/lib/examlops-dashboard}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- if .Values.dashboard.cliState.existingClaim }}
        - name: cli-state
          persistentVolumeClaim:
            claimName: {{ .Values.dashboard.cliState.existingClaim | quote }}
        {{- else }}
        - {name: cli-state, emptyDir: {}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "examlops.fullname" . }}-dashboard
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "examlops.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
  ports:
    - {name: http, port: {{ .Values.dashboard.port }}, targetPort: http}
{{- if .Values.dashboard.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "examlops.fullname" . }}-dashboard
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.dashboard.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "examlops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
{{- end }}
