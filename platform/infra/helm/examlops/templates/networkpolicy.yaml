{{- /*
Per-tier NetworkPolicies (networkPolicy.enabled). Each selects ONE tier by its component label and
lists both policy types, so that tier is default-deny in and out except for what is written here.
Policies are per tier, not release-wide, on purpose: a release-wide deny would also catch pods this
file knows nothing about (the pre-upgrade Job, a future tier) and cut them off silently.
*/ -}}
{{- define "examlops.componentSelector" -}}
app.kubernetes.io/name: {{ include "examlops.name" .root }}
app.kubernetes.io/instance: {{ .root.Release.Name }}
app.kubernetes.io/component: {{ .component }}
{{- end -}}
{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $np := .Values.networkPolicy }}
{{- $ports := dict "control-plane" .Values.controlPlane.port "dashboard" .Values.dashboard.port "agent" .Values.agent.port }}
{{- $egress := dict "control-plane" $np.egressPorts.controlPlane "dashboard" $np.egressPorts.dashboard "agent" $np.egressPorts.agent "autopilot-follower" ($np.egressPorts.autopilotFollower | default (list 4222 5432 5000 9000)) "skipper-watch" ($np.egressPorts.skipperWatch | default (list 4222 5432)) }}
{{- /* agent.enabled absent (older values) means the agent tier is deployed, as it always was. */ -}}
{{- $agentOn := or (not (hasKey .Values.agent "enabled")) .Values.agent.enabled }}
{{- $tiers := list "control-plane" "dashboard" }}
{{- if $agentOn }}{{- $tiers = append $tiers "agent" }}{{- end }}
{{- /* Event backbone (ADR 0124): NATS for the relay and the dashboard's live stream, and a tier per
     follower. Both followers only read NATS and the datastore; the autopilot also calls the
     control plane. Nothing calls a follower, so it gets no ingress at all. */ -}}
{{- $events := .Values.events | default dict }}
{{- $followers := $events.followers | default dict }}
{{- $autopilotOn := ($followers.autopilot | default dict).enabled }}
{{- $watchOn := ($followers.skipperWatch | default dict).enabled }}
{{- if eq ($events.publisher | default "log") "nats" }}
{{- $_ := set $egress "control-plane" (append (get $egress "control-plane") 4222 | uniq) }}
{{- $_ := set $egress "dashboard" (append (get $egress "dashboard") 4222 | uniq) }}
{{- end }}
{{- if $autopilotOn }}{{- $tiers = append $tiers "autopilot-follower" }}{{- end }}
{{- if $watchOn }}{{- $tiers = append $tiers "skipper-watch" }}{{- end }}
{{- /* The serving gateway (ADR 0126): clients reach Envoy through the ingress controller, Prometheus
     scrapes its metrics listener, and only Envoy may call the authorization service. */ -}}
{{- $gatewayOn := ($root.Values.gateway | default dict).enabled }}
{{- if $gatewayOn }}
{{- $tiers = concat $tiers (list "gateway" "gateway-authz") }}
{{- $_ := set $egress "gateway" ($np.egressPorts.gateway | default (list (int $root.Values.gateway.upstream.port))) }}
{{- $_ := set $egress "gateway-authz" ($np.egressPorts.gatewayAuthz | default (list 5432 6379 443)) }}
{{- end }}
{{- range $tier := $tiers }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "examlops.fullname" $root }}-{{ $tier }}
  labels:
    {{- include "examlops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $tier }}
spec:
  podSelector:
    matchLabels:
      {{- include "examlops.componentSelector" (dict "root" $root "component" $tier) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if has $tier (list "control-plane" "dashboard") }}
    # The ingress controller routes external traffic to this tier (templates/ingress.yaml).
    - from:
        - namespaceSelector:
            {{- toYaml $np.ingressController.namespaceSelector | nindent 12 }}
      ports: [{protocol: TCP, port: {{ get $ports $tier }}}]
    {{- end }}
    {{- if eq $tier "control-plane" }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "dashboard") | nindent 14 }}
        {{- if $agentOn }}
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "agent") | nindent 14 }}
        {{- end }}
        {{- if $autopilotOn }}
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "autopilot-follower") | nindent 14 }}
        {{- end }}
      ports: [{protocol: TCP, port: {{ get $ports $tier }}}]
    # Prometheus scrapes /metrics (only this tier serves it).
    - from:
        - namespaceSelector:
            {{- toYaml $np.monitoring.namespaceSelector | nindent 12 }}
      ports: [{protocol: TCP, port: {{ get $ports $tier }}}]
    {{- end }}
    {{- if eq $tier "gateway" }}
    # Inference clients through the ingress controller, and Prometheus on the metrics listener.
    - from:
        - namespaceSelector:
            {{- toYaml $np.ingressController.namespaceSelector | nindent 12 }}
      ports: [{protocol: TCP, port: 8080}]
    - from:
        - namespaceSelector:
            {{- toYaml $np.monitoring.namespaceSelector | nindent 12 }}
      ports: [{protocol: TCP, port: 9902}]
    {{- end }}
    {{- if eq $tier "gateway-authz" }}
    # Only the gateway asks it; nothing else may probe credentials.
    - from:
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "gateway") | nindent 14 }}
      ports: [{protocol: TCP, port: 8090}]
    {{- end }}
    {{- if eq $tier "agent" }}
    # The dashboard's embedded copilot is the agent's only in-cluster client.
    - from:
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "dashboard") | nindent 14 }}
      ports: [{protocol: TCP, port: {{ get $ports $tier }}}]
    {{- end }}
  egress:
    # DNS, wherever the cluster runs its resolver.
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if eq $tier "dashboard" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "control-plane") | nindent 14 }}
      ports: [{protocol: TCP, port: {{ $root.Values.controlPlane.port }}}]
    {{- if $agentOn }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "agent") | nindent 14 }}
      ports: [{protocol: TCP, port: {{ $root.Values.agent.port }}}]
    {{- end }}
    {{- end }}
    {{- if eq $tier "gateway" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "gateway-authz") | nindent 14 }}
      ports: [{protocol: TCP, port: 8090}]
    {{- end }}
    {{- if has $tier (list "agent" "autopilot-follower") }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "examlops.componentSelector" (dict "root" $root "component" "control-plane") | nindent 14 }}
      ports: [{protocol: TCP, port: {{ $root.Values.controlPlane.port }}}]
    {{- end }}
    {{- with get $egress $tier }}
    # Services this chart does not deploy (Postgres, Redis, Prefect, MLflow, S3, …), by port.
    - ports:
        {{- range . }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
