apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "examlops.fullname" . }}-control-plane
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # readiness-gated: never drop below desired during upgrade
      maxSurge: 1
  {{- if not .Values.controlPlane.autoscaling.enabled }}
  replicas: {{ .Values.controlPlane.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "examlops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "examlops.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: {{ include "examlops.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: control-plane
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "examlops.image" (dict "root" . "svc" .Values.controlPlane) }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.port }}
          envFrom:
            - configMapRef:
                name: {{ include "examlops.fullname" . }}-config
            - secretRef:
                name: {{ include "examlops.controlPlaneSecret" . | quote }}
          env:
            - name: CONTROL_PLANE_PORT
              value: {{ .Values.controlPlane.port | quote }}
            {{- if .Values.workloadIdentity.enabled }}
            # Workload identities (ADR 0125): verify JWT-SVIDs against the bundle the sidecar keeps.
            - {name: EXAMLOPS_SPIFFE_TRUST_DOMAIN, value: {{ .Values.workloadIdentity.trustDomain | quote }}}
            - {name: EXAMLOPS_SPIFFE_BUNDLE, value: /run/spire/svid/jwt-bundle.json}
            - name: CONTROL_PLANE_WORKLOAD_IDENTITIES_JSON
              value: {{ include "examlops.workloadIdentityMap" . | quote }}
            {{- end }}
            {{- range $k, $v := .Values.controlPlane.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with (include "examlops.vaultTokenEnv" .) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          readinessProbe:
            # /readyz reads the datastore, which is bounded (EXAMLOPS_POSTGRES_POOL_TIMEOUT, 2 s)
            # and then answers from a cached verdict. Kubernetes' default timeout is 1 s, which the
            # first probe of an outage would exceed: a timeout reads as unready either way, but a
            # 503 with a body says why.
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            # Deliberately /livez, which touches nothing: a datastore outage must never restart
            # the replicas that would otherwise recover on their own.
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.workloadIdentity.enabled }}
            - {name: spiffe-svid, mountPath: /run/spire/svid, readOnly: true}
            {{- end }}
        {{- if .Values.workloadIdentity.enabled }}
        {{- include "examlops.spiffeHelperContainer" (dict "root" . "component" "control-plane") | nindent 8 }}
        {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- if .Values.workloadIdentity.enabled }}
        {{- include "examlops.spiffeVolumes" . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "examlops.fullname" . }}-control-plane
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
    # The Prometheus job name the alert rules select (ServiceMonitor jobLabel), as in Compose.
    examlops.io/job: control_plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "examlops.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    - {name: http, port: {{ .Values.controlPlane.port }}, targetPort: http}
{{- if .Values.controlPlane.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "examlops.fullname" . }}-control-plane
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "examlops.fullname" . }}-control-plane
  minReplicas: {{ .Values.controlPlane.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.controlPlane.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.controlPlane.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.controlPlane.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "examlops.fullname" . }}-control-plane
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.controlPlane.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "examlops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
{{- end }}
