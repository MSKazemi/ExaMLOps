{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "examlops.serviceAccountName" . }}
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "examlops.fullname" . }}-config
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
data:
  # Non-secret runtime config shared by every tier. Secrets come from existingSecret.
  EXAMLOPS_DB_BACKEND: "postgres"
  MINIO_URL: {{ .Values.minio.endpoint | quote }}
  EXAMLOPS_PROJECTS_BUCKET: {{ .Values.minio.bucket | quote }}
  PROMETHEUS_EXTERNAL_CLUSTER: {{ .Values.global.cluster | quote }}
  # ADR 0128: the deployment layer tells the core how it is run, and which modules the site runs.
  EXAMLOPS_DEPLOYMENT: "kubernetes"
  # OpenTelemetry: off unless a collector is configured (values: otel.endpoint).
  {{- if .Values.otel.endpoint }}
  OTEL_SDK_DISABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  {{- else }}
  OTEL_SDK_DISABLED: "true"
  {{- end }}
  {{- with .Values.site.features }}
  EXAMLOPS_FEATURES: {{ . | quote }}
  {{- end }}
  {{- if ((.Values.secrets | default dict).openbao | default dict).enabled }}
  # Secrets manager (ADR 0011): where examlops.secrets looks first.
  EXAMLOPS_VAULT_ADDR: {{ printf "http://%s-openbao:8200" (include "examlops.fullname" .) | quote }}
  {{- if .Values.secrets.openbao.strict }}
  EXAMLOPS_VAULT_STRICT: "1"
  {{- end }}
  {{- end }}
  # Event backbone (ADR 0124): the control plane's relay publishes with this; the followers and the
  # dashboard's live stream read NATS at EXAMLOPS_NATS_URL.
  EXAMLOPS_EVENT_PUBLISHER: {{ (.Values.events).publisher | default "log" | quote }}
  {{- with (.Values.events).natsUrl }}
  EXAMLOPS_NATS_URL: {{ . | quote }}
  {{- end }}
