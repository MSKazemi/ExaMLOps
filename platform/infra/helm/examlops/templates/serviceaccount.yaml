{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "examlops.serviceAccountName" . }}
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "examlops.fullname" . }}-config
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
data:
  # Non-secret runtime config shared by every tier. Secrets come from existingSecret.
  EXAMLOPS_DB_BACKEND: "postgres"
  MINIO_URL: {{ .Values.minio.endpoint | quote }}
  EXAMLOPS_PROJECTS_BUCKET: {{ .Values.minio.bucket | quote }}
  PROMETHEUS_EXTERNAL_CLUSTER: {{ .Values.global.cluster | quote }}
  # ADR 0128: the deployment layer tells the core how it is run, and which modules the site runs.
  EXAMLOPS_DEPLOYMENT: "kubernetes"
  {{- with .Values.site.features }}
  EXAMLOPS_FEATURES: {{ . | quote }}
  {{- end }}
