apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "examlops.fullname" . }}-agent
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # readiness-gated: never drop below desired during upgrade
      maxSurge: 1
  {{- if not .Values.agent.autoscaling.enabled }}
  replicas: {{ .Values.agent.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "examlops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "examlops.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "examlops.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "examlops.image" (dict "root" . "svc" .Values.agent) }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.agent.port }}}
          envFrom:
            - configMapRef:
                name: {{ include "examlops.fullname" . }}-config
            - secretRef:
                name: {{ include "examlops.agentSecret" . | quote }}
          env:
            - name: AGENT_SERVER_PORT
              value: {{ .Values.agent.port | quote }}
            - name: AGENT_CHECKPOINT_BACKEND
              value: postgres
            # Long-term semantic memory is SQLite-only today. Multiple pods would expose
            # divergent ephemeral stores, so the HA chart keeps this tier disabled.
            - name: AGENT_MEMORY_ENABLED
              value: "false"
            - name: AGENT_REQUIRE_API_KEY
              value: "true"
            - name: AGENT_API_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "examlops.agentSecret" . | quote }}
                  key: AGENT_API_KEYS_JSON
                  optional: true
            - name: AGENT_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "examlops.agentSecret" . | quote }}
                  key: AGENT_POSTGRES_DSN
            - name: CONTROL_PLANE_URL
              value: http://{{ include "examlops.fullname" . }}-control-plane:{{ .Values.controlPlane.port }}
            - name: DASHBOARD_URL
              value: http://{{ include "examlops.fullname" . }}-dashboard:{{ .Values.dashboard.port }}
            - name: MLFLOW_TRACKING_URI
              value: {{ .Values.agent.serviceUrls.mlflow | quote }}
            - name: RAY_SERVE_URL
              value: {{ .Values.agent.serviceUrls.rayServe | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.agent.serviceUrls.prometheus | quote }}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          # The rolling strategy above says "readiness-gated", and without a readinessProbe that
          # was not true: Kubernetes marks a pod Ready as soon as the container starts, so an
          # upgrade could route traffic to an agent that is not yet serving. Both probes hit `/`,
          # which returns a static page and touches nothing else. Deliberately NOT /api/info:
          # that probes the LLM backend for real (which is why `exa agent status` uses it), so a
          # provider outage would take every replica out of the Service instead of leaving an
          # agent that can still answer from tools and memory.
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "examlops.fullname" . }}-agent
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "examlops.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
  ports:
    - {name: http, port: {{ .Values.agent.port }}, targetPort: http}
{{- if .Values.agent.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "examlops.fullname" . }}-agent
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "examlops.fullname" . }}-agent
  minReplicas: {{ .Values.agent.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agent.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.agent.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.agent.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "examlops.fullname" . }}-agent
  labels:
    {{- include "examlops.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.agent.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "examlops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
{{- end }}
