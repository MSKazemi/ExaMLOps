# Prometheus alerting rules for ExaMLOps.
# All expressions reference metrics emitted by:
#   serving/ray_serving/app.py         (ray_examlops_*)
#   platform/services/control_plane/   (examlops_*)
#   dataplane-bus-bridge                   (dataplane_bus_*)
groups:

  # ── Ray Serve / Online Inference ──────────────────────────────────────────────
  - name: examlops-serving
    rules:

      - alert: RayServeHighErrorRate
        expr: |
          sum(rate(ray_examlops_predict_requests_total{status=~"error|timeout|deadline_exceeded"}[5m]))
          / clamp_min(sum(rate(ray_examlops_predict_requests_total{status=~"success|error|timeout|deadline_exceeded"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#rayservehigherrorrate"
          summary: "Ray Serve error rate > 5%"
          description: "Prediction error rate is {{ $value | humanizePercentage }} over the last 5 min."

      - alert: RayServeHighErrorRateCritical
        expr: |
          sum(rate(ray_examlops_predict_requests_total{status=~"error|timeout|deadline_exceeded"}[5m]))
          / clamp_min(sum(rate(ray_examlops_predict_requests_total{status=~"success|error|timeout|deadline_exceeded"}[5m])), 0.001)
          > 0.20
        for: 5m
        labels:
          severity: critical
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#rayservehigherrorratecritical"
          summary: "Ray Serve error rate > 20% (CRITICAL)"
          description: "Prediction error rate is {{ $value | humanizePercentage }} — immediate action required."

      - alert: RayServeHighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by(le) (rate(ray_examlops_predict_latency_seconds_bucket[5m]))
          ) > 1.0
        for: 10m
        labels:
          severity: warning
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#rayservehighlatencyp99"
          summary: "Ray Serve p99 latency > 1 s"
          description: "p99 prediction latency is {{ $value | humanizeDuration }} over the last 10 min."

      - alert: RayServeHighLatencyP99Critical
        expr: |
          histogram_quantile(0.99,
            sum by(le) (rate(ray_examlops_predict_latency_seconds_bucket[5m]))
          ) > 3.0
        for: 5m
        labels:
          severity: critical
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#rayservehighlatencyp99critical"
          summary: "Ray Serve p99 latency > 3 s (CRITICAL)"
          description: "p99 prediction latency is {{ $value | humanizeDuration }}."

      # `or absent(...)`: `sum()` over a series that does not exist yields an empty vector, so
      # `== 0` matched nothing precisely when nothing was loaded. The gauge is now published from
      # replica start (serving/ray_serving/app.py), which fixes the cause; this arm means the
      # alert still fires if any future path stops publishing it, instead of going quiet again.
      - alert: RayServeNoModelsLoaded
        expr: sum(ray_examlops_models_loaded) == 0 or absent(ray_examlops_models_loaded)
        for: 5m
        labels:
          severity: critical
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#rayservenomodelsloaded"
          summary: "No models loaded in Ray Serve"
          description: "ray_examlops_models_loaded = 0 for 5 min — inference is impossible."

      # Serving snapshot (ADR 0127): the control plane publishes generations, replicas report the
      # one they applied. A replica behind the published generation is serving a configuration
      # someone has already changed (a promotion, a traffic split, a shadow target).
      - alert: ServingSnapshotLagging
        expr: max(examlops_serving_snapshot_generation) - min(ray_examlops_serving_snapshot_applied_generation) > 0
        for: 5m
        labels:
          severity: warning
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servingsnapshotlagging"
          summary: "A serving replica is behind the published serving snapshot"
          description: "A replica has served generation {{ $value }} behind the control plane's for 5 min. Its /health shows snapshot.source; a model that fails to load keeps the last-known-good version and is logged."

      - alert: ServingSnapshotCompileFailing
        expr: sum(increase(examlops_serving_snapshot_compile_errors_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servingsnapshotcompilefailing"
          summary: "The control plane cannot compile the serving snapshot"
          description: "Replicas keep serving the last generation, so no promotion, traffic split or shadow change reaches serving. /health runtime.serving_snapshot.error says why (usually MLflow unreachable)."

      # Two arms. A Ray counter cannot be created at 0 (inc() refuses 0), so a replica's first
      # failed reload arrives as a new series already at 1, and increase() over a series with no
      # earlier sample is 0: with the first arm alone, a single failure never alerted. The second
      # arm fires for a failure series that did not exist 15 minutes ago. Its cost: for 15 minutes
      # after Prometheus itself was down, an older failure series looks new and fires once more.
      # alert_rules_test.yml replays both cases through promtool.
      - alert: RayServeReloadFailures
        expr: |
          sum by (replica, scope) (increase(ray_examlops_reload_total{status!="success"}[15m])) > 0
          or
          sum by (replica, scope) (
            ray_examlops_reload_total{status!="success"}
            unless ray_examlops_reload_total{status!="success"} offset 15m
          ) > 0
        for: 0m
        labels:
          severity: warning
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#rayservereloadfailures"
          summary: "A Ray Serve model reload failed on replica {{ $labels.replica }}"
          description: "At least one {{ $labels.scope }} reload failed on replica {{ $labels.replica }} in the last 15 minutes; the models keep serving their previous versions."

      - alert: SLOErrorBudgetFastBurn
        # Burn rate is a RATIO over a RATIO: the observed error ratio divided by the error
        # budget (1 - SLO). Dividing an error *rate* by "budget per second" instead compares
        # errors/second against a fraction/second, which is not a burn rate and is not even
        # dimensionless — one single error anywhere in the window scored 144000x and paged.
        # 14.4 x 0.005 = 0.072. The repo's own rule generator (examlops.slo) has always done
        # it this way; only this hand-written copy did not.
        # Divided by the 0.5 % budget so the value IS the burn rate — the same quantity the
        # summary and the description speak in. It used to yield the error ratio, which
        # `humanize` renders with SI prefixes: a 16x burn printed as "80m×" against a summary
        # reading "> 14.4×". The threshold is unchanged in meaning (0.072 = 14.4 x 0.005).
        expr: |
          sum(rate(ray_examlops_predict_requests_total{status=~"error|timeout|deadline_exceeded"}[1h]))
          / clamp_min(sum(rate(ray_examlops_predict_requests_total{status=~"success|error|timeout|deadline_exceeded"}[1h])), 0.001)
          / 0.005
          > 14.4
        for: 5m
        labels:
          severity: critical
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#sloerrorbudgetfastburn"
          summary: "SLO error budget burn rate > 14.4× (1 h window)"
          description: "Error budget burn rate is {{ $value | humanize }}×. At this rate the 30-day 0.5% budget is gone in ~50 hours."

      - alert: SLOErrorBudgetSlowBurn
        # 3 x 0.005 = 0.015. See SLOErrorBudgetFastBurn above for why this is a ratio.
        # As above: the value is the burn rate (0.015 = 3 x the 0.5 % budget).
        expr: |
          sum(rate(ray_examlops_predict_requests_total{status=~"error|timeout|deadline_exceeded"}[6h]))
          / clamp_min(sum(rate(ray_examlops_predict_requests_total{status=~"success|error|timeout|deadline_exceeded"}[6h])), 0.001)
          / 0.005
          > 3
        for: 60m
        labels:
          severity: warning
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#sloerrorbudgetslowburn"
          summary: "SLO error budget burn rate > 3× (6 h window)"
          description: "Error budget burn rate is {{ $value | humanize }}× over the last 6 hours."

      # The inference router's retries (serving/inference_pipeline). Ray counters cannot start
      # at 0, so each alert has a second arm for a series that did not exist a window ago; see
      # RayServeReloadFailures. alert_rules_test.yml replays both.
      - alert: InferenceRetryBudgetSpent
        expr: |
          sum(increase(ray_examlops_router_retries_total{reason="budget_spent"}[10m])) > 0
          or
          sum(
            ray_examlops_router_retries_total{reason="budget_spent"}
            unless ray_examlops_router_retries_total{reason="budget_spent"} offset 10m
          ) > 0
        for: 0m
        labels:
          severity: warning
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#inferenceretrybudgetspent"
          summary: "The inference router stopped retrying: its retry budget is spent"
          description: "Model-server calls are failing often enough that the router refuses further retries so as not to multiply the load. Failing requests are answered with their first error."

      - alert: InferenceReplicasLost
        expr: |
          sum(increase(ray_examlops_router_retries_total{reason="replica_lost"}[15m])) > 0
          or
          sum(
            ray_examlops_router_retries_total{reason="replica_lost"}
            unless ray_examlops_router_retries_total{reason="replica_lost"} offset 15m
          ) > 0
        for: 0m
        labels:
          severity: warning
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#inferencereplicaslost"
          summary: "A model-server replica died with requests in flight"
          description: "The router retried requests whose replica was lost in the last 15 minutes. Once is a restart; repeatedly is a crashing replica (memory, or one request that kills it)."

      # The scrape answers but the platform's own series are missing: every serving alert and SLO
      # panel is blind while inference may be fine. Seen on a live install where Ray's metrics
      # were switched off with tracing (OTEL_SDK_DISABLED=true, see the runbook); the scrape-
      # failure alert RayServeTargetDown cannot see this, because the scrape itself succeeds.
      - alert: RayServeMetricsMissing
        expr: absent(ray_examlops_models_loaded) and on() (up{job="ray_serve"} == 1)
        for: 10m
        labels:
          severity: critical
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#rayservemetricsmissing"
          summary: "Ray Serve is scraped but exports none of the platform's serving metrics"
          description: "ray-serving:8080 answers, but ray_examlops_models_loaded has been absent for 10 minutes: serving alerts and SLOs are blind."

  # ── Serving gateway (ADR 0126; Compose profile `gateway`) ─────────────────────
  # Found by DNS (prometheus.yml), so these select nothing where the gateway is not deployed.
  - name: examlops-gateway
    rules:
      - alert: ServingGatewayDown
        expr: up{job=~"gateway|gateway_authz"} == 0
        for: 2m
        labels:
          severity: critical
          service: gateway
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servinggatewaydown"
          summary: "Serving gateway component {{ $labels.job }} is down"
          description: "No scrape of {{ $labels.instance }} for 2 minutes. Envoy down: clients get connection errors. gateway-authz down: every request is refused with 503 (the gateway fails closed)."

      - alert: ServingGatewayAuthorizationFailing
        expr: sum(rate(envoy_http_ext_authz_error{envoy_http_conn_manager_prefix="serving"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: gateway
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servinggatewayauthorizationfailing"
          summary: "The gateway cannot get authorization decisions"
          description: "{{ printf \"%.2f\" $value }} requests/s get no answer from gateway-authz and are refused with 503."

      - alert: ServingGatewayCredentialStoreUnavailable
        expr: sum(rate(examlops_gateway_decisions_total{status="503"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: gateway
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servinggatewaycredentialstoreunavailable"
          summary: "gateway-authz cannot read the platform store"
          description: "{{ printf \"%.2f\" $value }} requests/s refused with 503: keys not seen in the last minute, or a model's project, could not be read."

      - alert: ServingGatewayHighErrorRate
        expr: |
          sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix="serving",envoy_response_code_class="5"}[5m]))
          / clamp_min(sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix="serving"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servinggatewayhigherrorrate"
          summary: "More than 5 % of gateway answers are 5xx"
          description: "{{ $value | humanizePercentage }} of requests through the gateway got a 5xx over 10 minutes."

      # The gateway ejects a model server that stops answering (a `/ready` probe every 5 s, out
      # after two failures) — which is the point, and also why nobody would otherwise notice that
      # inference is being served by fewer pods than the deployment thinks it has.
      - alert: ServingEndpointsUnhealthy
        expr: |
          (envoy_cluster_membership_healthy{envoy_cluster_name=~"ray_serving|ray_serving_grpc"}
           < envoy_cluster_membership_total{envoy_cluster_name=~"ray_serving|ray_serving_grpc"})
          and envoy_cluster_membership_healthy{envoy_cluster_name=~"ray_serving|ray_serving_grpc"} > 0
        for: 5m
        labels:
          severity: warning
          service: gateway
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servingendpointsunhealthy"
          summary: "The gateway is not using every model-server endpoint"
          description: "{{ $value }} of {{ $labels.envoy_cluster_name }}'s endpoints are healthy: the rest failed their health check and are getting no inference. Capacity is lower than the deployment suggests."

      # The same clusters as ServingEndpointsUnhealthy, and that is not cosmetic: the warning
      # excludes the total outage (`healthy > 0`) so the two do not double-fire, so anything this
      # selector omits has no critical alert at all. `ray_serving_grpc` was omitted until
      # 2026-09-15, leaving a complete gRPC serving outage silent on both.
      - alert: ServingNoHealthyEndpoints
        expr: |
          envoy_cluster_membership_healthy{envoy_cluster_name=~"ray_serving|ray_serving_grpc"} == 0
          and envoy_cluster_membership_total{envoy_cluster_name=~"ray_serving|ray_serving_grpc"} > 0
        for: 2m
        labels:
          severity: critical
          service: gateway
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servingnohealthyendpoints"
          summary: "No model-server endpoint is answering the gateway's health check"
          description: "Every endpoint of {{ $labels.envoy_cluster_name }} failed `/ready`. Envoy's panic threshold keeps sending requests rather than refusing them, so callers see the model server's own errors — not a gateway 503."

      - alert: ServingGatewayAtCeiling
        expr: sum(rate(envoy_http_local_rate_limit_rate_limited{envoy_local_http_ratelimit_prefix="serving_ceiling"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/serving/#servinggatewayatceiling"
          summary: "The gateway's own request ceiling is refusing traffic"
          description: "{{ printf \"%.2f\" $value }} requests/s refused with 429 by the whole-gateway ceiling (not a tenant quota)."

  # ── Dataplane bus Bridge ──────────────────────────────────────────────────────────
  - name: examlops-dataplane-bus
    rules:

      # On `up`, not on `dataplane_bus_bridge_up`. The bridge sets its own gauge to 1 while it runs
      # and never sets it to 0 — it cannot, being dead — so the series goes stale instead, and
      # `dataplane_bus_bridge_up == 0` matched nothing at exactly the moment the alert was for. The
      # generic `TargetDown` did still fire, three minutes later and without the service label.
      - alert: DataplaneBusBridgeDown
        expr: up{job="dataplane_bus_bridge"} == 0
        for: 2m
        labels:
          severity: critical
          service: dataplane-bus
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/bus/#bus-bridge-down"
          summary: "Dataplane bus bridge is offline"
          description: "The bridge has been unreachable for 2 min — inference requests from the bus are failing."

      - alert: DataplaneBusHighErrorRate
        expr: |
          sum(rate(dataplane_bus_inference_errors_total[5m]))
          / clamp_min(sum(rate(dataplane_bus_inferences_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
          service: dataplane-bus
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/bus/#bus-bridge-error-rate"
          summary: "Dataplane bus inference error rate > 5%"
          description: "Bridge inference error rate is {{ $value | humanizePercentage }} over the last 5 min."

      - alert: DataplaneBusHighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by(le) (rate(dataplane_bus_inference_latency_seconds_bucket[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          service: dataplane-bus
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/bus/#bus-bridge-latency"
          summary: "Dataplane bus p99 latency > 500 ms"
          description: "Dataplane bus p99 inference latency is {{ $value | humanizeDuration }}."

      # The bridge replies on the bus before it writes drift/input telemetry (plan P0.5). That
      # keeps a slow or broken database off the inference path — and would hide it completely,
      # because inferences keep succeeding while drift detection silently loses its input.
      - alert: DataplaneBusTelemetryWritesFailing
        expr: sum(increase(dataplane_bus_telemetry_persist_failures_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: dataplane-bus
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/bus/#bus-telemetry-writes-failing"
          summary: "Dataplane bus bridge cannot write inference telemetry"
          description: "{{ $value | humanize }} drift/input-embedding writes failed in 10 min. Inference is unaffected, but drift detection is losing samples; check the platform datastore."

      - alert: DataplaneBusTelemetryDropping
        expr: sum(increase(dataplane_bus_telemetry_dropped_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: dataplane-bus
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/bus/#bus-telemetry-dropping"
          summary: "Dataplane bus bridge is dropping inference telemetry"
          description: "The telemetry spool is full ({{ $value | humanize }} records dropped in 10 min): the datastore cannot keep up with bus traffic. Raise DATAPLANE_BUS_TELEMETRY_QUEUE_MAX only after fixing write latency."

  # ── Control Plane ─────────────────────────────────────────────────────────────
  - name: examlops-control-plane
    rules:

      # Asynchronous commands (plan P1.2): a buried command is a retrain that will not happen
      # unless someone acts; a queue that only grows means dispatch is failing or starved.
      # The drift evaluator (plan P2.4b) runs every CONTROL_PLANE_DRIFT_EVAL_SECONDS. Failing
      # repeatedly, it announces no drift change at all; a single failure is a blip.
      - alert: DriftEvaluationFailing
        expr: sum(increase(examlops_drift_evaluation_errors_total[10m])) > 3
        for: 5m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#driftevaluationfailing"
          summary: "The control plane cannot evaluate prediction drift"
          description: "Drift evaluations keep failing, so no drift.status_changed or alert.drift event is sent. The control-plane log says why."

      - alert: ControlPlaneCommandDead
        expr: sum(increase(control_plane_command_outcomes_total{outcome="dead"}[15m])) > 0
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#controlplanecommanddead"
          summary: "An asynchronous control-plane command exhausted its attempts"
          description: "{{ $value | humanize }} command(s) went dead in 15 min. `exa commands list --state dead` shows them and their last error."

      # A command can be given up on while a dispatch that was merely slow is still in flight; when
      # it lands, Prefect runs the job the platform has already written off. The control plane asks
      # Prefect on every burial, so this is the platform telling on itself rather than an operator
      # having to go and look.
      # The precursor to the burial below: the training started and the platform could not write
      # it down. It self-heals (the retry carries the same Prefect idempotency key and gets the same
      # run back), so this is a warning about the datastore, not about the retrain — but a run that
      # stays unrecorded across every attempt is exactly how a command ends up dead with a live run.
      # `increase()` alone would miss this. The counter is labelled by model and dataset, so the
      # first `dispatched_unrecorded` for a model arrives as a NEW series already at 1, with no
      # earlier sample to subtract from — and for most deployments that first occurrence is the
      # only one there will ever be. The second clause is the platform's idiom for exactly that
      # (see InferenceReplicasLost, InferenceRetryBudgetSpent, RayServeReloadFailures): a series
      # that exists now and did not a window ago.
      - alert: RetrainDispatchedButNotRecorded
        expr: |
          sum(increase(examlops_retrain_requests_total{outcome="dispatched_unrecorded"}[15m])) > 0
          or
          sum(
            examlops_retrain_requests_total{outcome="dispatched_unrecorded"}
            unless examlops_retrain_requests_total{outcome="dispatched_unrecorded"} offset 15m
          ) > 0
        for: 0m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#retraindispatchedbutnotrecorded"
          summary: "A retrain started but the platform could not record it"
          description: "{{ printf \"%.0f\" $value }} retrain(s) reached Prefect and then failed their bookkeeping write. The training is running; the command shows failed and is being retried against the same idempotency key. Check the datastore."

      - alert: ControlPlaneDeadCommandLeftARun
        expr: increase(examlops_control_plane_dead_commands_with_run_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#controlplanedeadcommandleftarun"
          summary: "A command was given up on, but Prefect is running it"
          description: "{{ printf \"%.0f\" $value }} dead command(s) have a Prefect flow run. The training is happening with nothing pointing at it: find the run before anyone resubmits, or a resubmission trains twice."

      - alert: ControlPlaneCommandBacklog
        expr: max(control_plane_command_queue_depth) > 20
        for: 15m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#controlplanecommandbacklog"
          summary: "Asynchronous command backlog is not draining"
          description: "{{ $value }} commands have waited 15 min. Check /health (dispatch, admission) and the command workers."

      # Event backbone (plan P2.7, ADR 0124). The outbox guarantees nothing is lost while the
      # broker is down; these say when "not lost yet" has become "not delivered".
      - alert: EventOutboxStalled
        expr: max(examlops_event_outbox_oldest_pending_age_seconds) > 300
        for: 5m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/events/#eventoutboxstalled"
          summary: "Events are waiting in the outbox instead of reaching the backbone"
          description: "The oldest unpublished event has waited {{ $value | humanizeDuration }}. /health shows event_relay_error; `exa events stats` shows the backlog. Serving and other consumers are acting on stale state."

      - alert: EventOutboxPoison
        expr: max(examlops_event_outbox_poison) > 0
        for: 5m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/events/#eventoutboxpoison"
          summary: "Outbox events exhausted their publish attempts"
          description: "{{ $value }} event(s) will not be retried (EXAMLOPS_EVENT_MAX_ATTEMPTS). Their last_error in event_outbox says why; `exa events stats` counts them."

      - alert: EventRelayFailing
        expr: sum(rate(examlops_event_relay_cycle_errors_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/events/#eventrelayfailing"
          summary: "The control plane's event relay fails every cycle"
          description: "The publisher is misconfigured or the broker is unreachable (EXAMLOPS_EVENT_PUBLISHER, EXAMLOPS_NATS_URL). Events are safe in the outbox and will be relayed once it recovers."

      # The consumer-lag and dead-letter gauges below are refreshed from JetStream by the relay
      # loop, and a failed read deliberately keeps their last values — zero lag is the reading
      # that means "healthy", so an unreachable broker must not be able to produce it. The cost is
      # that those gauges then hold numbers of unknown age. This is the alert that says so, and it
      # is why EventConsumerLagging and EventDeadLettered must not be trusted while it fires.
      - alert: EventBackboneMetricsUnreadable
        expr: increase(examlops_event_backbone_read_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/events/#eventbackbonemetricsunreadable"
          summary: "Control plane cannot read JetStream consumer statistics"
          description: "The consumer-lag and dead-letter gauges are stale, so EventConsumerLagging and EventDeadLettered cannot be trusted. The backbone itself may be fine — this is about reading it."

      - alert: EventConsumerLagging
        expr: max by (consumer) (examlops_event_consumer_pending) > 1000
        for: 15m
        labels:
          severity: warning
          service: event-backbone
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/events/#eventconsumerlagging"
          summary: "Event consumer {{ $labels.consumer }} is falling behind"
          description: "{{ $value }} events not yet delivered to {{ $labels.consumer }} for 15 min. Check that its process is running; events older than the stream retention (EXAMLOPS_NATS_MAX_AGE_SECONDS) are lost to it."

      - alert: EventDeadLettered
        expr: max by (consumer) (delta(examlops_event_dlq_messages[15m])) > 0
        labels:
          severity: warning
          service: event-backbone
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/events/#eventdeadlettered"
          summary: "Consumer {{ $labels.consumer }} parked an event it could not handle"
          description: "`exa events tail --dlq {{ $labels.consumer }}` shows the event and the error. The consumer kept going; the parked event's effect did not happen."

      - alert: ControlPlaneDown
        expr: up{job="control_plane"} == 0
        for: 2m
        labels:
          severity: critical
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#controlplanedown"
          summary: "Control plane is down"
          description: "control_plane scrape target has been unreachable for 2 min — retrains and approvals are blocked."

      # A dropped audit write is a record-keeping incident, not a warning: the action happened
      # and is absent from the log. The hash chain cannot show it — it is computed over the rows
      # that exist, so a missing event leaves a perfectly valid chain — which is why this counter
      # is the only signal there is. `increase() > 0` because ONE lost event is already the
      # incident; there is no acceptable rate.
      - alert: AuditEventsDropped
        expr: increase(examlops_audit_events_dropped_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#auditeventsdropped"
          summary: "Audit events were lost — the log is incomplete for this window"
          description: "{{ $value }} '{{ $labels.action }}' event(s) could not be written. Those actions took place and are missing from the audit trail, so any coverage or completeness statement about this window — the EU AI Act Art. 12 figure included — is unsound for it."

      - alert: ApprovalsStale
        expr: examlops_approval_age_oldest_seconds > 86400
        for: 30m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#approvalsstale"
          summary: "Oldest pending approval > 24 h"
          description: "An approval request has been waiting {{ $value | humanizeDuration }}."

      - alert: ApprovalsStaleUrgent
        expr: examlops_approval_age_oldest_seconds > 259200
        for: 15m
        labels:
          severity: critical
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#approvalsstaleurgent"
          summary: "Oldest pending approval > 72 h (CRITICAL)"
          description: "An approval has been waiting {{ $value | humanizeDuration }} and will be auto-expired."

      - alert: PendingApprovalQueueLarge
        expr: examlops_approvals_pending > 10
        for: 5m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#pendingapprovalqueuelarge"
          summary: "Approval queue > 10 pending"
          description: "{{ $value }} approvals are pending — operator review may be backlogged."

      # The three alerts above are only as good as the values they select, and both gauges are read
      # from the approval store at scrape time. If that read fails the gauges keep their last known
      # values — deliberately, because the alternative is publishing a fresh zero, which is what
      # "no approvals pending" looks like. Stale values cannot be trusted for long, so the failed
      # read is alerted on directly.
      - alert: ApprovalMetricsUnreadable
        expr: increase(examlops_metrics_scrape_errors_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#approvalmetricsunreadable"
          summary: "Control plane cannot read its approval store during scrapes"
          description: "The approval gauges are stale, so ApprovalsStale and PendingApprovalQueueLarge cannot be trusted."

      - alert: HighRetrainErrorRate
        expr: |
          sum(rate(examlops_retrain_requests_total{outcome="error"}[15m]))
          / clamp_min(sum(rate(examlops_retrain_requests_total{outcome=~"success|error"}[15m])), 0.001)
          > 0.20
        for: 10m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#highretrainerrorrate"
          summary: "Retrain error rate > 20%"
          description: "{{ $value | humanizePercentage }} of retrain requests are failing in the last 15 min."

      - alert: PrefectCircuitBreakerOpen
        expr: increase(examlops_prefect_circuit_breaker_opens_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#prefectcircuitbreakeropen"
          summary: "Prefect circuit breaker OPENED"
          description: "The Prefect gateway circuit breaker has opened — control plane is fast-failing retrain requests."

      - alert: PrefectRetryRateHigh
        expr: rate(examlops_prefect_retries_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#prefectretryratehigh"
          summary: "Prefect retry rate > 0.1/s"
          description: "Control plane is retrying Prefect calls at {{ $value | humanize }}/s — Prefect may be degraded."

      - alert: RetrainDurationP99High
        expr: |
          histogram_quantile(0.99,
            sum by(le) (rate(examlops_retrain_duration_seconds_bucket[30m]))
          ) > 300
        for: 15m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#retraindurationp99high"
          summary: "Retrain dispatch p99 > 5 min"
          description: "Scheduling a retrain is taking {{ $value | humanizeDuration }} at p99."

      - alert: ManyApprovalsAutoExpired
        expr: increase(examlops_approvals_expired_total[1h]) > 5
        for: 0m
        labels:
          severity: warning
          service: control-plane
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/control-plane/#manyapprovalsautoexpired"
          summary: "{{ $value }} approvals auto-expired in 1 h"
          description: "High auto-expiry volume — operators may not be reviewing approvals or APPROVAL_EXPIRY_HOURS is too short."

  # ── Dataplane (ADR 0130) ────────────────────────────────────────────────────────
  - name: examlops-dataplane
    rules:
      - alert: DataplaneDown
        expr: up{job="dataplane"} == 0
        for: 2m
        labels: {severity: critical, service: dataplane}
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/dataplane/#dataplanedown"
          summary: "Dataplane service is down"
          description: "No scrape of dataplane:8010 for 2 minutes; scheduled pulls are not running."
      - alert: DataplaneSourceStale
        # Stale = no successful pull for more than twice the source's own schedule (spec; final
        # review I10 — it was a fixed 2 days, which never fires for a 15m source and pages for
        # a weekly one). `dataplane_source_schedule_seconds` exists only for enabled sources with
        # a parseable schedule (the service's `_freshness_collector`), so an on-demand or
        # disabled source can never match. Both series carry the same labels, so default
        # one-to-one matching pairs each source's freshness with its own schedule.
        expr: dataplane_source_freshness_seconds > 2 * dataplane_source_schedule_seconds
        for: 30m
        labels: {severity: warning, service: dataplane}
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/dataplane/#dataplanesourcestale"
          summary: "Dataplane source {{ $labels.source }} is stale"
          description: "No successful pull for {{ $value | humanizeDuration }}, more than twice its schedule; check `exa dataplane pulls --source {{ $labels.source }}`."
      - alert: DataplanePullFailing
        # No `absent()` arm needed here (fix round 1): every registered source always gets a
        # `dataplane_source_up` series — the collector (examlops.dataplane.service.app
        # `_freshness_collector`) now emits 0 for a source whose own catalog read raises, instead
        # of skipping it. So absence of the whole series means "no such source", not "outage",
        # and a catalog-wide outage is what DataplaneCatalogUnavailable below is for.
        expr: dataplane_source_up == 0
        for: 1h
        labels: {severity: warning, service: dataplane}
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/dataplane/#dataplanepullfailing"
          summary: "Dataplane pulls of {{ $labels.source }} are failing"
          description: "The latest pull failed; see `exa dataplane pulls --source {{ $labels.source }}`."
      - alert: DataplaneCatalogUnavailable
        # Always-present gauge (fix round 1): `dataplane_source_up` only has series for
        # *registered* sources, so it cannot see a catalog that cannot be listed at all — an
        # install with zero sources would otherwise look identical to one whose catalog is down.
        expr: dataplane_catalog_up == 0
        for: 10m
        labels: {severity: warning, service: dataplane}
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/dataplane/#dataplanecatalogunavailable"
          summary: "Dataplane cannot read its source catalog"
          description: "list_source_defs() has failed for 10 minutes — every per-source gauge (dataplane_source_up, freshness) is blind until the catalog recovers; see the dataplane service logs."

  # ── Platform-wide infrastructure ──────────────────────────────────────────────
  - name: examlops-platform
    rules:

      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          service: platform
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/platform/#targetdown"
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) unreachable for 5 min."

      # `service: serving`, matching the alerts it is meant to silence. Alertmanager's second
      # inhibit rule names this alert as a source that mutes derived symptoms, and that rule
      # requires `equal: ['cluster','service']` — so while this carried `service: platform` and
      # every Ray Serve symptom carried `service: serving`, the muting could never match and the
      # rule was inert for the serving plane. Routing is by severity and alertname, so this
      # changes grouping and inhibition only.
      - alert: RayServeTargetDown
        expr: up{job="ray_serve"} == 0
        for: 3m
        labels:
          severity: critical
          service: serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/platform/#rayservetargetdown"
          summary: "Ray Serve metrics endpoint down"
          description: "Cannot scrape Ray Serve at {{ $labels.instance }} — inference metrics are dark."

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 3m
        labels:
          severity: warning
          service: platform
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/platform/#lokidown"
          summary: "Loki is down — logs not being stored"
          description: "Loki has been unreachable for 3 min."

      - alert: TempoDown
        expr: up{job="tempo"} == 0
        for: 3m
        labels:
          severity: warning
          service: platform
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/platform/#tempodown"
          summary: "Tempo is down — traces not being stored"
          description: "Tempo has been unreachable for 3 min."

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 3m
        labels:
          severity: warning
          service: platform
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/platform/#alertmanagerdown"
          summary: "Alertmanager is down — notifications silenced"
          description: "Alertmanager has been unreachable for 3 min."

  # ── vLLM / LLM & VLM serving (Track V, ADR 0107) ─────────────────────────────
  # Metric names are vLLM's own (docs.vllm.ai/en/stable/design/metrics). These only fire
  # where a vLLM endpoint is actually scraped — on a CPU-only deployment the series are
  # simply absent and nothing alerts.
  - name: examlops-vllm
    rules:

      - alert: VLLMEndpointDown
        expr: up{job=~"vllm|fleet"} == 0
        for: 5m
        labels:
          severity: critical
          service: llm-serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/llm/#vllmendpointdown"
          summary: "vLLM endpoint {{ $labels.instance }} is unreachable"
          description: "Prometheus has failed to scrape it for 5 min — inference is likely failing."

      # KV-cache pressure is the leading indicator of an OOM kill: it saturates before the
      # server dies, so this buys time to shed load or scale, unlike a post-hoc crash alert.
      - alert: VLLMKVCacheNearFull
        expr: max(vllm:kv_cache_usage_perc) > 0.9
        for: 10m
        labels:
          severity: warning
          service: llm-serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/llm/#vllmkvcachenearfull"
          summary: "vLLM KV-cache usage above 90%"
          description: "KV-cache at {{ $value | humanizePercentage }} — requests will start preempting."

      - alert: VLLMQueueBacklog
        expr: max(vllm:num_requests_waiting) > 20
        for: 10m
        labels:
          severity: warning
          service: llm-serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/llm/#vllmqueuebacklog"
          summary: "vLLM request queue backing up"
          description: "{{ $value }} requests waiting — the endpoint is saturated."

      - alert: VLLMHighTTFT
        expr: |
          histogram_quantile(0.95,
            sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: warning
          service: llm-serving
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/llm/#vllmhighttft"
          summary: "vLLM p95 time-to-first-token above 5s"
          description: "p95 TTFT is {{ $value }}s — users are waiting before the first token."

  # ── Delivery heartbeat (dead-man's-switch) ────────────────────────────────────
  # Always firing. Routed to the Alertmanager `heartbeat` receiver → external monitor.
  # If these pings STOP arriving, the whole Prometheus→Alertmanager→receiver path is
  # broken (item 3.4 / QW3). This is what proves alert *delivery*, not just liveness.
  - name: examlops-heartbeat
    rules:
      - alert: Watchdog
        expr: vector(1)
        for: 0m
        labels:
          severity: none
          service: heartbeat
        annotations:
          runbook_url: "https://mskazemi.com/ExaMLOps/runbooks/platform/#watchdog"
          summary: "Alerting pipeline heartbeat (always firing)"
          description: "If this stops reaching the external dead-man's-switch, alert delivery is down."

