# ExaMLOps enterprise reference values (Phase 1 item 1.1).
# Stateful dependencies live in HA Postgres + distributed MinIO. The control-plane defaults to one
# replica while its Prefect circuit breaker/runtime config remain process-local and multi-replica
# failover is unverified. Rate limits, retrain locks, and poller ownership use the coordinator.
# NO container_name pins, NO hostPath, NO privileged — pods are schedulable + replaceable anywhere.

global:
  imageRegistry: ""            # e.g. registry.example.org/ ; blank = docker hub-style
  imagePullSecrets: []
  # Cluster + tenant labels stamped into config (mirrors Prometheus external_labels).
  cluster: prod
  tenant: default

# ── shared secret (created out-of-band; NEVER templated with real values) ──────────────────────
# Provide a Kubernetes Secret with these keys and reference it here. The chart never embeds secrets.
existingSecret: examlops-secrets   # keys: CONTROL_PLANE_TOKEN or CONTROL_PLANE_CREDENTIALS_JSON,
                                   #       EXAMLOPS_POSTGRES_DSN,
                                   #       AGENT_API_KEY (legacy) or AGENT_API_KEYS_JSON,
                                   #       DASHBOARD_AGENT_API_KEY, AGENT_POSTGRES_DSN,
                                   #       one LLM credential,
                                   #       DASHBOARD_JWT_SECRET,
                                   #       DASHBOARD_SECRET_KEY, DASHBOARD_ADMIN_PASSWORD,
                                   #       DASHBOARD_VIEWER_PASSWORD, EXAMLOPS_SECRETS_KEYS, DATABASE_URL

# ── external managed state (referenced, not deployed by this chart) ────────────────────────────
postgres:
  # Recommended: CloudNativePG `Cluster` CR (3 instances, sync replicas). See README. The app reads
  # EXAMLOPS_POSTGRES_DSN from existingSecret; DATABASE_URL may separately configure MLflow.
  host: examlops-pg-rw          # CloudNativePG read-write service
  readHost: examlops-pg-ro
  database: examlops
minio:
  # Recommended: MinIO distributed mode (4+ nodes, erasure coding) or an S3-compatible service.
  endpoint: http://minio:9000
  bucket: examlops

ingress:
  enabled: true
  className: nginx
  host: examlops.example.org
  tls:
    enabled: true
    secretName: examlops-tls     # cert-manager-issued; TLS terminates here

# ── control plane (the write API — must scale + survive host loss) ─────────────────────────────
controlPlane:
  # Optional least-privilege Secret. Empty preserves the global existingSecret for upgrades.
  existingSecret: ""
  # Safe default while breaker state/runtime config remain local and failover is unverified.
  # Durable commands plus coordinator-backed rate limits, retrain locks, and poller leases are wired.
  replicaCount: 1
  image:
    repository: examlops-control-plane
    tag: ""                      # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  port: 8002
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  env:
    # Safe implemented defaults. Switch only after the selected external implementations are wired
    # into the control-plane call paths and their endpoint variables are present in the Secret.
    EXAMLOPS_COORDINATOR: db
    EXAMLOPS_EVENT_PUBLISHER: log
  extraEnv: []

dashboard:
  # Optional least-privilege Secret. Empty preserves the global existingSecret for upgrades.
  existingSecret: ""
  replicaCount: 2
  image:
    repository: examlops-dashboard
    tag: ""
    pullPolicy: IfNotPresent
  port: 8099
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  pdb:
    enabled: true
    minAvailable: 1
  # CLI Console (ADR 0119): where the dashboard keeps the `config.toml` its own `exa` runs use
  # and the file workspace path arguments are contained in (run history is already shared, in
  # the platform datastore). With more than one replica this must be a ReadWriteMany claim —
  # otherwise a config edit or an uploaded file is visible only to the pod that received it.
  # Empty → a per-pod emptyDir (lost on restart).
  cliState:
    existingClaim: ""

agent:
  # Optional least-privilege Secret. Empty preserves the global existingSecret for upgrades.
  existingSecret: ""
  replicaCount: 2
  image:
    repository: examlops-agent
    tag: ""
    pullPolicy: IfNotPresent
  port: 18004
  # The chart owns only the control-plane/dashboard/agent tiers. Point these at the managed
  # platform services available in the target namespace or network.
  serviceUrls:
    mlflow: http://mlflow:5000
    rayServe: http://ray-serving:8001
    prometheus: http://prometheus:9090
  extraEnv: []
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

# ── pod hardening applied to every tier ────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

# Spread replicas across nodes/zones so a host loss can't take a whole tier down.
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname

serviceAccount:
  create: true
  name: ""
