# ExaMLOps enterprise reference values (Phase 1 item 1.1).
# Stateful dependencies live in HA Postgres + distributed MinIO. The control-plane defaults to one
# replica while its Prefect circuit breaker/runtime config remain process-local and multi-replica
# failover is unverified. Rate limits, retrain locks, and poller ownership use the coordinator.
# NO container_name pins, NO hostPath, NO privileged — pods are schedulable + replaceable anywhere.

global:
  imageRegistry: ""            # e.g. registry.example.org/ ; blank = docker hub-style
  imagePullSecrets: []
  # Cluster + tenant labels stamped into config (mirrors Prometheus external_labels).
  cluster: prod
  tenant: default

# ── shared secret (created out-of-band; NEVER templated with real values) ──────────────────────
# Provide a Kubernetes Secret with these keys and reference it here. The chart never embeds secrets.
existingSecret: examlops-secrets   # keys: CONTROL_PLANE_TOKEN or CONTROL_PLANE_CREDENTIALS_JSON,
                                   #       EXAMLOPS_POSTGRES_DSN,
                                   #       AGENT_API_KEY (legacy) or AGENT_API_KEYS_JSON,
                                   #       DASHBOARD_AGENT_API_KEY, AGENT_POSTGRES_DSN,
                                   #       one LLM credential,
                                   #       DASHBOARD_JWT_SECRET,
                                   #       DASHBOARD_SECRET_KEY, DASHBOARD_ADMIN_PASSWORD,
                                   #       DASHBOARD_VIEWER_PASSWORD, EXAMLOPS_SECRETS_KEYS, DATABASE_URL

# ── external managed state (referenced, not deployed by this chart) ────────────────────────────
postgres:
  # Recommended: CloudNativePG `Cluster` CR (3 instances, sync replicas). See README. The app reads
  # EXAMLOPS_POSTGRES_DSN from existingSecret; DATABASE_URL may separately configure MLflow.
  host: examlops-pg-rw          # CloudNativePG read-write service
  readHost: examlops-pg-ro
  database: examlops
minio:
  # Recommended: MinIO distributed mode (4+ nodes, erasure coding) or an S3-compatible service.
  endpoint: http://minio:9000
  bucket: examlops

# ── site feature profile + data upgrades (ADR 0128) ────────────────────────────────────────────
site:
  # EXAMLOPS_FEATURES for every tier — which modules this centre runs. "" = every module (preset
  # full, the behaviour before site profiles). Generate from a site profile with
  # `exa modules render --target helm`, e.g. "preset:standard,+hpc".
  features: ""
upgrade:
  hook:
    # A pre-install/pre-upgrade Job that runs `exa upgrade apply` with the control-plane image, so
    # the datastore is at the new release's data format before any new pod starts. Online
    # migrations also apply on first open, so this matters for releases with offline ones.
    # Back up Postgres first (CloudNativePG scheduled backup / pg_dump) — the Job does not.
    enabled: false
    backoffLimit: 1
    activeDeadlineSeconds: 900

ingress:
  enabled: true
  className: nginx
  host: examlops.example.org
  tls:
    enabled: true
    secretName: examlops-tls     # cert-manager-issued; TLS terminates here

# ── control plane (the write API — must scale + survive host loss) ─────────────────────────────
controlPlane:
  # Optional least-privilege Secret. Empty preserves the global existingSecret for upgrades.
  existingSecret: ""
  # One by default. Shared state is wired (durable commands with atomic retrain dedup, crashed
  # claims taken over after CONTROL_PLANE_COMMAND_LEASE_SECONDS, coordinator-backed rate limits,
  # locks and leases, runtime settings in the datastore); with Postgres and NATS, /health reports
  # runtime.horizontal_scaling_safe. tests/integration/test_control_plane_failover_kind_live.py
  # crashes replicas mid-dispatch under load; run it on your cluster before raising this.
  replicaCount: 1
  image:
    repository: examlops-control-plane
    tag: ""                      # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  port: 8002
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  env:
    # Safe implemented defaults. Switch only after the selected external implementations are wired
    # into the control-plane call paths and their endpoint variables are present in the Secret.
    # The event publisher is set under `events` below, for every tier.
    EXAMLOPS_COORDINATOR: db
  extraEnv: []

dashboard:
  # Optional least-privilege Secret. Empty preserves the global existingSecret for upgrades.
  existingSecret: ""
  replicaCount: 2
  image:
    repository: examlops-dashboard
    tag: ""
    pullPolicy: IfNotPresent
  port: 8099
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  pdb:
    enabled: true
    minAvailable: 1
  # CLI Console (ADR 0119): where the dashboard keeps the `config.toml` its own `exa` runs use
  # and the file workspace path arguments are contained in (run history is already shared, in
  # the platform datastore). With more than one replica this must be a ReadWriteMany claim —
  # otherwise a config edit or an uploaded file is visible only to the pod that received it.
  # Empty → a per-pod emptyDir (lost on restart).
  cliState:
    existingClaim: ""

agent:
  # false = do not deploy the agent tier (the site runs without the `agent` module, ADR 0128).
  enabled: true
  # Optional least-privilege Secret. Empty preserves the global existingSecret for upgrades.
  existingSecret: ""
  replicaCount: 2
  image:
    repository: examlops-agent
    tag: ""
    pullPolicy: IfNotPresent
  port: 18004
  # The chart owns only the control-plane/dashboard/agent tiers. Point these at the managed
  # platform services available in the target namespace or network.
  serviceUrls:
    mlflow: http://mlflow:5000
    rayServe: http://ray-serving:8001
    prometheus: http://prometheus:9090
  extraEnv: []
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

# ── event backbone (ADR 0124) ──────────────────────────────────────────────────────────────────
# Every platform change is written to the transactional outbox with the change itself. `log` keeps
# events there (the control plane's relay only logs them): nothing consumes them. `nats` makes the
# control plane relay them to NATS JetStream, where the followers below and the dashboard's live
# stream read them. NATS is not deployed by this chart, like Postgres: point natsUrl at it.
events:
  publisher: log                 # log | nats
  natsUrl: ""                    # required with publisher nats, e.g. nats://nats.messaging:4222
  followers:
    # Durable consumers, one pod each (a JetStream durable consumer; no Service, no ingress).
    autopilot:
      # `exa autopilot follow`: runs a model's autopilot cycle when its training run completes.
      # Sends the control plane AUTOPILOT_CONTROL_PLANE_TOKEN from the control-plane Secret when
      # that key exists (give it only the `retrain` scope), else its CONTROL_PLANE_TOKEN.
      enabled: false
      mlflowTrackingUri: http://mlflow:5000
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
    skipperWatch:
      # `python -m skipper.watch --daemon`: raises alert.retrain the moment a training run fails.
      enabled: false
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}

# ── serving gateway (plan P4.4, ADR 0126) ────────────────────────────────────────────────────────
# The one front door to the serving plane, as Compose runs it under the `gateway` profile: Envoy
# (credential → per-tenant quota → body limit → the model server, with timeouts and a retry budget)
# and the authorization service that checks virtual keys and IdP tokens. Only inference is routed.
# The Envoy configuration is files/gateway-envoy.yaml, byte-identical to Compose's.
gateway:
  enabled: false
  replicaCount: 2
  image:
    repository: envoyproxy/envoy
    tag: "v1.39.1"
    digest: "sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4"
    pullPolicy: IfNotPresent
  # The model server the gateway fronts (not deployed by this chart), like agent.serviceUrls.
  upstream:
    host: ray-serving
    port: 8001
    grpcPort: 8081             # the model server's Open Inference Protocol gRPC port (ADR 0126)
  tenantRpm: 600               # EXAMLOPS_GATEWAY_TENANT_RPM: per-tenant requests per minute
  keyCacheSeconds: 60          # EXAMLOPS_GATEWAY_KEY_CACHE_SECONDS
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
  pdb:
    enabled: true
    minAvailable: 1
  ingress:
    host: ""                   # e.g. inference.example.org: its own host on the chart's Ingress
  authz:
    replicaCount: 2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}

# ── secrets manager: OpenBao (ADR 0011) ──────────────────────────────────────────────────────────
# Off by default. When enabled the chart deploys one file-backed OpenBao server (a StatefulSet on a
# PersistentVolumeClaim, ClusterIP only - never an Ingress) and points the control plane, dashboard
# and agent at it (EXAMLOPS_VAULT_ADDR). Nothing here holds a token: the tiers read it from an
# existing Secret you create after initialising the server (docs/runbooks/openbao.md). The server
# starts sealed and uninitialised; until a token exists the tiers keep resolving secrets through the
# local store and the environment, unless `strict` is set. The listener is plain HTTP inside the
# cluster - terminate TLS with a service mesh, or leave it off and keep the NetworkPolicy on.
secrets:
  openbao:
    enabled: false
    image:
      repository: openbao/openbao
      tag: "2.6.2"
      digest: "sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641"
      pullPolicy: IfNotPresent
    strict: false                # EXAMLOPS_VAULT_STRICT: an unreachable vault fails the read
    tokenSecret:                 # the Secret holding the client token (you create it)
      name: examlops-openbao-token
      key: token
    storage:
      size: 1Gi
      storageClassName: ""       # empty = the cluster default
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}

# ── workload identities (ADR 0125) ──────────────────────────────────────────────────────────────
# Each tier proves who it is to the control plane with a five-minute JWT-SVID from SPIRE, instead of
# only a static secret. SPIRE itself (server, node agents, the SPIFFE CSI driver and the controller
# manager) is cluster infrastructure, like Postgres: install it once with SPIRE's hardened Helm chart
# (https://spiffe.io/docs/latest/spire-helm-charts-hardened-about/). This chart then adds a
# ClusterSPIFFEID per tier and a spiffe-helper sidecar that reaches the Workload API through the CSI
# driver; no hostPath, no privileges. Static credentials keep working alongside.
workloadIdentity:
  enabled: false
  trustDomain: ""                # required when enabled; the SPIRE server's trust domain
  csiDriver: csi.spiffe.io
  socketPath: /spiffe-workload-api/spire-agent.sock   # the Workload API inside the CSI volume
  jwtTtl: 5m
  clusterSPIFFEID:
    # One ClusterSPIFFEID per tier, for spire-controller-manager (needs its CRDs). false = register
    # the IDs yourself: spiffe://<trustDomain>/ns/<namespace>/<release>-examlops/<tier>, selected by
    # the pod labels app.kubernetes.io/{name,instance,component}.
    create: true
    # The controller manager acts only on its own class. SPIRE's hardened chart names it
    # <its namespace>-<its release>, so the documented install (release `spire` in `spire-mgmt`) is
    # spire-mgmt-spire. A wrong class is ignored silently: no entry, and no token for any tier.
    # "" only for a controller manager that watches classless objects (watchClassless: true).
    className: spire-mgmt-spire
  helper:
    image:
      repository: ghcr.io/spiffe/spiffe-helper
      tag: "0.11.0"
      digest: "sha256:1c92e5998ad3621e3323f25aabe40f5a88ba730ee0edb248aa8c943ca504e8a2"
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
  # What each calling tier may do at the control plane: the same principal and scopes as its
  # static credential, so commands and the audit name the same service either way.
  callers:
    dashboard: {principal: dashboard, scopes: [read, write]}
    agent: {principal: skipper, scopes: [read, retrain]}
    autopilot-follower: {principal: autopilot, scopes: [read, retrain]}

# ── pod hardening applied to every tier ────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

# Spread replicas across nodes/zones so a host loss can't take a whole tier down.
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname

serviceAccount:
  create: true
  name: ""

# ── network isolation (opt-in: needs a CNI that enforces NetworkPolicy, e.g. Calico/Cilium) ─────
# When enabled, every pod of this release is default-deny in BOTH directions, and only these flows
# are allowed: the ingress controller → dashboard + control-plane; dashboard → control-plane + agent;
# agent → control-plane; the monitoring namespace → control-plane /metrics; DNS; and each tier's
# egress to the services this chart does not deploy, by port (their addresses are site-specific).
# Opt-in because a wrong namespace label below silently cuts a working install off.
networkPolicy:
  enabled: false
  ingressController:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  monitoring:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: monitoring}
  # Destination ports outside the chart: Postgres 5432, Redis 6379, Prefect 4200, MLflow 5000,
  # MinIO/S3 9000, Ray Serve 8001, Prometheus 9090, Ollama 11434, HTTPS 443 (IdP, LLM APIs, S3).
  # With events.publisher nats, NATS (4222) is added to the control plane and the dashboard.
  egressPorts:
    controlPlane: [5432, 6379, 4200, 5000, 9000, 443]
    dashboard: [5432, 6379, 5000, 9000, 9090, 443]
    agent: [5432, 5000, 8001, 9090, 11434, 443]
    autopilotFollower: [4222, 5432, 5000, 9000]
    skipperWatch: [4222, 5432]
    gateway: [8001, 8081]           # the model server: REST (upstream.port) and gRPC (upstream.grpcPort)
    gatewayAuthz: [5432, 6379, 443] # the datastore (virtual keys), coordinator, IdP
  # Raw NetworkPolicyEgressRule entries appended to every tier (e.g. a CIDR-scoped database).
  extraEgress: []

# ── Prometheus Operator scrape config (needs the monitoring.coreos.com/v1 CRDs) ──────────────────
# Only the control plane serves /metrics (approval-gate and admission metrics); a ServiceMonitor
# for the other tiers would scrape a 404.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}        # add the label your Prometheus' serviceMonitorSelector matches, e.g. release: kube-prometheus-stack
  # Alert rules (a PrometheusRule): the platform's own, from files/alert_rules.yml, which is
  # Compose's alert_rules.yml byte for byte (every rule links to its runbook). The chart renders the
  # groups for what it deploys: examlops-control-plane always, examlops-gateway with the gateway.
  # Add others by name for services your Prometheus scrapes itself under the same job names
  # (e.g. examlops-serving for Ray Serve as job `ray_serve`). Needs the Prometheus Operator CRDs.
  prometheusRule:
    enabled: false
    labels: {}        # the label your Prometheus' ruleSelector matches
    extraGroups: []   # e.g. [examlops-serving, examlops-dataplane-bus, examlops-heartbeat]

# ── OpenTelemetry export (traces + metrics) ──────────────────────────────────────────────────────
# Every image runs under `opentelemetry-instrument`. With no collector it retries localhost:4317
# forever and logs an export error every few seconds, so export is OFF unless an endpoint is set
# (OTEL_SDK_DISABLED=true, the compose default). Set it to your collector, e.g.
# http://otel-collector.monitoring:4317, to turn tracing on for every tier.
otel:
  endpoint: ""
