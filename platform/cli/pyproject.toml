[build-system]
# >=77 is the floor for PEP 639 (`license` as an SPDX expression + `license-files`); pinned at
# the current stable so the published metadata is what this file says it is.
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "examlops"
version = "0.61.0"
requires-python = ">=3.12"
description = "ExaMLOps shared schemas and the `exa` operator CLI."
# The PyPI project page. The repo README links relatively into docs/, which PyPI cannot
# resolve, so the package carries its own; tests/unit/test_package_metadata.py keeps it honest.
readme = "README.md"
license = "Apache-2.0"
# A copy of the root LICENSE: PEP 639 forbids license-files outside the project directory.
# tests/unit/test_package_metadata.py fails if the two ever differ.
license-files = ["LICENSE"]
authors = [{ name = "Mohsen Seyedkazemi Ardebili" }]
keywords = ["mlops", "hpc", "slurm", "flux", "mlflow", "ray-serve", "model-registry", "llmops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "typer>=0.12",
    # Imported directly at module load by cli/_help.py, cli/commands/explain_command.py and
    # cli/commands/docs_cmd.py, which walk the click command tree that Typer builds. It used to
    # arrive transitively through typer; typer 0.27 declares no click dependency at all, so a
    # clean `pip install examlops` produced an `exa` that died on `import click` before printing
    # anything. Declared here because this package imports it, transitive or not.
    "click>=8.5.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    # Imported at module load by examlops.resilience (HTTP client + timeouts) — a hard
    # runtime dependency of the CLI, not optional.
    "httpx>=0.27",
    # Imported directly at module load by cli/_output.py, which renders every table, panel
    # and error the CLI prints. It currently arrives via typer, but so did click until typer
    # 0.27 dropped it; a package that imports a module declares it.
    "rich>=13.0",
    # The local encrypted secret store (examlops.secrets) is the documented fallback that
    # works with no running OpenBao, so Fernet is part of the default path, not an extra.
    # Undeclared, `exa secrets set` failed with an error whose own remedy — "python -c 'from
    # cryptography.fernet import Fernet ...'" — could not be run either.
    "cryptography>=43.0",
]

[project.optional-dependencies]
# Agent-native surface: expose `exa` capabilities to LLM agents / MCP clients.
# Lazily imported by `examlops.mcp.server`; the core CLI works without it.
mcp = [
    "fastmcp>=3.4",
]
# Statistical A/B analysis (`exa serve ab analyze`). Lazily imported by
# examlops.analysis.ab_stats; the rest of the CLI works without it.
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
]
# Declarative YAML/expression calculation providers (examlops.providers.expression).
# Lets a config-authored formula be evaluated safely without executing arbitrary code.
# Lazily imported; built-in Python providers work without it.
finops = [
    "simpleeval>=1.0",
]
# Identity federation (examlops.iam, ADR 0120 — and the examlops.oidc shim over it): verifying
# data-center IdP tokens, `exa auth login`, the dashboard's SSO and the control plane's federated
# bearer path. PyJWT is imported lazily, so the core CLI works without it.
oidc = [
    "pyjwt>=2.14.0",
]
# Whole-platform backup — object-store (MinIO/S3) tier + off-site replication
# (examlops.backup.objects_tier / remote). boto3 is lazily imported; the control-plane
# backup profile (SQLite + config tiers) works without it. The Postgres tier additionally
# needs the `pg_dump`/`pg_restore` binaries (postgresql-client) on PATH.
backup = [
    "boto3>=1.43.88",
]
# In-process vLLM engine (`engine.mode: inproc`) for offline batch scoring on a GPU host.
# NOT needed to *serve*: the production path (VLLMServerEngine, ADR 0107) talks HTTP to a
# `vllm serve` process, so the GPU dependency lives in that process, not in the CLI.
# Referenced by engines/__init__.py's error message and docs/guides/llm-serving-engines.md.
serving-vllm = [
    "vllm>=0.28.0",
]
# SGLang engine (RadixAttention, structured output). GPU host only; lazily imported.
serving-sglang = [
    "sglang>=0.4",
]
# Postgres datastore engine (EXAMLOPS_DB_BACKEND=postgres, enterprise-readiness item 0.1).
# psycopg is imported only by examlops.storage.pg, which is reached only when that env var
# selects the Postgres backend — the default SQLite path never touches it.
postgres = [
    "psycopg[binary]>=3.3.5",
    # Connection pooling. Opening a connection is free on SQLite and is not on Postgres, and
    # `get_db()` opens one per call. Optional on purpose: without it examlops.storage.pg opens an
    # unpooled connection per call — slower, still correct.
    "psycopg-pool>=3.3",
]
# Fairness & subgroup monitoring (ADR 0025). Fairlearn's MetricFrame computes the slice metrics
# when installed; without it a pure-Python path computes the same numbers (held to parity by
# tests/unit/test_fairness_engine.py), so `exa fairness` works on a bare install too.
fairness = [
    "fairlearn>=0.14",
]
# Presidio NER supplement for PII detection (ADR 0026 clause 1). examlops.guardrails always runs
# its own regex detectors (email/phone/SSN/credit-card/IBAN/IP); Presidio, when installed AND
# opted into (EXAMLOPS_GUARDRAIL_PII_NER=1), ADDS the one class of PII a regex cannot find — a
# person's name, a place — via spaCy NER. Off by default: unavailable or unconfigured degrades
# to regex-only, exactly today's behaviour. A spaCy model (e.g. en_core_web_lg, Presidio's own
# default) is a separate one-time install this extra does not pull in — see
# docs/guides/guardrails.md.
guardrails-presidio = [
    "presidio-analyzer>=2.2",
]
# pgvector vector store (EXAMLOPS_VECTOR_BACKEND=pgvector, ADR 0020). Same driver as the
# `postgres` extra, named separately because the two are independent choices: the vector store can
# run on pgvector while platform state stays on SQLite, and the reverse.
vector = [
    "psycopg[binary]>=3.3.5",
    "psycopg-pool>=3.3",
]
# Cross-host locks, idempotency, and rate limiting. Imported only when
# EXAMLOPS_COORDINATOR=redis selects this backend.
coordination = [
    "redis>=8.1.0",
]
# Event backbone (ADR 0124): NATS JetStream publisher + durable consumers. Lazily imported;
# the default `log` publisher needs nothing.
events = [
    "nats-py>=2.15",
]
# Synthetic data generation (`exa data synth`, Next-Gen 40 · A7, ADR 0042). SDV is lazily
# imported by examlops.synth.generators; without it a pure-python Gaussian-copula fallback
# keeps every subcommand — including the fidelity/privacy release gate — working offline.
synth = [
    # `examlops.synth` imports pandas at module scope and the generators need numpy. They were
    # missing from this extra, so `pip install 'examlops[synth]'` still could not run
    # `exa data synth fit` — it died on a raw ModuleNotFoundError traceback. Neither belongs in
    # the base CLI, which stays light enough to install on a login node.
    "pandas>=2.0",
    "numpy>=1.26",
    "sdv>=1.37",
]
# Dataplane (ADR 0130): one extra per connector's dependencies, plus `dataplane` = everything the
# service image needs. Each connector's `extra` attribute (examlops.dataplane.connectors.*) names
# one of these keys — tests/unit/test_dataplane_connector_contract.py asserts they match.
dataplane-sql = [
    "sqlalchemy>=2.0",
    "pyarrow>=25.0",
    # Same floor as the `postgres`/`vector` extras above — one version of psycopg across the file.
    "psycopg[binary]>=3.3.5",
    "pymysql>=1.2",
]
dataplane-files = [
    "fsspec>=2026.7",
    # No s3fs: S3 goes through pyarrow's native filesystem (examlops.dataplane.s3), because
    # s3fs's aiobotocore pin caps botocore below the workspace's boto3 floor — it can never lock.
    "httpx>=0.28",
    "pyarrow>=25.0",
    # fsspec's SFTP filesystem (the files connector's sftp:// scheme) needs paramiko.
    "paramiko>=5.0",
]
dataplane-kafka = [
    "confluent-kafka>=2.15",
    "pyarrow>=25.0",
]
# fastapi stays capped below 0.137 to match the root/pipelines/serving workspace pin: ray 2.55's
# `@serve.ingress` cloudpickles a FastAPI app and fastapi>=0.137 holds an unpicklable
# `_thread.lock`. This extra never touches Ray, but `uv.lock` resolves one version of fastapi for
# the whole workspace, so an uncapped floor here would make the lock unsatisfiable.
dataplane-service = [
    "fastapi>=0.136.3,<0.137",
    "uvicorn[standard]>=0.52.4",
    "prometheus-client>=0.20",
]
dataplane = [
    "examlops[dataplane-sql,dataplane-files,dataplane-kafka,dataplane-service]",
]

[project.scripts]
exa = "examlops.cli.main:app"

[project.urls]
Homepage = "https://mskazemi.com/ExaMLOps/"
Documentation = "https://mskazemi.com/ExaMLOps/"
Repository = "https://github.com/MSKazemi/ExaMLOps"
Issues = "https://github.com/MSKazemi/ExaMLOps/issues"
Changelog = "https://github.com/MSKazemi/ExaMLOps/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# D2 NIST AI RMF catalogue (and any other in-package data files) must ship in wheels.
examlops = [
    "governance/*.yaml",
    "events/event-contract.json",
    # ADR 0142 d4: the pinned KServe CRD schemas every KServe render is validated against.
    "serving/substrates/kserve_crds/*/*",
]
