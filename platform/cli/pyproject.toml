[build-system]
# >=77 is the floor for PEP 639 (`license` as an SPDX expression + `license-files`); pinned at
# the current stable so the published metadata is what this file says it is.
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "examlops"
version = "0.62.0"
requires-python = ">=3.12"
description = "ExaMLOps shared schemas and the `exa` operator CLI."
# The PyPI project page. The repo README links relatively into docs/, which PyPI cannot
# resolve, so the package carries its own; tests/unit/test_package_metadata.py keeps it honest.
readme = "README.md"
license = "Apache-2.0"
# A copy of the root LICENSE: PEP 639 forbids license-files outside the project directory.
# tests/unit/test_package_metadata.py fails if the two ever differ.
license-files = ["LICENSE"]
authors = [{ name = "Mohsen Seyedkazemi Ardebili" }]
keywords = ["mlops", "hpc", "slurm", "flux", "mlflow", "ray-serve", "model-registry", "llmops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "typer>=0.12",
    # Imported directly at module load by cli/_help.py, cli/commands/explain_command.py and
    # cli/commands/docs_cmd.py, which walk the click command tree that Typer builds. It used to
    # arrive transitively through typer; typer 0.27 declares no click dependency at all, so a
    # clean `pip install examlops` produced an `exa` that died on `import click` before printing
    # anything. Declared here because this package imports it, transitive or not.
    "click>=8.5.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    # Imported at module load by examlops.resilience (HTTP client + timeouts) — a hard
    # runtime dependency of the CLI, not optional.
    "httpx>=0.27",
    # Imported directly at module load by cli/_output.py, which renders every table, panel
    # and error the CLI prints. It currently arrives via typer, but so did click until typer
    # 0.27 dropped it; a package that imports a module declares it.
    "rich>=13.0",
    # The local encrypted secret store (examlops.secrets) is the documented fallback that
    # works with no running OpenBao, so Fernet is part of the default path, not an extra.
    # Undeclared, `exa secrets set` failed with an error whose own remedy — "python -c 'from
    # cryptography.fernet import Fernet ...'" — could not be run either.
    "cryptography>=43.0",
    # Policy-as-code (examlops.policy) evaluates a rule's `when:` condition with it. It is a hard
    # dependency because its absence FAILS OPEN: a condition that cannot be evaluated does not
    # match, so a `deny ... when: ...` rule silently allowed everything in any process installed
    # without the `finops` extra (the control-plane and dashboard images and the control-plane CI
    # job were exactly that). Small, pure Python; the `finops` extra keeps listing it so existing
    # `examlops[finops]` installs still resolve.
    "simpleeval>=1.0",
]

[project.optional-dependencies]
# Agent-native surface: expose `exa` capabilities to LLM agents / MCP clients.
# Lazily imported by `examlops.mcp.server`; the core CLI works without it.
mcp = [
    "fastmcp>=3.4",
]
# Agent-observability consumers over OTLP/HTTP (ADR 0021 decision 2 — Langfuse ingests OTLP over
# HTTP only). Lazily imported by examlops.telemetry.otlp_http; without it a stdlib exporter using
# the already-installed OTLP protobuf encoder does the same job.
agentops = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]
# Statistical A/B analysis (`exa serve ab analyze`). Lazily imported by
# examlops.analysis.ab_stats; the rest of the CLI works without it.
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
]
# Declarative YAML/expression calculation providers (examlops.providers.expression).
# Lets a config-authored formula be evaluated safely without executing arbitrary code.
# Lazily imported; built-in Python providers work without it.
finops = [
    "simpleeval>=1.0",
]
# Identity federation (examlops.iam, ADR 0120 — and the examlops.oidc shim over it): verifying
# data-center IdP tokens, `exa auth login`, the dashboard's SSO and the control plane's federated
# bearer path. PyJWT is imported lazily, so the core CLI works without it.
oidc = [
    "pyjwt>=2.14.0",
]
# Whole-platform backup — object-store (MinIO/S3) tier + off-site replication
# (examlops.backup.objects_tier / remote). boto3 is lazily imported; the control-plane
# backup profile (SQLite + config tiers) works without it. The Postgres tier additionally
# needs the `pg_dump`/`pg_restore` binaries (postgresql-client) on PATH.
backup = [
    "boto3>=1.43.97",
]
# Keyless Sigstore signing of audit checkpoints (ADR 0028 decision 3, EXAMLOPS_AUDIT_TRANSPARENCY=
# sigstore). Lazily imported by examlops.audit_transparency; the Rekor backend (a dedicated ECDSA
# key + plain HTTPS) and every other audit path work without it.
audit-sigstore = [
    "sigstore>=4.5",
]
# In-process vLLM engine (`engine.mode: inproc`) for offline batch scoring on a GPU host.
# NOT needed to *serve*: the production path (VLLMServerEngine, ADR 0107) talks HTTP to a
# `vllm serve` process, so the GPU dependency lives in that process, not in the CLI.
# Referenced by engines/__init__.py's error message and docs/guides/llm-serving-engines.md.
serving-vllm = [
    "vllm>=0.28.0",
]
# SGLang runtime (RadixAttention, structured output) for the GPU host that runs
# `python -m sglang.launch_server`. NOT needed by the client: SGLangServerEngine talks HTTP
# to that server (ADR 0016 decision 1), so nothing in examlops imports sglang.
serving-sglang = [
    "sglang>=0.5.10",
]
# Fine-tuning (ADR 0044): `exa finetune --train` needs torch; `--backend peft` adapts the model
# with Hugging Face PEFT (peft pulls transformers/accelerate itself). Both are imported lazily by
# examlops.finetuning — `exa` starts without them, and the built-in torch-lora backend needs no peft.
finetune = [
    "torch>=2.13",
    "peft>=0.21",
]
# Postgres datastore engine (EXAMLOPS_DB_BACKEND=postgres, enterprise-readiness item 0.1).
# psycopg is imported only by examlops.storage.pg, which is reached only when that env var
# selects the Postgres backend — the default SQLite path never touches it.
postgres = [
    "psycopg[binary]>=3.3.5",
    # Connection pooling. Opening a connection is free on SQLite and is not on Postgres, and
    # `get_db()` opens one per call. Optional on purpose: without it examlops.storage.pg opens an
    # unpooled connection per call — slower, still correct.
    "psycopg-pool>=3.3",
]
# Advanced drift detectors (ADR 0022): River ADWIN/DDM + Evidently for concept drift. Lazily
# imported by examlops.drift_advanced.adapters; every detector has a pure-Python fallback, so
# `exa drift concept|estimate|profile|run-advanced` work without this extra. Two libraries the ADR
# names are deliberately NOT here, because they cannot share one resolution with the rest of this
# package: nannyml 0.13.1 (Python < 3.13 only; its s3fs dependency brings fsspec/botocore bounds
# that the `dataplane` and `backup` extras exclude, so the workspace lock has no solution) and
# whylogs 1.6.4 (references numpy.unicode_, removed in NumPy 2). Their adapters run when installed in a separate environment. Note evidently 0.7.23
# declares plotly<6, so the workspace lock resolves plotly 5.24.x (only copulas, via `synth`,
# uses plotly, and accepts it) — that bound is evidently's, not ours.
drift-advanced = [
    "river>=0.26.1",
    "evidently>=0.7.23",
]
# Fairness & subgroup monitoring (ADR 0025). Fairlearn's MetricFrame computes the slice metrics
# when installed; without it a pure-Python path computes the same numbers (held to parity by
# tests/unit/test_fairness_engine.py), so `exa fairness` works on a bare install too.
fairness = [
    "fairlearn>=0.14",
]
# Presidio NER supplement for PII detection (ADR 0026 clause 1). examlops.guardrails always runs
# its own regex detectors (email/phone/SSN/credit-card/IBAN/IP); Presidio, when installed AND
# opted into (EXAMLOPS_GUARDRAIL_PII_NER=1), ADDS the one class of PII a regex cannot find — a
# person's name, a place — via spaCy NER. Off by default: unavailable or unconfigured degrades
# to regex-only, exactly today's behaviour. A spaCy model (e.g. en_core_web_lg, Presidio's own
# default) is a separate one-time install this extra does not pull in — see
# docs/guides/guardrails.md.
guardrails-presidio = [
    "presidio-analyzer>=2.2",
]
# There is deliberately no `guardrails-llmguard` extra (ADR 0026 clause 3): llm-guard 0.3.16
# (latest, 2026-09-25) pins transformers==4.51.3, while this workspace needs transformers>=5 (vllm,
# sentence-transformers>=6), so `uv lock` cannot resolve both. The `llm_guard` check in
# examlops.guardrails.policy imports it lazily and is tested against a faithful fake; install
# `llm-guard` in a separate guardrail image (Python <3.13). Absent, a policy naming the check
# reports it unavailable (enforce blocks, monitor records). Add the extra when llm-guard lifts the pin.
# pgvector vector store (EXAMLOPS_VECTOR_BACKEND=pgvector, ADR 0020). Same driver as the
# `postgres` extra, named separately because the two are independent choices: the vector store can
# run on pgvector while platform state stays on SQLite, and the reverse.
vector = [
    "psycopg[binary]>=3.3.5",
    "psycopg-pool>=3.3",
]
# Qdrant vector store (EXAMLOPS_VECTOR_BACKEND=qdrant, ADR 0020 clause 1 — the scale-out option
# past what a shared Postgres can index). Lazily imported by examlops.vector_store.qdrant, which
# is only constructed when that backend is selected; the default sqlite/pgvector paths never
# touch it. Kept out of `vector` on purpose: pgvector and Qdrant are alternatives, and a login
# node running the CLI against pgvector should not pull a grpc stack it will never call.
qdrant = [
    "qdrant-client>=1.19.1",
]
# Cross-host locks, idempotency, and rate limiting. Imported only when
# EXAMLOPS_COORDINATOR=redis selects this backend.
coordination = [
    "redis>=8.1.0",
]
# Feature-store Redis online store (ADR 0017 clause 1): EXAMLOPS_FEATURE_ONLINE_STORE=redis puts a
# Redis serving tier in front of the durable platform.db table. Lazily imported by
# examlops.feature_store.online; without it the feature store degrades to the table.
features-online = [
    "redis>=8.1.0",
]
# Event backbone (ADR 0124): NATS JetStream publisher + durable consumers. Lazily imported;
# the default `log` publisher needs nothing.
events = [
    "nats-py>=2.15",
]
# Sigstore keyless model signing + keyless-signed SLSA provenance (ADR 0013, examlops.supplychain
# .keyless): Fulcio certificates and the Rekor transparency log. Lazily imported and only reached
# when EXAMLOPS_SIGNING_SCHEME=sigstore (or when verifying a `sigstore-v1` row); Ed25519/HMAC
# signing and verification need nothing beyond `cryptography`.
supplychain = [
    "sigstore>=4.5",
]
# Synthetic data generation (`exa data synth`, Next-Gen 40 · A7, ADR 0042). SDV is lazily
# imported by examlops.synth.generators; without it a pure-python Gaussian-copula fallback
# keeps every subcommand — including the fidelity/privacy release gate — working offline.
synth = [
    # `examlops.synth` imports pandas at module scope and the generators need numpy. They were
    # missing from this extra, so `pip install 'examlops[synth]'` still could not run
    # `exa data synth fit` — it died on a raw ModuleNotFoundError traceback. Neither belongs in
    # the base CLI, which stays light enough to install on a login node.
    "pandas>=2.0",
    "numpy>=1.26",
    "sdv>=1.37",
]
# Dataplane (ADR 0130): one extra per connector's dependencies, plus `dataplane` = everything the
# service image needs. Each connector's `extra` attribute (examlops.dataplane.connectors.*) names
# one of these keys — tests/unit/test_dataplane_connector_contract.py asserts they match.
dataplane-sql = [
    "sqlalchemy>=2.0",
    "pyarrow>=25.0",
    # Same floor as the `postgres`/`vector` extras above — one version of psycopg across the file.
    "psycopg[binary]>=3.3.5",
    "pymysql>=1.2",
]
dataplane-files = [
    "fsspec>=2026.7",
    # No s3fs: S3 goes through pyarrow's native filesystem (examlops.dataplane.s3), because
    # s3fs's aiobotocore pin caps botocore below the workspace's boto3 floor — it can never lock.
    "httpx>=0.28",
    "pyarrow>=25.0",
    # fsspec's SFTP filesystem (the files connector's sftp:// scheme) needs paramiko.
    "paramiko>=5.0",
]
dataplane-kafka = [
    "confluent-kafka>=2.15",
    "pyarrow>=25.0",
]
# fastapi stays capped below 0.137 to match the root/pipelines/serving workspace pin: ray 2.55's
# `@serve.ingress` cloudpickles a FastAPI app and fastapi>=0.137 holds an unpicklable
# `_thread.lock`. This extra never touches Ray, but `uv.lock` resolves one version of fastapi for
# the whole workspace, so an uncapped floor here would make the lock unsatisfiable.
dataplane-service = [
    "fastapi>=0.136.3,<0.137",
    "uvicorn[standard]>=0.52.4",
    "prometheus-client>=0.20",
]
dataplane = [
    "examlops[dataplane-sql,dataplane-files,dataplane-kafka,dataplane-service]",
]
# Continuous-evaluation engines (ADR 0007 decision 1). Both lazily imported by
# examlops.evaluation.engines; without them the native evaluators, the pure-python Ragas-formula
# fallbacks and the gateway rubric judges keep `exa eval run`/`exa eval online` working. Their
# telemetry is switched off before import — eval content never leaves the cluster.
# There is deliberately no `eval-deepeval` extra: deepeval 4.2.6 (latest, 2026-09-25) pins
# click<8.4 while this package needs click>=8.5, so `uv lock` cannot resolve the two together.
# The DeepEval wrapper is written and tested against a faithful fake and activates when deepeval is
# importable (e.g. a separate evaluator image); add the extra when deepeval lifts the click cap.
# Ragas is not in this extra: ragas 0.4.3 needs `datasets`, whose every release caps
# fsspec<=2026.6, while the `dataplane` extras need fsspec>=2026.7. It ships only in `rag-eval`,
# declared as conflicting with the dataplane extras in [tool.uv] below. Ragas's non-LLM text metrics are thin wrappers over rapidfuzz and rouge-score, so this extra installs
# those two directly and examlops computes the same numbers Ragas would; an interpreter that has
# ragas itself (a separate evaluator image) uses Ragas's own classes instead.
eval-metrics = [
    "rapidfuzz>=3.14.6",
    "rouge-score>=0.1.2",
]
# RAG (ADR 0019). All three are lazily imported; without them `exa rag` chunks natively, scores
# retrieval with the built-in id-set metrics, and the serving endpoint fails to import with a
# ModuleNotFoundError naming fastapi.
# LlamaIndex's SentenceSplitter as the ingest chunker (`--framework llamaindex|auto`). The floor
# is 0.12.42, not the current 0.14.x, for a compatibility reason: llama-index-core>=0.13 requires
# setuptools>=80.9 and the workspace caps setuptools <80 for vllm (root pyproject), so any higher
# floor makes `uv lock` unsatisfiable. A standalone `pip install 'examlops[rag-llamaindex]'` still
# gets the latest release; the chunker is verified against both 0.12.42 and 0.14.25.
rag-llamaindex = [
    "llama-index-core>=0.12.42",
]
# Ragas' non-LLM IDBasedContextPrecision/Recall behind the C2 evaluators (`exa rag eval`). No judge
# model is called. langchain-community is capped below 0.4 for a compatibility reason, not by
# choice: ragas 0.4.3 (current) imports `langchain_community.chat_models.vertexai`, which 0.4.x
# removed, so `import ragas` fails outright against the latest langchain-community (verified
# 2026-09-25). Drop the cap when a ragas release stops importing it.
rag-eval = [
    "ragas>=0.4.3",
    "langchain-community>=0.3.31,<0.4",
]
# The RAG serving endpoint (serving/rag_pipeline/app.py). Same fastapi cap as
# `dataplane-service`, for the same workspace-lock reason.
rag-service = [
    "fastapi>=0.136.3,<0.137",
    "uvicorn[standard]>=0.52.4",
    "prometheus-client>=0.20",
]

[project.scripts]
exa = "examlops.cli.main:app"

[project.urls]
Homepage = "https://mskazemi.com/ExaMLOps/"
Documentation = "https://mskazemi.com/ExaMLOps/"
Repository = "https://github.com/MSKazemi/ExaMLOps"
Issues = "https://github.com/MSKazemi/ExaMLOps/issues"
Changelog = "https://github.com/MSKazemi/ExaMLOps/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# D2 NIST AI RMF catalogue (and any other in-package data files) must ship in wheels.
examlops = [
    "governance/*.yaml",
    "events/event-contract.json",
    # ADR 0142 d4: the pinned KServe CRD schemas every KServe render is validated against.
    "serving/substrates/kserve_crds/*/*",
    # ADR 0015 d1: the pinned KubeRay RayService schema every KubeRay render is validated against.
    "serving/substrates/kuberay_crds/*/*",
    # ADR 0078: PEP 561 marker — SDK consumers get the typed public surface under mypy/pyright.
    "py.typed",
]

[tool.uv]
# `rag-eval` cannot share an environment with the dataplane file connector: ragas 0.4.3 requires
# `datasets`, whose newest release (5.0.x) caps fsspec at <=2026.6, while `dataplane-files`
# floors fsspec at 2026.7. Declaring the conflict lets the workspace lock both (in separate
# forks) instead of making `uv lock` unsatisfiable; install `rag-eval` in its own environment.
conflicts = [
    [{ extra = "rag-eval" }, { extra = "dataplane-files" }],
    [{ extra = "rag-eval" }, { extra = "dataplane" }],
    # sglang>=0.5.10 (the first release past PYSEC-2026-1919/-537/-539/-3063) pins
    # outlines-core 0.1.26, which vllm>=0.28 cannot share. They are alternative inference SERVERS,
    # each run in its own image (examlops talks to either over HTTP and imports neither), so the
    # two extras are declared mutually exclusive rather than holding sglang at a vulnerable 0.5.2.
    [{ extra = "serving-sglang" }, { extra = "serving-vllm" }],
]
